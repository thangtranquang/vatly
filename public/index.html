  {f:'k: < 1 tắt · = 1 ổn định · > 1 bùng nổ',parts:[['k','hệ số nhân neutron']],why:'Thanh điều khiển hấp thụ bớt neutron để giảm k; rút thanh ra thì k tăng.'}],
 memo:'"Phân là chia ra, nhiệt hạch là nóng mới ghép." Lò phản ứng: "k bằng 1, thanh điều khiển giữ nhịp".',
 wrong:[['Thanh điều khiển dùng để làm chậm neutron.','Làm chậm neutron là việc của chất làm chậm (nước, than chì). Thanh điều khiển hấp thụ neutron để điều chỉnh k.'],['Năng lượng Mặt Trời đến từ phản ứng phân hạch.','Mặt Trời toả năng lượng nhờ phản ứng nhiệt hạch tổng hợp hiđrô thành heli.']],
 quiz:[
 {t:'mc',q:'Trong lò phản ứng hạt nhân, thanh điều khiển (chứa bo hoặc cađimi) có tác dụng:',c:0,o:[['Hấp thụ bớt neutron để giữ hệ số nhân neutron k ≈ 1','Đúng. Cắm sâu thanh thì hấp thụ nhiều neutron hơn, k giảm; rút ra thì k tăng.'],['Làm chậm neutron để dễ gây phân hạch','Sai. Đó là vai trò của chất làm chậm như nước hoặc than chì.'],['Tải nhiệt ra khỏi lò','Sai. Đó là vai trò của chất tải nhiệt.'],['Cung cấp thêm neutron cho lò','Sai. Thanh điều khiển lấy bớt neutron chứ không cung cấp.']]},
 {t:'mc',q:'Phản ứng phân hạch dây chuyền tăng vọt, không kiểm soát được khi hệ số nhân neutron:',c:0,o:[['k > 1','Đúng. Mỗi thế hệ có nhiều neutron hơn thế hệ trước, số phân hạch tăng theo cấp số nhân.'],['k = 1','Sai. k = 1 là trạng thái duy trì ổn định, như trong lò phản ứng.'],['k < 1','Sai. k < 1 thì phản ứng tắt dần.'],['k = 0','Sai. Khi đó phản ứng dừng ngay.']]},
 {t:'mc',q:'Điều kiện để phản ứng nhiệt hạch xảy ra là:',c:0,o:[['Nhiệt độ rất cao để các hạt nhân nhẹ có đủ động năng thắng lực đẩy điện và tiến lại rất gần nhau','Đúng. Chỉ khi tiến sát nhau tới khoảng cách cỡ 10⁻¹⁵ m, lực hạt nhân mới kéo chúng kết hợp lại.'],['Có neutron chậm bắn vào','Sai. Đó là điều kiện của phân hạch.'],['Áp suất thấp','Sai. Trong lòng Mặt Trời, áp suất và mật độ rất lớn.'],['Dùng hạt nhân nặng như urani','Sai. Nhiệt hạch dùng hạt nhân nhẹ như đơteri, triti.']]},
 {t:'ds',q:'So sánh phản ứng phân hạch và phản ứng nhiệt hạch:',s:[['Cả hai đều là phản ứng toả năng lượng.',true,'Đúng. Cả hai đều tạo ra hạt nhân có năng lượng liên kết riêng lớn hơn.'],['Phân hạch là quá trình các hạt nhân nhẹ kết hợp thành hạt nhân nặng hơn.',false,'Sai. Đó là nhiệt hạch. Phân hạch là hạt nhân nặng vỡ ra.'],['Tính theo cùng khối lượng nhiên liệu, nhiệt hạch toả năng lượng nhiều hơn phân hạch.',true,'Đúng. Khoảng 3,5 MeV mỗi nucleon so với khoảng 0,85 MeV mỗi nucleon của phân hạch.'],['Năng lượng Mặt Trời chủ yếu do phản ứng phân hạch.',false,'Sai. Mặt Trời toả năng lượng nhờ nhiệt hạch.']]},
 {t:'sa',q:'Mỗi phân hạch ²³⁵U toả ra khoảng 200 MeV. Tính năng lượng toả ra khi 1 kg ²³⁵U phân hạch hết, theo đơn vị 10¹³ J (làm tròn đến 1 chữ số thập phân). Lấy N_A = 6,02·10²³ mol⁻¹; 1 MeV = 1,6·10⁻¹³ J; M = 235 g/mol.',a:8.2,tol:.06,u:'·10¹³ J',sol:'Số hạt nhân: N = (1000/235)·6,02·10²³ ≈ 2,56·10²⁴. E = N·200·1,6·10⁻¹³ ≈ 8,2·10¹³ J, tương đương năng lượng đốt gần 3 000 tấn than đá.'}]},

{id:'c4-5',ch:4,no:'4.5',title:'Tia phóng xạ và an toàn phóng xạ',sim:'shield',
 one:'Tia α, β, γ khác nhau về điện tích và khả năng đâm xuyên. Bảo vệ bằng ba cách: giảm thời gian, tăng khoảng cách, che chắn.',
 essence:`<p><b>Tính chất của các tia phóng xạ:</b></p>
 <ul><li><b>Tia α</b> (hạt nhân ⁴He, điện tích +2e): ion hoá rất mạnh nhưng đâm xuyên yếu, đi được vài cm trong không khí, <b>bị một tờ giấy chặn lại</b>. Trong điện trường, lệch về phía bản âm.</li>
 <li><b>Tia β</b> (electron hoặc positron): ion hoá yếu hơn α, đi được vài mét trong không khí, <b>bị tấm nhôm dày vài mm chặn lại</b>. β⁻ lệch về bản dương, β⁺ lệch về bản âm, và lệch mạnh hơn α vì nhẹ hơn rất nhiều.</li>
 <li><b>Tia γ</b> (photon năng lượng cao): không mang điện nên <b>không bị lệch</b> trong điện trường; đâm xuyên mạnh nhất, cần <b>chì hoặc bê tông dày</b> để làm giảm cường độ.</li></ul>
 <p><b>Tác hại:</b> tia phóng xạ ion hoá các phân tử trong tế bào, có thể phá huỷ tế bào và làm hỏng DNA. Liều chiếu xạ có tác động sinh học được đo bằng sievert (Sv).</p>
 <p><b>Ba nguyên tắc an toàn:</b></p>
 <ul><li><b>Thời gian:</b> tiếp xúc càng ngắn, liều nhận càng ít.</li>
 <li><b>Khoảng cách:</b> với nguồn điểm, cường độ bức xạ giảm theo <b>bình phương khoảng cách</b>; lùi xa gấp đôi thì liều chỉ còn ¼.</li>
 <li><b>Che chắn:</b> dùng vật liệu phù hợp với từng loại tia.</li></ul>
 <p>Chất phóng xạ nguồn α tuy dễ chặn nhưng <b>rất nguy hiểm khi lọt vào trong cơ thể</b> (hít, nuốt) vì ion hoá mạnh. Quanh ta luôn có phóng xạ tự nhiên: khí radon, tia vũ trụ, đồng vị ⁴⁰K trong thực phẩm. Khu vực có nguồn phóng xạ được đánh dấu bằng biển báo hình tam giác vàng có biểu tượng ba cánh quạt.</p>`,
 observe:['Chọn "Tờ giấy": chỉ có α bị chặn, β và γ vẫn tới máy đếm.','Chọn "Nhôm" và tăng bề dày: β bị chặn dần, γ gần như không đổi.','Chọn "Chì" và tăng bề dày: γ giảm dần nhưng không bao giờ bị chặn hoàn toàn.','Bật điện trường: α lệch nhẹ về bản âm, β⁻ lệch mạnh về bản dương, γ đi thẳng.','Kéo khoảng cách từ 1 m lên 2 m: liều nhận còn 25%.'],
 formulas:[{f:'I ∝ 1/r²',parts:[['I','cường độ bức xạ nhận được'],['r','khoảng cách tới nguồn điểm']],why:'Bức xạ toả đều ra mọi hướng, trải trên mặt cầu có diện tích 4πr². Xa gấp đôi thì diện tích gấp 4, nên mỗi chỗ nhận được ¼.'},
  {f:'α < β < γ (đâm xuyên)',parts:[['α','giấy chặn'],['β','nhôm vài mm chặn'],['γ','chì, bê tông dày làm giảm']],why:'Hạt càng nặng, điện tích càng lớn thì càng dễ va chạm và ion hoá, nên mất năng lượng nhanh và đi được ít. Khả năng ion hoá theo thứ tự ngược lại.'}],
 memo:'"α yếu, β vừa, γ giỏi" (đâm xuyên). An toàn: "Ít thời gian, xa khoảng cách, dày che chắn".',
 wrong:[['Nguồn α bị giấy chặn nên hoàn toàn vô hại.','Nếu chất phát α lọt vào cơ thể thì α ion hoá rất mạnh ngay trong tế bào, cực kì nguy hiểm.'],['Lùi ra xa gấp đôi thì liều nhận giảm một nửa.','Với nguồn điểm, liều giảm theo bình phương khoảng cách: xa gấp đôi thì còn ¼.']],
 quiz:[
 {t:'mc',q:'Tia phóng xạ nào có khả năng đâm xuyên mạnh nhất?',c:0,o:[['Tia γ','Đúng. Tia γ không mang điện, ít tương tác nên đi xuyên được rất xa, cần chì dày để làm giảm.'],['Tia α','Sai. Tia α đâm xuyên yếu nhất, một tờ giấy đã chặn được.'],['Tia β⁻','Sai. Tia β⁻ bị tấm nhôm vài mm chặn lại.'],['Tia β⁺','Sai. Tia β⁺ cũng bị nhôm vài mm chặn lại.']]},
 {t:'mc',q:'Cho chùm tia phóng xạ đi qua điện trường giữa hai bản kim loại tích điện trái dấu. Tia không bị lệch là:',c:0,o:[['Tia γ','Đúng. Tia γ là photon, không mang điện nên không chịu lực điện.'],['Tia α','Sai. Tia α mang điện dương, lệch về phía bản âm.'],['Tia β⁻','Sai. Tia β⁻ mang điện âm, lệch về phía bản dương.'],['Tia β⁺','Sai. Tia β⁺ mang điện dương, lệch về phía bản âm.']]},
 {t:'mc',q:'Một người đứng cách một nguồn phóng xạ (coi là nguồn điểm) 2 m. Nếu lùi ra cách nguồn 4 m thì cường độ bức xạ người đó nhận được:',c:0,o:[['Giảm 4 lần','Đúng. Cường độ tỉ lệ với 1/r²: (2/4)² = 1/4.'],['Giảm 2 lần','Sai. Cường độ giảm theo bình phương khoảng cách, không theo bậc nhất.'],['Giảm 16 lần','Sai. Đây là khi khoảng cách tăng 4 lần (từ 1 m lên 4 m).'],['Không đổi','Sai. Càng xa nguồn, bức xạ càng trải rộng nên mỗi chỗ nhận càng ít.']]},
 {t:'ds',q:'Xét các phát biểu về an toàn phóng xạ:',s:[['Ba nguyên tắc cơ bản là: giảm thời gian tiếp xúc, tăng khoảng cách tới nguồn và che chắn.',true,'Đúng. Đây là ba nguyên tắc an toàn bức xạ.'],['Tia α bị một tờ giấy chặn lại nên chất phát tia α vô hại kể cả khi nuốt vào cơ thể.',false,'Sai. Bên trong cơ thể không có gì che chắn; α ion hoá rất mạnh nên cực kì nguy hiểm.'],['Để che chắn tia γ, người ta dùng chì hoặc bê tông dày.',true,'Đúng. Vật liệu đặc, dày làm giảm mạnh cường độ tia γ.'],['Trong tự nhiên không có phóng xạ, mọi phóng xạ đều do con người tạo ra.',false,'Sai. Luôn có phóng xạ tự nhiên từ radon, tia vũ trụ, ⁴⁰K trong thực phẩm, đá và đất.']]},
 {t:'sa',q:'Mỗi lớp chì dày 1 cm làm cường độ chùm tia γ giảm đi một nửa. Cần lớp chì dày tổng cộng bao nhiêu xentimét để cường độ chùm tia chỉ còn 1/8 so với ban đầu?',a:3,tol:.01,u:'cm',sol:'Mỗi 1 cm cường độ giảm một nửa: sau 1 cm còn ½, 2 cm còn ¼, 3 cm còn ⅛. Cần 3 cm chì.'}]}

let PROG={};
function saveProg(){}

function chip(best,max){if(best==null)return '<span class="chip">Chưa làm</span>';const r=best/max;return '<span class="chip '+(r>=.8?'ok':'mid')+'">'+(r>=.8?'Đã vững · ':'')+fmt(best,2)+'/'+fmt(max,1)+'</span>';}
function hashStr(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}
function perm(n,seed){const a=[...Array(n).keys()];let s=seed||1;for(let i=n-1;i>0;i--){s=(Math.imul(s,1664525)+1013904223)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const fx=s=>esc(s).replace(/N_A/g,'N<sub>A</sub>');

/* ================================================================ quiz */
const sx=s=>esc(s).replace(/([pVTN])_A/g,'$1<sub>A</sub>');
function renderQuiz(host,items,key,onDone,mk){
  const rec=mk?mk():null;host.innerHTML='';const res=new Array(items.length).fill(null);
  items.forEach((q,qi)=>{const d=document.createElement('div');d.className='qi';const id=key+'-'+qi;
    const type=q.t==='mc'?'Trắc nghiệm':q.t==='ds'?'Đúng / Sai':'Trả lời ngắn';
    d.innerHTML='<div class="qhead"><span class="qtype">'+type+'</span><span class="qnum">Câu '+(qi+1)+'</span><span class="qpts">'+(q.t==='ds'?'tối đa 1 điểm':'0,25 điểm')+'</span></div><p class="qq">'+sx(q.q)+'</p>'+(q.fig?'<div class="qfig">'+q.fig+'</div>':'');
    host.appendChild(d);
    if(q.t==='mc'){const order=q.fixed?[0,1,2,3]:perm(q.o.length,hashStr(id));const box=document.createElement('div');box.className='mopts';d.appendChild(box);const fb=document.createElement('div');fb.hidden=true;d.appendChild(fb);
      order.forEach((oi,k)=>{const b=document.createElement('button');b.type='button';b.className='mo';b.id=id+'-o'+k;b.innerHTML='<span class="ml">'+'ABCD'[k]+'</span><span>'+sx(q.o[oi][0])+'</span>';box.appendChild(b);
        b.addEventListener('click',()=>{const ok=oi===q.c;box.querySelectorAll('.mo').forEach((bb,kk)=>{bb.disabled=true;if(order[kk]===q.c)bb.classList.add('right');});if(!ok)b.classList.add('wrong');
          const others=order.filter(x=>x!==oi&&x!==q.c).map(x=>'<li><b>'+'ABCD'[order.indexOf(x)]+'.</b> '+sx(q.o[x][1])+'</li>').join('');
          fb.className='fb '+(ok?'ok':'no');fb.innerHTML='<div class="h">'+(ok?'Chính xác!':'Chưa đúng.')+'</div><p><b>Bạn chọn '+'ABCD'[k]+':</b> '+sx(q.o[oi][1])+'</p>'+(ok?'':'<p><b>Đáp án '+'ABCD'[order.indexOf(q.c)]+':</b> '+sx(q.o[q.c][1])+'</p>')+'<details><summary>Vì sao các phương án còn lại sai</summary><ul>'+others+'</ul></details>';fb.hidden=false;
          res[qi]=ok?.25:0;rec&&rec.answer([recRow(q,{pick:oi},ok,ok?.25:0,.25)]);check();});});}
    else if(q.t==='ds'){const picks=new Array(q.s.length).fill(null),sv=new Array(q.s.length).fill(null);q.s.forEach((s,si)=>{const r=document.createElement('div');r.className='dsr';r.innerHTML='<div class="dsline"><span class="dl">'+'abcd'[si]+')</span><span class="dt">'+sx(s[0])+'</span><div class="dsb"><button type="button" id="'+id+'-'+si+'-d">Đúng</button><button type="button" id="'+id+'-'+si+'-s">Sai</button></div></div><div class="fb" hidden></div>';d.appendChild(r);
        const bs=r.querySelectorAll('.dsb button'),fb=r.querySelector('.fb');bs.forEach((b,bi)=>b.addEventListener('click',()=>{const said=bi===0,ok=said===s[1];bs.forEach(x=>x.disabled=true);b.classList.add(ok?'right':'wrong');if(!ok)bs[s[1]?0:1].classList.add('right');
          fb.className='fb '+(ok?'ok':'no');fb.innerHTML='<span class="h">'+(ok?'Chính xác. ':'Chưa đúng. ')+'</span>'+sx(s[2]);fb.hidden=false;picks[si]=ok;sv[si]=said;
          if(picks.every(x=>x!==null)){const n=picks.filter(Boolean).length;res[qi]=DSP[n];rec&&rec.answer([recRow(q,{picks:sv},n===4,DSP[n],1)]);const sm=document.createElement('p');sm.className='qnote';sm.innerHTML='Bạn đúng <b>'+n+'/4 ý</b>, được <b>'+fmt(DSP[n],2)+' điểm</b> (thang THPT: 1 ý 0,1 · 2 ý 0,25 · 3 ý 0,5 · 4 ý 1).';d.appendChild(sm);check();}}));});}
    else{const row=document.createElement('div');row.className='sarow';row.innerHTML='<input type="text" inputmode="decimal" id="'+id+'-in" aria-label="Đáp số" placeholder="Nhập đáp số"><span class="u">'+esc(q.u||'')+'</span>';const b=button(row,'Kiểm tra',()=>{},'fill');d.appendChild(row);const fb=document.createElement('div');fb.hidden=true;d.appendChild(fb);const inp=row.querySelector('input');
      const go=()=>{const v=parseFloat(inp.value.replace(/\s/g,'').replace(',','.'));if(isNaN(v)){fb.className='fb no';fb.innerHTML='Hãy nhập một số, ví dụ 2,5.';fb.hidden=false;return;}const ok=Math.abs(v-q.a)<=q.tol;inp.disabled=true;b.disabled=true;
        fb.className='fb '+(ok?'ok':'no');fb.innerHTML='<div class="h">'+(ok?'Chính xác!':'Chưa đúng.')+' Đáp số: '+String(q.a).replace('.',',')+' '+esc(q.u||'')+'</div><p>'+sx(q.sol)+'</p>';fb.hidden=false;res[qi]=ok?.25:0;rec&&rec.answer([recRow(q,{value:inp.value.trim()},ok,ok?.25:0,.25)]);check();};
      b.addEventListener('click',go);inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});}});
  const sum=document.createElement('div');sum.hidden=true;host.appendChild(sum);
  function check(){if(res.some(x=>x===null))return;const tot=res.reduce((a,b)=>a+b,0),max=items.reduce((a,q)=>a+itemMax(q),0);sum.className='qsum';sum.hidden=false;
    sum.innerHTML='<span class="sc">'+fmt(tot,2)+' / '+fmt(max,Math.abs(max*10-Math.round(max*10))<1e-9?1:2)+'</span><span>'+(tot/max>=.8?'Rất tốt! Bạn đã nắm vững phần này.':tot/max>=.5?'Khá rồi. Đọc lại giải thích ở các câu sai rồi làm lại nhé.':'Hãy xem lại phần Bản chất và Hình động, rồi làm lại.')+'</span>';
    const again=button(sum,'Làm lại',()=>{renderQuiz(host,items,key+'r',onDone,mk);host.scrollIntoView({block:'start'});});rec&&rec.finish(tot,max);onDone&&onDone(tot,max);}
}

 {t:'ds',ls:'c1-4',q:'Một học sinh đo nhiệt dung riêng của nước: dùng dây đun công suất 50 W đun 0,2 kg nước. Sau 168 s, nhiệt độ nước tăng thêm 10 °C. Bỏ qua hao phí.',s:[['Nhiệt lượng dây đun cung cấp là 8400 J.',true,'Đúng. Q = P·τ = 50·168 = 8400 J.'],['Nhiệt dung riêng đo được là 4200 J/(kg·K).',true,'Đúng. c = Q/(m·Δt) = 8400/(0,2·10) = 4200 J/(kg·K).'],['Nếu thực tế có hao phí nhiệt ra môi trường thì giá trị c tính được sẽ nhỏ hơn giá trị thật.',false,'Sai. Có hao phí thì nước nóng lên ít hơn (Δt nhỏ), nên c = Pτ/(mΔt) tính ra lớn hơn giá trị thật.'],['Đun tiếp đến khi nước sôi, trong lúc sôi nhiệt độ của nước tiếp tục tăng đều.',false,'Sai. Trong lúc sôi, nhiệt độ không đổi; nhiệt cung cấp dùng để hoá hơi.']]},
 {t:'ds',ls:'c2-4',q:'Một bình kín dung tích 10 lít chứa khí ở 27 °C, áp suất 1,5·10⁵ Pa. Lấy R = 8,31 J/(mol·K).',s:[['Số mol khí trong bình khoảng 0,6 mol.',true,'Đúng. n = pV/(RT) = 1,5·10⁵·10⁻²/(8,31·300) ≈ 0,60 mol.'],['Nung bình lên 127 °C thì áp suất khí là 2·10⁵ Pa.',true,'Đúng. Đẳng tích: p₂ = p₁·T₂/T₁ = 1,5·10⁵·400/300 = 2·10⁵ Pa.'],['Khi nung nóng, khí thực hiện công đẩy thành bình.',false,'Sai. Bình kín, thể tích không đổi nên khí không thực hiện công.'],['Khi nung nóng, mật độ phân tử khí trong bình tăng.',false,'Sai. Số phân tử và thể tích đều không đổi nên mật độ không đổi. Áp suất tăng vì phân tử chạy nhanh hơn.']]},
 {t:'ds',ls:'c3-4',q:'Một khung dây phẳng gồm 50 vòng, diện tích mỗi vòng 200 cm², quay đều với tốc độ 25 vòng/giây trong từ trường đều B = 0,2 T, trục quay vuông góc với đường sức từ.',s:[['Từ thông cực đại qua khung là 0,2 Wb.',true,'Đúng. Φ₀ = N·B·S = 50·0,2·0,02 = 0,2 Wb.'],['Tần số của suất điện động là 50 Hz.',false,'Sai. f bằng số vòng quay mỗi giây: f = 25 Hz.'],['Suất điện động cực đại khoảng 31,4 V.',true,'Đúng. ω = 2π·25 = 50π rad/s; E₀ = Φ₀·ω = 0,2·50π = 10π ≈ 31,4 V.'],['Khi mặt khung vuông góc với đường sức thì suất điện động bằng 0.',true,'Đúng. Lúc đó từ thông cực đại, tốc độ biến thiên từ thông bằng 0 nên e = 0.']]},
 {t:'ds',ls:'c4-3',q:'Iốt phóng xạ ¹³¹I dùng trong y tế có chu kì bán rã 8 ngày. Một bệnh viện nhận một mẫu có độ phóng xạ ban đầu H₀.',s:[['Sau 16 ngày, độ phóng xạ của mẫu còn H₀/4.',true,'Đúng. 16 ngày = 2T, độ phóng xạ giảm còn (1/2)² = 1/4.'],['Sau 8 ngày, một nửa số hạt nhân ¹³¹I đã bị phân rã.',true,'Đúng. Đó chính là định nghĩa chu kì bán rã.'],['Bảo quản mẫu trong tủ lạnh sẽ làm mẫu phân rã chậm hơn.',false,'Sai. Phóng xạ không phụ thuộc nhiệt độ.'],['Sau 24 ngày, số hạt nhân đã phân rã chiếm 87,5% số hạt nhân ban đầu.',true,'Đúng. 24 ngày = 3T, còn lại 1/8 = 12,5%, đã phân rã 87,5%.']]},
 {t:'sa',ls:'c1-4',q:'Thả một quả cầu nhôm khối lượng 0,2 kg ở 100 °C vào 0,4 kg nước ở 20 °C. Bỏ qua trao đổi nhiệt với bình và môi trường; c(nhôm) = 880 J/(kg·K), c(nước) = 4200 J/(kg·K). Nhiệt độ khi cân bằng là bao nhiêu °C? (Làm tròn đến hàng đơn vị)',a:28,tol:.5,u:'°C',sol:'0,2·880·(100 − t) = 0,4·4200·(t − 20) ⇒ 176(100 − t) = 1680(t − 20) ⇒ 51 200 = 1856·t ⇒ t ≈ 27,6 ≈ 28 °C.'},
 {t:'sa',ls:'c2-2',q:'Một quả bóng có dung tích 2,5 lít, ban đầu không có không khí. Mỗi lần bơm đưa được 125 cm³ không khí ở áp suất 1 atm vào bóng. Coi nhiệt độ không đổi. Sau bao nhiêu lần bơm thì áp suất khí trong bóng là 3 atm?',a:60,tol:.5,u:'lần',sol:'Khí trong bóng: p·V = 3·2,5 = 7,5 atm·lít. Lượng khí này ở 1 atm chiếm 7,5 lít = 7500 cm³. Số lần bơm: 7500/125 = 60 lần.'},
 {t:'sa',ls:'c2-5',q:'Tính tốc độ căn quân phương của phân tử khí oxi O₂ (M = 32 g/mol) ở 27 °C, theo m/s. Lấy R = 8,31 J/(mol·K). (Làm tròn đến hàng đơn vị)',a:483,tol:1,u:'m/s',sol:'v = √(3RT/M) = √(3·8,31·300/0,032) ≈ √233 719 ≈ 483 m/s. Chú ý đổi M = 0,032 kg/mol.'},
 {t:'sa',ls:'c3-2',q:'Một đoạn dây dẫn dài 50 cm mang dòng điện 4 A đặt vuông góc với đường sức của một từ trường đều thì chịu lực từ 0,6 N. Cảm ứng từ của từ trường là bao nhiêu tesla?',a:.3,tol:.002,u:'T',sol:'B = F/(I·l) = 0,6/(4·0,5) = 0,3 T.'},
 {t:'sa',ls:'c4-2',q:'Hạt nhân ¹²₆C có khối lượng 11,9967 u. Cho mₚ = 1,0073 u, mₙ = 1,0087 u, 1 u = 931,5 MeV/c². Năng lượng liên kết riêng của hạt nhân này là bao nhiêu MeV/nucleon? (Làm tròn đến 2 chữ số thập phân)',a:7.71,tol:.006,u:'MeV/nucleon',sol:'Δm = 6·1,0073 + 6·1,0087 − 11,9967 = 0,0993 u. W = 0,0993·931,5 ≈ 92,50 MeV. W/A = 92,50/12 ≈ 7,71 MeV/nucleon.'},
 {t:'sa',ls:'c4-3',q:'Một chất phóng xạ có chu kì bán rã 5 giờ. Ban đầu có 80 g chất này. Sau 15 giờ, khối lượng chất phóng xạ còn lại là bao nhiêu gam?',a:10,tol:.01,u:'g',sol:'15 giờ = 3T. m = 80·(1/2)³ = 80/8 = 10 g.'}]},

2:{name:'Đề thi thử số 2',items:[
 {t:'mc',ls:'c1-1',q:'Sự bay hơi của chất lỏng có đặc điểm nào sau đây?',c:0,o:[['Xảy ra ở mặt thoáng của chất lỏng, ở mọi nhiệt độ','Đúng. Luôn có những phân tử ở mặt thoáng đủ nhanh để thoát ra ngoài.'],['Chỉ xảy ra ở nhiệt độ sôi','Sai. Đó là đặc điểm của sự sôi.'],['Xảy ra cả trong lòng chất lỏng','Sai. Hoá hơi trong lòng chất lỏng (tạo bọt) là sự sôi.'],['Không phụ thuộc vào diện tích mặt thoáng','Sai. Mặt thoáng càng rộng, bay hơi càng nhanh.']]},
 {t:'mc',ls:'c1-1',q:'Đun nước trên đỉnh núi cao, nơi áp suất khí quyển nhỏ hơn 1 atm, thì nước sôi ở nhiệt độ:',c:0,o:[['Thấp hơn 100 °C','Đúng. Nhiệt độ sôi giảm khi áp suất trên mặt chất lỏng giảm.'],['Cao hơn 100 °C','Sai. Nhiệt độ sôi chỉ cao hơn 100 °C khi áp suất lớn hơn 1 atm, như trong nồi áp suất.'],['Đúng bằng 100 °C','Sai. 100 °C là nhiệt độ sôi ở áp suất 1 atm.'],['Nước không thể sôi','Sai. Nước vẫn sôi, chỉ là ở nhiệt độ thấp hơn.']]},
 {t:'mc',ls:'c1-2',q:'Trong quá trình chất khí nhận nhiệt và sinh công thì các đại lượng trong ΔU = A + Q thoả mãn:',c:0,o:[['Q > 0 và A < 0','Đúng. Nhận nhiệt nên Q dương; sinh công (thực hiện công lên vật khác) nên A âm.'],['Q < 0 và A > 0','Sai. Đây là trường hợp khí toả nhiệt và nhận công.'],['Q > 0 và A > 0','Sai. A > 0 là khí nhận công (bị nén), không phải sinh công.'],['Q < 0 và A < 0','Sai. Đây là trường hợp khí toả nhiệt và sinh công.']]},
 {t:'mc',ls:'c1-3',q:'Nhiệt độ −40 °C ứng với bao nhiêu độ F?',c:0,o:[['−40 °F','Đúng. t(°F) = 1,8·(−40) + 32 = −72 + 32 = −40 °F. Đây là nhiệt độ duy nhất có số đo bằng nhau ở hai thang.'],['−72 °F','Sai. Quên cộng thêm 32.'],['104 °F','Sai. Đã bỏ dấu âm của −40.'],['−8 °F','Sai. Chỉ cộng 32 mà quên nhân 1,8.']]},
 {t:'mc',ls:'c1-5',q:'Cần cung cấp bao nhiêu nhiệt lượng để 0,5 kg nước đá ở −10 °C chuyển hoàn toàn thành nước ở 0 °C? Biết c(đá) = 2100 J/(kg·K), λ = 3,34·10⁵ J/kg.',c:0,o:[['1,775·10⁵ J','Đúng. Làm nóng đá: 0,5·2100·10 = 10 500 J; nóng chảy: 0,5·3,34·10⁵ = 167 000 J. Tổng 177 500 J.'],['1,67·10⁵ J','Sai. Quên giai đoạn làm nóng đá từ −10 °C lên 0 °C.'],['1,05·10⁴ J','Sai. Chỉ tính phần làm nóng đá, quên phần nóng chảy.'],['3,445·10⁵ J','Sai. Quên nhân λ với khối lượng 0,5 kg.']]},
 {t:'mc',ls:'c2-1',q:'Số phân tử nước có trong 18 g nước là (M = 18 g/mol, N_A = 6,02·10²³ mol⁻¹):',c:0,o:[['6,02·10²³','Đúng. 18 g nước là 1 mol, chứa N_A phân tử.'],['1,08·10²⁵','Sai. Đã nhân N_A với 18 thay vì với số mol.'],['3,34·10²²','Sai. Đã chia N_A cho 18.'],['18','Sai. 18 là khối lượng theo gam.']]},
 {t:'mc',ls:'c2-3',q:'Một lượng khí có thể tích 4 lít ở 0 °C. Nung nóng đẳng áp đến 273 °C, thể tích khí là:',c:0,o:[['8 lít','Đúng. T₁ = 273 K, T₂ = 546 K, nhiệt độ tuyệt đối tăng gấp đôi nên V₂ = 8 lít.'],['4 lít','Sai. Áp suất không đổi chứ không phải thể tích.'],['1092 lít','Sai. Đây là 4·273, do dùng nhầm nhiệt độ theo °C.'],['2 lít','Sai. Nóng lên đẳng áp thì khí nở ra.']]},
 {t:'mc',ls:'c2-4',q:'Hệ thức nào sau đây áp dụng cho quá trình đẳng tích của một lượng khí xác định?',c:0,o:[['p/T = hằng số','Đúng. V không đổi thì áp suất tỉ lệ thuận với nhiệt độ tuyệt đối.'],['pV = hằng số','Sai. Đó là quá trình đẳng nhiệt.'],['V/T = hằng số','Sai. Đó là quá trình đẳng áp.'],['pT = hằng số','Sai. Không có quá trình nào như vậy cho khí lí tưởng.']]},
 {t:'mc',ls:'c2-5',q:'Khi nhiệt độ tuyệt đối của một lượng khí tăng 2 lần thì động năng tịnh tiến trung bình của phân tử khí:',c:0,o:[['Tăng 2 lần','Đúng. W̄đ = (3/2)kT tỉ lệ thuận với T.'],['Tăng √2 lần','Sai. √2 lần là mức tăng của tốc độ, không phải động năng.'],['Tăng 4 lần','Sai. Động năng tỉ lệ bậc nhất với T.'],['Không đổi','Sai. Nhiệt độ là thước đo động năng trung bình của phân tử.']]},
 {t:'mc',ls:'c3-1',q:'Nhìn vào một đầu ống dây, thấy dòng điện trong các vòng dây chạy ngược chiều kim đồng hồ. Đầu ống dây đó là:',c:0,o:[['Cực Bắc','Đúng. Khum bốn ngón tay phải theo chiều ngược kim đồng hồ thì ngón cái hướng về phía người nhìn: đường sức đi ra ở đầu này, nên đây là cực Bắc.'],['Cực Nam','Sai. Đầu thấy dòng điện chạy cùng chiều kim đồng hồ mới là cực Nam.'],['Không phải cực nào','Sai. Ống dây có dòng điện có hai cực như nam châm thẳng.'],['Tuỳ thuộc vào cường độ dòng điện','Sai. Cường độ chỉ ảnh hưởng đến độ mạnh, không ảnh hưởng đến cực.']]},
 {t:'mc',ls:'c3-2',q:'Một đoạn dây dẫn dài 20 cm mang dòng điện 3 A đặt trong từ trường đều B = 0,5 T, dây hợp với đường sức một góc 30°. Lực từ tác dụng lên đoạn dây là:',c:0,o:[['0,15 N','Đúng. F = 0,5·3·0,2·sin30° = 0,3·0,5 = 0,15 N.'],['0,26 N','Sai. Đã dùng cos30° thay cho sin30°.'],['0,3 N','Sai. Quên nhân với sinα, coi như dây vuông góc với đường sức.'],['15 N','Sai. Quên đổi 20 cm = 0,2 m.']]},
 {t:'mc',ls:'c3-3',q:'Một khung dây gồm 200 vòng. Từ thông qua mỗi vòng giảm đều từ 4·10⁻³ Wb về 0 trong 0,2 s. Suất điện động cảm ứng trong khung có độ lớn:',c:0,o:[['4 V','Đúng. |e| = N·ΔΦ/Δt = 200·4·10⁻³/0,2 = 4 V.'],['0,02 V','Sai. Quên nhân với số vòng N = 200.'],['0,16 V','Sai. Đã nhân với Δt thay vì chia.'],['40 V','Sai. Sai một bậc mười.']]},
 {t:'mc',ls:'c3-4',q:'Máy phát điện xoay chiều có rôto là nam châm gồm 2 cặp cực. Để tạo ra dòng điện tần số 50 Hz, rôto phải quay với tốc độ:',c:0,o:[['1500 vòng/phút','Đúng. f = p·n ⇒ n = 50/2 = 25 vòng/giây = 1500 vòng/phút.'],['3000 vòng/phút','Sai. Đây là tốc độ cho máy chỉ có 1 cặp cực.'],['25 vòng/phút','Sai. 25 là số vòng mỗi giây, chưa đổi ra phút.'],['100 vòng/phút','Sai. Đã nhân f với p thay vì chia.']]},
 {t:'mc',ls:'c3-5',q:'Một đài phát thanh phát sóng điện từ có bước sóng 300 m. Tần số của sóng là:',c:0,o:[['1 MHz','Đúng. f = c/λ = 3·10⁸/300 = 10⁶ Hz = 1 MHz.'],['1 kHz','Sai. Sai ba bậc lũy thừa.'],['9·10¹⁰ Hz','Sai. Đã nhân c với λ thay vì chia.'],['100 MHz','Sai. Đây là tần số của sóng có bước sóng 3 m.']]},
 {t:'mc',ls:'c4-1',q:'Hai hạt nhân ¹²₆C và ¹⁴₆C có cùng:',c:0,o:[['Số proton','Đúng. Cùng Z = 6, đây là hai đồng vị của cacbon.'],['Số neutron','Sai. ¹²C có 6 neutron, ¹⁴C có 8 neutron.'],['Số khối','Sai. Số khối lần lượt là 12 và 14.'],['Khối lượng','Sai. Khác số neutron nên khác khối lượng.']]},
 {t:'mc',ls:'c4-2',q:'Hạt nhân ²⁰₁₀Ne có năng lượng liên kết 160,6 MeV. Năng lượng liên kết riêng của hạt nhân này là:',c:0,o:[['8,03 MeV/nucleon','Đúng. W/A = 160,6/20 = 8,03 MeV/nucleon.'],['16,06 MeV/nucleon','Sai. Đã chia cho số proton Z = 10 thay vì số nucleon A = 20.'],['160,6 MeV/nucleon','Sai. Đây là năng lượng liên kết của cả hạt nhân.'],['3212 MeV/nucleon','Sai. Đã nhân thay vì chia.']]},
 {t:'mc',ls:'c4-3',q:'Sau 3 chu kì bán rã, số hạt nhân của một chất phóng xạ đã bị phân rã chiếm:',c:0,o:[['87,5% số hạt nhân ban đầu','Đúng. Còn lại (1/2)³ = 12,5%, nên đã phân rã 87,5%.'],['12,5% số hạt nhân ban đầu','Sai. 12,5% là phần còn lại, không phải phần đã phân rã.'],['33,3% số hạt nhân ban đầu','Sai. Phân rã không chia đều theo từng chu kì.'],['75% số hạt nhân ban đầu','Sai. 75% là phần đã phân rã sau 2 chu kì.']]},
 {t:'mc',ls:'c4-5',q:'Biện pháp nào sau đây KHÔNG giúp giảm đáng kể liều chiếu xạ từ một nguồn phóng xạ γ?',c:0,o:[['Dùng một tấm giấy dày để che chắn','Đúng. Giấy chỉ chặn được tia α; tia γ đâm xuyên qua giấy gần như không suy giảm.'],['Đứng xa nguồn hơn','Sai. Cường độ giảm theo bình phương khoảng cách, nên đứng xa giảm liều rất hiệu quả.'],['Giảm thời gian tiếp xúc với nguồn','Sai. Thời gian càng ngắn, liều nhận càng ít.'],['Dùng tấm chì dày để che chắn','Sai. Chì dày làm giảm mạnh cường độ tia γ.']]},
 {t:'ds',ls:'c1-2',q:'Một lượng khí trong xilanh nhận nhiệt lượng 600 J và đẩy pít-tông, thực hiện công 200 J.',s:[['Nội năng của khí tăng 400 J.',true,'Đúng. ΔU = A + Q = −200 + 600 = 400 J.'],['Trong quá trình này, A = +200 J.',false,'Sai. Khí sinh công nên A = −200 J.'],['Nếu khí nhận 600 J mà pít-tông bị giữ cố định thì nội năng khí tăng 600 J.',true,'Đúng. Pít-tông cố định thì A = 0, nên ΔU = Q = 600 J.'],['Nhiệt độ của khí giảm vì khí đã sinh công.',false,'Sai. Nội năng tăng 400 J nên nhiệt độ của khí tăng.']]},

function randomExam(){const pool={mc:[],ds:[],sa:[]};L.forEach(l=>l.quiz.forEach(q=>pool[q.t].push(Object.assign({ls:l.id},q))));
  const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const byCh=(arr,n)=>{const out=[];const groups=[1,2,3,4].map(c=>sh(arr.filter(q=>BYID[q.ls].ch===c)));let k=0;while(out.length<n){const g=groups[k%4];if(g.length)out.push(g.pop());k++;}return out;};
  const ord=a=>a.sort((x,y)=>BYID[x.ls].i-BYID[y.ls].i);
  return [...ord(byCh(pool.mc,18)),...ord(byCh(pool.ds,4)),...ord(byCh(pool.sa,6))];}

function examPage(id){const app=$('#app');app.removeAttribute('data-ch');nav('exam');clearInterval(EXTIMER);

  h+='<div class="ctrls"><button type="button" class="btn fill" id="exsubmit2">Nộp bài</button><a class="btn" href="#exam">Về danh sách đề</a></div>';app.innerHTML=h;active=null;

    const tot=P.mc+P.ds+P.sa,used=Math.round((Date.now()-start)/1000);const weak=Object.entries(lost).sort((a,b)=>b[1]-a[1]);

const LT1=[
{key:'lt1a',title:'Nội năng, công và nhiệt lượng',note:'Câu hỏi lí thuyết về nội năng, hai cách làm thay đổi nội năng, nhiệt lượng và sự truyền nhiệt.',items:[
 {t:'mc',ls:'c1-2',q:'Nội năng của một vật là',c:1,o:[['tổng động năng và thế năng của vật.','Sai. Đó là cơ năng của cả vật, không phải của các phân tử bên trong.'],['tổng động năng và thế năng của các phân tử cấu tạo nên vật.','Đúng. Đây là định nghĩa nội năng.'],['tổng nhiệt lượng và cơ năng mà vật nhận được trong quá trình truyền nhiệt và thực hiện công.','Sai. Nhiệt lượng và công chỉ làm nội năng thay đổi; chúng không phải là nội năng.'],['nhiệt lượng mà vật nhận được trong quá trình truyền nhiệt.','Sai. Nhiệt lượng là phần nội năng được truyền đi, không phải nội năng.']]},
 {t:'mc',ls:'c1-4',q:'Công thức tính nhiệt lượng (cần để vật tăng nhiệt độ) là',c:0,o:[['Q = mcΔt.','Đúng. Nhiệt lượng tỉ lệ với khối lượng, nhiệt dung riêng và độ tăng nhiệt độ.'],['Q = cΔt.','Sai. Thiếu khối lượng m: vật nặng gấp đôi cần nhiệt lượng gấp đôi.'],['Q = mΔt.','Sai. Thiếu nhiệt dung riêng c, nên không phân biệt được các chất khác nhau.'],['Q = mc.','Sai. Thiếu độ tăng nhiệt độ Δt.']]},
 {t:'mc',ls:'c1-2',q:'Phát biểu nào sau đây về nội năng là không đúng?',c:2,o:[['Nội năng là một dạng năng lượng.','Phát biểu đúng, nên không phải đáp án. Nội năng đo bằng jun như mọi dạng năng lượng.'],['Nội năng có thể chuyển hoá thành các dạng năng lượng khác.','Phát biểu đúng. Ví dụ trong động cơ nhiệt, nội năng chuyển hoá thành cơ năng.'],['Nội năng là nhiệt lượng.','Đây là phát biểu sai, nên là đáp án. Nhiệt lượng chỉ là phần nội năng được truyền đi trong quá trình truyền nhiệt.'],['Nội năng của một vật có thể tăng lên, giảm đi.','Phát biểu đúng. Nội năng thay đổi khi vật nhận hoặc mất công, nhiệt.']]},
 {t:'mc',ls:'c1-2',q:'Nội năng của một vật phụ thuộc vào',c:2,o:[['nhiệt độ, áp suất và khối lượng.','Sai. Với một vật cho trước, nội năng phụ thuộc nhiệt độ và thể tích; áp suất không phải biến độc lập trong định nghĩa này.'],['nhiệt độ và áp suất.','Sai. Thế năng tương tác phân tử phụ thuộc khoảng cách giữa các phân tử, tức thể tích.'],['nhiệt độ và thể tích của vật.','Đúng. Động năng phân tử phụ thuộc nhiệt độ, thế năng phân tử phụ thuộc thể tích.'],['nhiệt độ, áp suất và thể tích.','Sai. Chỉ cần nhiệt độ và thể tích.']]},
 {fixed:true,t:'mc',ls:'c1-2',q:'Điều nào sau đây là đúng khi nói về các cách làm thay đổi nội năng của một vật?',c:3,o:[['Nội năng của vật có thể biến đổi bằng hai cách thực hiện công và truyền nhiệt.','Phát biểu này đúng, nhưng chưa đầy đủ vì B và C cũng đúng.'],['Quá trình làm thay đổi nội năng có liên quan đến sự chuyển dời của các vật khác tác dụng lực lên vật đang xét gọi là sự thực hiện công.','Phát biểu này đúng, nhưng A và C cũng đúng.'],['Quá trình làm thay đổi nội năng không bằng cách thực hiện công gọi là sự truyền nhiệt.','Phát biểu này đúng, nhưng A và B cũng đúng.'],['Các phát biểu A, B, C đều đúng.','Đúng. Cả ba phát biểu đều mô tả đúng hai cách làm thay đổi nội năng.']]},
 {t:'mc',ls:'c1-2',q:'Phát biểu nào sau đây về nội năng là không đúng?',c:1,o:[['Nội năng có thể chuyển hoá thành các dạng năng lượng khác.','Phát biểu đúng, nên không phải đáp án.'],['Nội năng là nhiệt lượng vật nhận được trong quá trình truyền nhiệt.','Đây là phát biểu sai, nên là đáp án. Nhiệt lượng là phần nội năng thay đổi trong quá trình truyền nhiệt, không phải bản thân nội năng.'],['Nội năng của một vật có thể tăng lên, giảm đi.','Phát biểu đúng.'],['Nội năng của khí lí tưởng không phụ thuộc vào thể tích, mà phụ thuộc vào nhiệt độ.','Phát biểu đúng. Khí lí tưởng bỏ qua tương tác giữa các phân tử nên không có thế năng tương tác, nội năng chỉ phụ thuộc nhiệt độ.']]},
 {t:'mc',ls:'c1-4',q:'Một vật khối lượng m, có nhiệt dung riêng c, nhiệt độ đầu và cuối là t₁ và t₂. Công thức Q = mc(t₂ − t₁) dùng để xác định',c:2,o:[['nội năng.','Sai. Công thức không cho nội năng của vật mà cho phần năng lượng trao đổi.'],['nhiệt năng.','Sai. "Nhiệt năng" là cách gọi khác của nội năng ở cấp THCS, không phải đại lượng công thức này tính.'],['nhiệt lượng.','Đúng. Đây là nhiệt lượng vật thu vào (hoặc toả ra nếu âm) khi nhiệt độ thay đổi từ t₁ đến t₂.'],['năng lượng.','Sai. Quá chung chung; công thức tính riêng nhiệt lượng.']]},
 {t:'mc',ls:'c1-4',q:'Đơn vị của nhiệt dung riêng trong hệ SI là',c:1,o:[['J/g.độ.','Sai. Trong hệ SI, khối lượng đo bằng kg, không phải gam.'],['J/kg.độ.','Đúng. Đơn vị là J/(kg·K); vì 1 K = 1 °C về độ chia, còn viết J/kg.độ.'],['kJ/kg.độ.','Sai. Đơn vị năng lượng trong SI là jun (J), không phải kilôjun.'],['cal/g.độ.','Sai. Calo và gam không phải đơn vị SI.']]},
 {t:'mc',ls:'c1-2',q:'Phát biểu nào sau đây là sai?',c:1,o:[['Đơn vị của nhiệt lượng cũng là đơn vị của nội năng.','Phát biểu đúng: cả hai đều đo bằng jun.'],['Một vật lúc nào cũng có nội năng, do đó lúc nào cũng có nhiệt lượng.','Đây là phát biểu sai, nên là đáp án. Vật luôn có nội năng, nhưng nhiệt lượng chỉ xuất hiện khi có quá trình truyền nhiệt.'],['Nhiệt lượng là số đo độ biến thiên nội năng của vật trong quá trình truyền nhiệt.','Phát biểu đúng. Đây là định nghĩa nhiệt lượng.'],['Nhiệt lượng không phải là nội năng.','Phát biểu đúng.']]},
 {t:'mc',ls:'c1-2',q:'Khi nói về nội năng, điều nào sau đây là sai?',c:1,o:[['Nội năng của một vật phụ thuộc vào nhiệt độ và thể tích của vật.','Phát biểu đúng, nên không phải đáp án.'],['Có thể đo nội năng bằng nhiệt kế.','Đây là phát biểu sai, nên là đáp án. Nhiệt kế đo nhiệt độ, không đo được nội năng.'],['Đơn vị của nội năng là jun (J).','Phát biểu đúng.'],['Nội năng của một vật là tổng động năng và thế năng tương tác của các phần tử cấu tạo nên vật.','Phát biểu đúng. Đây là định nghĩa.']]},
 {t:'mc',ls:'c1-3',q:'Nhiệt độ của vật giảm là do các nguyên tử, phân tử cấu tạo nên vật',c:2,o:[['ngừng chuyển động.','Sai. Phân tử luôn chuyển động; chỉ gần ngừng ở 0 K.'],['nhận thêm động năng.','Sai. Nhận thêm động năng thì nhiệt độ tăng.'],['chuyển động chậm đi.','Đúng. Nhiệt độ là thước đo động năng trung bình của phân tử; phân tử chậm đi thì nhiệt độ giảm.'],['va chạm vào nhau.','Sai. Phân tử luôn va chạm, điều đó không làm nhiệt độ giảm.']]},
 {fixed:true,t:'mc',ls:'c1-3',q:'Nhiệt độ của vật không phụ thuộc vào yếu tố nào sau đây?',c:0,o:[['Khối lượng của vật.','Đúng. Một cốc nước và một xô nước có thể cùng nhiệt độ. Nhiệt độ chỉ phụ thuộc động năng trung bình của mỗi phân tử.'],['Vận tốc của các phân tử cấu tạo nên vật.','Sai. Vận tốc phân tử quyết định động năng, tức quyết định nhiệt độ.'],['Khối lượng của từng phân tử cấu tạo nên vật.','Sai. Động năng ½mv² của phân tử phụ thuộc cả khối lượng phân tử.'],['Cả ba yếu tố trên.','Sai. Nhiệt độ có phụ thuộc vào vận tốc và khối lượng của từng phân tử.']]},
 {t:'mc',ls:'c1-2',q:'Câu nào sau đây nói về nội năng là đúng?',c:3,o:[['Nội năng là nhiệt lượng.','Sai. Nhiệt lượng là phần nội năng được truyền đi.'],['Nội năng của vật A lớn hơn nội năng của vật B thì nhiệt độ của vật A cũng lớn hơn nhiệt độ của vật B.','Sai. Nội năng còn phụ thuộc khối lượng: bể nước lạnh có nội năng lớn hơn cốc nước nóng.'],['Nội năng của vật chỉ thay đổi trong quá trình truyền nhiệt, không thay đổi trong quá trình thực hiện công.','Sai. Thực hiện công (nén, cọ xát) cũng làm thay đổi nội năng.'],['Nội năng là một dạng năng lượng.','Đúng.']]},
 {t:'mc',ls:'c1-2',q:'Câu nào sau đây nói về truyền nhiệt và thực hiện công là không đúng?',c:3,o:[['Thực hiện công là quá trình có thể làm thay đổi nội năng của vật.','Phát biểu đúng, nên không phải đáp án.'],['Trong thực hiện công có sự chuyển hoá từ nội năng thành cơ năng và ngược lại.','Phát biểu đúng. Ví dụ cọ xát: cơ năng thành nội năng; khí đẩy pít-tông: nội năng thành cơ năng.'],['Trong truyền nhiệt có sự truyền động năng từ phân tử này sang phân tử khác.','Phát biểu đúng. Đó là bản chất của truyền nhiệt.'],['Trong truyền nhiệt có sự chuyển hoá từ cơ năng sang nội năng và ngược lại.','Đây là phát biểu sai, nên là đáp án. Truyền nhiệt chỉ chuyển nội năng từ vật này sang vật khác, không có chuyển hoá dạng năng lượng.']]},
 {t:'mc',ls:'c1-2',q:'Phát biểu nào sau đây là sai khi nói về nội năng?',c:3,o:[['Nội năng của một vật là dạng năng lượng bao gồm tổng động năng của các phân tử cấu tạo nên vật và thế năng tương tác giữa chúng.','Phát biểu đúng.'],['Đơn vị của nội năng là jun (J).','Phát biểu đúng.'],['Nội năng của một vật phụ thuộc vào nhiệt độ và thể tích của vật.','Phát biểu đúng.'],['Nội năng không thể biến đổi được.','Đây là phát biểu sai, nên là đáp án. Nội năng thay đổi được bằng thực hiện công hoặc truyền nhiệt.']]},
 {t:'mc',ls:'c1-2',q:'Phát biểu nào sau đây là đúng?',c:1,o:[['Trong quá trình đẳng tích, nhiệt lượng mà chất khí nhận được dùng làm tăng nội năng và thực hiện công.','Sai. Đẳng tích thì A = 0, toàn bộ nhiệt lượng chỉ làm tăng nội năng.'],['Độ biến thiên nội năng của vật bằng tổng công và nhiệt lượng mà vật nhận được.','Đúng. Đây là định luật I: ΔU = A + Q.'],['Động cơ nhiệt chuyển hoá tất cả nhiệt lượng nhận được thành công cơ học.','Sai. Động cơ nhiệt luôn phải toả một phần nhiệt ra nguồn lạnh; hiệu suất luôn nhỏ hơn 100%.'],['Nhiệt có thể tự truyền từ vật lạnh sang vật nóng.','Sai. Nhiệt chỉ tự truyền từ vật nóng sang vật lạnh.']]},
 {t:'mc',ls:'c1-2',q:'Trường hợp nào dưới đây làm biến đổi nội năng không do thực hiện công?',c:2,o:[['Khuấy nước.','Sai. Khuấy là dùng lực làm nước chuyển động: thực hiện công.'],['Đóng đinh.','Sai. Búa tác dụng lực làm đinh dịch chuyển: thực hiện công.'],['Nung sắt trong lò.','Đúng. Sắt nhận nhiệt từ lửa: truyền nhiệt.'],['Mài dao, kéo.','Sai. Ma sát khi mài là thực hiện công.']]},
 {t:'mc',ls:'c1-2',q:'Phát biểu nào sau đây là đúng?',c:3,o:[['Độ biến thiên nội năng của một vật là độ biến thiên nhiệt độ của vật đó.','Sai. Nội năng (J) và nhiệt độ (K) là hai đại lượng khác nhau; nội năng có thể thay đổi khi nhiệt độ không đổi (lúc nóng chảy).'],['Nội năng gọi là nhiệt lượng.','Sai. Nhiệt lượng là phần nội năng được truyền đi.'],['Nội năng là phần năng lượng vật nhận được hay mất bớt đi trong quá trình truyền nhiệt.','Sai. Đó là định nghĩa nhiệt lượng.'],['Có thể làm thay đổi nội năng của vật bằng cách thực hiện công.','Đúng.']]},
 {t:'mc',ls:'c1-3',q:'Câu nào sau đây nói về sự truyền nhiệt là không đúng?',c:3,o:[['Nhiệt không thể tự truyền từ vật lạnh hơn sang vật nóng hơn.','Phát biểu đúng, nên không phải đáp án.'],['Nhiệt có thể tự truyền từ vật nóng hơn sang vật lạnh hơn.','Phát biểu đúng.'],['Nhiệt có thể truyền từ vật lạnh hơn sang vật nóng hơn.','Phát biểu đúng: được, nếu có tác động bên ngoài (tốn công), ví dụ tủ lạnh, máy điều hoà.'],['Nhiệt có thể tự truyền giữa hai vật có cùng nhiệt độ.','Đây là phát biểu sai, nên là đáp án. Hai vật cùng nhiệt độ thì đã cân bằng nhiệt, không truyền nhiệt.']]},
 {t:'mc',ls:'c1-3',q:'Cách nào sau đây không phải là cách truyền nhiệt?',c:2,o:[['Dẫn nhiệt.','Sai, dẫn nhiệt là một cách truyền nhiệt.'],['Bức xạ.','Sai, bức xạ nhiệt là một cách truyền nhiệt.'],['Ma sát.','Đúng. Ma sát là thực hiện công, không phải truyền nhiệt.'],['Đối lưu.','Sai, đối lưu là một cách truyền nhiệt.']]},
 {t:'mc',ls:'c1-2',q:'Trường hợp nào dưới đây làm biến đổi nội năng không do thực hiện công?',c:0,o:[['Nung nước bằng bếp.','Đúng. Nước nhận nhiệt từ bếp: truyền nhiệt.'],['Một viên bi bằng thép rơi xuống đất mềm.','Sai. Viên bi va chạm, cơ năng biến thành nội năng: thực hiện công.'],['Cọ xát hai vật vào nhau.','Sai. Ma sát sinh công.'],['Nén khí trong xilanh.','Sai. Pít-tông tác dụng lực lên khí: thực hiện công.']]}]},
{key:'lt1b',title:'Nhiệt dung riêng và cân bằng nhiệt',note:'Bài tập tính nhiệt lượng Q = mcΔt và phương trình cân bằng nhiệt Q toả = Q thu.',items:[
 {t:'mc',ls:'c1-4',q:'Nhiệt độ của vật nào tăng lên nhiều nhất khi ta thả rơi bốn vật dưới đây có cùng khối lượng và từ cùng một độ cao xuống đất (coi như toàn bộ độ giảm cơ năng dùng để làm nóng vật)?',c:2,o:[['Vật bằng nhôm, có nhiệt dung riêng là 880 J/kg.K.','Sai. Nhôm có c lớn nhất nên nóng lên ít nhất.'],['Vật bằng đồng, có nhiệt dung riêng là 380 J/kg.K.','Sai. c của đồng lớn hơn của chì.'],['Vật bằng chì, có nhiệt dung riêng là 120 J/kg.K.','Đúng. Cùng m, cùng nhận nhiệt lượng Q = mgh; Δt = Q/(mc) lớn nhất khi c nhỏ nhất.'],['Vật bằng gang, có nhiệt dung riêng là 550 J/kg.K.','Sai. c của gang lớn hơn của chì.']]},
 {t:'mc',ls:'c1-4',q:'Người ta thả một vật rắn có khối lượng m₁ ở nhiệt độ 150 °C vào một bình nước có khối lượng m₂, nhiệt độ của nước tăng từ 20 °C đến 50 °C. Gọi c₁, c₂ lần lượt là nhiệt dung riêng của vật rắn và của nước. Bỏ qua sự truyền nhiệt ra môi trường. Tỉ số đúng là',c:0,o:[['m₁c₁/(m₂c₂) = 3/10.','Đúng. Cân bằng ở 50 °C: m₁c₁(150 − 50) = m₂c₂(50 − 20) ⇒ m₁c₁/(m₂c₂) = 30/100 = 3/10.'],['m₁c₁/(m₂c₂) = 1/13.','Sai. Có lẽ đã lấy nhầm độ giảm nhiệt độ của vật rắn.'],['m₁c₁/(m₂c₂) = 10/3.','Sai. Tỉ số bị đảo ngược.'],['m₁c₁/(m₂c₂) = 13/1.','Sai. Không có cơ sở.']]},
 {t:'mc',ls:'c1-4',q:'Một bình cách nhiệt được ngăn làm hai phần bằng một vách ngăn. Hai phần bình chứa hai chất lỏng có nhiệt dung riêng c₁, c₂ và nhiệt độ t₁, t₂ khác nhau. Bỏ vách ngăn ra, hỗn hợp có nhiệt độ cân bằng là t. Biết t₁ − t = ½(t₁ − t₂). Tỉ số m₁/m₂ có giá trị là',c:2,o:[['m₁/m₂ = 1 + c₂/c₁.','Sai. Không khớp với phương trình cân bằng nhiệt.'],['m₁/m₂ = c₁/c₂.','Sai. Tỉ số bị đảo ngược.'],['m₁/m₂ = c₂/c₁.','Đúng. t₁ − t = ½(t₁ − t₂) nghĩa là t nằm chính giữa t₁ và t₂, nên t − t₂ = t₁ − t. Phương trình m₁c₁(t₁ − t) = m₂c₂(t − t₂) cho m₁c₁ = m₂c₂ ⇒ m₁/m₂ = c₂/c₁.'],['m₁/m₂ = 1 + c₁/c₂.','Sai. Không khớp với phương trình cân bằng nhiệt.']]},
 {t:'mc',ls:'c1-4',q:'Biết nhiệt dung riêng của sắt là 478 J/kg.K. Nhiệt lượng toả ra khi một miếng sắt có khối lượng 2 kg ở nhiệt độ 500 °C hạ xuống còn 100 °C là',c:2,o:[['219880 J.','Sai. Có thể đã dùng 230 °C làm độ giảm nhiệt độ.'],['439760 J.','Sai. Có thể đã dùng độ giảm 460 °C.'],['382400 J.','Đúng. Q = mcΔt = 2·478·(500 − 100) = 382 400 J.'],['109940 J.','Sai. Có thể đã quên nhân khối lượng và dùng sai Δt.']]},
 {t:'mc',ls:'c1-4',q:'Biết nhiệt dung riêng của nước là 4200 J/kg.K và của sắt là 460 J/kg.K. Bỏ qua sự truyền nhiệt ra môi trường. Nhiệt lượng cần thiết để đun 5 kg nước từ 15 °C đến 100 °C trong một cái thùng bằng sắt có khối lượng 1,5 kg là',c:1,o:[['1883650 J.','Sai. Cộng nhầm: phần của thùng sắt chỉ là 58 650 J.'],['1843650 J.','Đúng. Nước: 5·4200·85 = 1 785 000 J; thùng: 1,5·460·85 = 58 650 J. Tổng 1 843 650 J.'],['1849650 J.','Sai. Phần của thùng sắt tính chưa đúng.'],['1743650 J.','Sai. Sai một số ở hàng trăm nghìn.']]},
 {t:'mc',ls:'c1-4',q:'Một cốc nhôm có khối lượng 100 gam chứa 300 gam nước ở nhiệt độ 20 °C. Người ta thả vào cốc một chiếc thìa bằng đồng khối lượng 75 gam vừa vớt ra từ nồi nước sôi ở 100 °C. Biết c(nhôm) = 920 J/kg.K, c(nước) = 4190 J/kg.K, c(đồng) = 380 J/kg.K. Bỏ qua sự truyền nhiệt ra môi trường. Nhiệt độ của nước trong cốc khi có cân bằng nhiệt là',c:1,o:[['24,5 °C.','Sai. Thìa đồng nhẹ và có c nhỏ nên chỉ làm nước ấm lên chưa đến 2 °C.'],['21,6 °C.','Đúng. 0,075·380·(100 − t) = (0,1·920 + 0,3·4190)(t − 20) ⇒ 28,5(100 − t) = 1349(t − 20) ⇒ t ≈ 21,6 °C.'],['23,1 °C.','Sai. Kiểm tra lại: nhớ tính cả cốc nhôm vào phần thu nhiệt.'],['26,7 °C.','Sai. Quá cao so với nhiệt lượng thìa đồng toả ra.']]},
 {t:'mc',ls:'c1-4',q:'Một bình nhôm có khối lượng 0,5 kg chứa 0,118 kg nước ở 20 °C. Người ta thả vào bình một miếng sắt khối lượng 0,2 kg đã được đun nóng tới 75 °C. Biết c(nhôm) = 920 J/kg.K, c(nước) = 4180 J/kg.K, c(sắt) = 460 J/kg.K. Bỏ qua sự truyền nhiệt ra môi trường. Nhiệt độ của nước khi bắt đầu có cân bằng nhiệt là',c:2,o:[['48,2 °C.','Sai. Có lẽ đã quên phần nhiệt bình nhôm thu vào.'],['42,8 °C.','Sai. Kiểm tra lại phương trình cân bằng nhiệt.'],['24,8 °C.','Đúng. 0,2·460·(75 − t) = (0,5·920 + 0,118·4180)(t − 20) ⇒ 92(75 − t) = 953,24(t − 20) ⇒ t ≈ 24,8 °C.'],['28,4 °C.','Sai. Kiểm tra lại phần thu nhiệt của bình nhôm.']]},
 {t:'mc',ls:'c1-4',q:'Một nhiệt lượng kế bằng đồng thau có khối lượng 128 gam chứa 210 gam nước ở 8,4 °C. Người ta thả một miếng kim loại khối lượng 192 gam đã đun nóng tới 100 °C vào nhiệt lượng kế. Nhiệt độ khi cân bằng là 21,5 °C. Biết c(đồng thau) = 128 J/kg.K, c(nước) = 4180 J/kg.K. Bỏ qua sự truyền nhiệt ra môi trường. Nhiệt dung riêng của miếng kim loại là',c:0,o:[['777,2 J/kg.K.','Đúng. Q thu = (0,128·128 + 0,21·4180)·13,1 ≈ 11 714 J; Q toả = 0,192·c·78,5 ⇒ c ≈ 777,2 J/kg.K.'],['772,7 J/kg.K.','Sai. Đảo chữ số khi làm tròn.'],['727,7 J/kg.K.','Sai. Đảo chữ số khi làm tròn.'],['727,2 J/kg.K.','Sai. Đảo chữ số khi làm tròn.']]},
 {t:'mc',ls:'c1-4',q:'Thả một quả cầu bằng nhôm khối lượng 0,105 kg được đun nóng tới 142 °C vào một cốc nước ở 20 °C, nhiệt độ khi cân bằng là 42 °C. Biết c(nhôm) = 880 J/kg.K, c(nước) = 4200 J/kg.K. Bỏ qua sự truyền nhiệt ra môi trường. Khối lượng nước trong cốc là',c:3,o:[['120 gam.','Sai. Kiểm tra lại độ tăng nhiệt độ của nước: 42 − 20 = 22 °C.'],['140 gam.','Sai.'],['110 gam.','Sai.'],['100 gam.','Đúng. 0,105·880·(142 − 42) = m·4200·(42 − 20) ⇒ 9240 = 92 400·m ⇒ m = 0,1 kg = 100 gam.']]}]},
{key:'lt1c',title:'Câu hỏi đúng/sai',note:'Mỗi câu có 4 ý; chấm theo thang thi tốt nghiệp (1 ý 0,1 · 2 ý 0,25 · 3 ý 0,5 · 4 ý 1 điểm).',items:[
 {t:'ds',ls:'c1-2',q:'Một lượng khí được đặt trong một xilanh. Khi bật đèn cồn đun nóng đáy xilanh, người ta thấy nhiệt độ khối khí tăng lên và khí đẩy pít-tông đi lên một đoạn x.',s:[['Nội năng của khối khí đã thay đổi nhờ quá trình truyền nhiệt.',true,'Đúng. Khí nhận nhiệt từ ngọn lửa.'],['Độ biến thiên nội năng của khối khí đúng bằng nhiệt lượng mà khối khí nhận được.',false,'Sai. Khí còn sinh công đẩy pít-tông (A < 0), nên ΔU = Q + A nhỏ hơn Q.'],['Khi khối khí dãn nở đẩy pít-tông đi lên, ta nói khối khí đã thực hiện công.',true,'Đúng. Khí tác dụng lực làm pít-tông dịch chuyển.'],['Công của khối khí khi đẩy pít-tông đi lên đúng bằng nhiệt lượng mà nó nhận được.',false,'Sai. Một phần nhiệt lượng làm tăng nội năng (nhiệt độ khí tăng), nên công nhỏ hơn nhiệt lượng nhận được.']]},
 {t:'ds',ls:'c1-2',q:'Khi truyền nhiệt cho vật, ta nói vật nhận thêm nhiệt lượng nên nội năng thay đổi. Giữa nội năng và nhiệt lượng có mối liên hệ với nhau.',s:[['Nhiệt lượng là số đo độ biến thiên nội năng của vật trong quá trình truyền nhiệt.',true,'Đúng. Đây là định nghĩa nhiệt lượng.'],['Đơn vị của nhiệt lượng cũng là đơn vị của nội năng.',true,'Đúng. Cả hai đều đo bằng jun.'],['Một vật lúc nào cũng có nội năng, do đó lúc nào vật cũng có nhiệt lượng.',false,'Sai. Nhiệt lượng chỉ có khi đang truyền nhiệt; vật không "chứa" nhiệt lượng.'],['Một vật có nội năng lớn khi cho tiếp xúc với vật khác có nội năng nhỏ hơn thì sẽ xảy ra quá trình truyền nhiệt.',false,'Sai. Truyền nhiệt xảy ra khi có chênh lệch nhiệt độ, không phải chênh lệch nội năng.']]},
 {t:'ds',ls:'c1-2',q:'Các vật được cấu tạo từ các phân tử. Tổng động năng và thế năng tương tác của các phân tử cấu tạo nên vật gọi là nội năng của vật.',s:[['Nội năng là một dạng năng lượng.',true,'Đúng.'],['Nội năng của một vật phụ thuộc vào thể tích và nhiệt độ của vật.',true,'Đúng. Động năng phân tử theo nhiệt độ, thế năng phân tử theo thể tích.'],['Hai vật A và B có cùng chất liệu. Nếu nội năng của vật A lớn hơn vật B thì nhiệt độ của vật A cũng lớn hơn vật B.',false,'Sai. Nội năng còn phụ thuộc khối lượng: vật A có thể lớn hơn nhiều nhưng lạnh hơn.'],['Có hai cách làm thay đổi nội năng của một vật là thực hiện công và truyền nhiệt.',true,'Đúng.']]},
 {t:'ds',ls:'c1-2',q:'Có hai cách làm thay đổi nội năng của một miếng đồng: dùng tay cọ xát miếng đồng trên mặt bàn (hình 1) và đổ nước sôi vào cốc có sẵn miếng đồng ở nhiệt độ phòng (hình 2).',s:[['Hình 1 thể hiện quá trình truyền nhiệt, hình 2 là quá trình thực hiện công.',false,'Sai. Ngược lại: cọ xát là thực hiện công, đổ nước sôi vào là truyền nhiệt.'],['Trong quá trình thực hiện công, có sự chuyển hoá từ một dạng năng lượng khác sang nội năng.',true,'Đúng. Khi cọ xát, cơ năng chuyển hoá thành nội năng.'],['Trong quá trình truyền nhiệt, không có sự chuyển hoá năng lượng từ dạng này sang dạng khác.',true,'Đúng. Truyền nhiệt chỉ chuyển nội năng từ vật này sang vật khác.'],['Nội năng của vật luôn tăng khi ta thực hiện công hoặc truyền nhiệt.',false,'Sai. Nội năng có thể giảm, ví dụ khi vật toả nhiệt hoặc khi vật sinh công.']]},
 {t:'ds',ls:'c1-2',q:'Dùng tay cọ xát miếng kim loại vào sàn nhà thì miếng kim loại nóng lên.',s:[['Ta đã làm thay đổi nội năng của miếng kim loại bằng cách truyền nhiệt.',false,'Sai. Cọ xát là thực hiện công.'],['Nội năng của miếng kim loại giảm.',false,'Sai. Miếng kim loại nóng lên nên nội năng tăng.'],['Mặt tiếp xúc giữa miếng kim loại và sàn nhà có ma sát.',true,'Đúng. Lực ma sát sinh công làm nóng vật.'],['Khi cọ xát trong thời gian đủ dài có thể tạo ra lửa.',true,'Đúng. Đây là cách người xưa tạo lửa bằng cọ xát gỗ.']]},
 {t:'ds',ls:'c1-2',q:'Một khối khí đựng trong xilanh. Dùng tay ấn nhanh pít-tông xuống dưới.',s:[['Nhiệt độ khối khí không thay đổi.',false,'Sai. Khí nhận công và không kịp toả nhiệt nên nóng lên.'],['Nội năng của khối khí không đổi.',false,'Sai. Khí nhận công A > 0 nên nội năng tăng.'],['Thể tích khối khí giảm.',true,'Đúng. Pít-tông đi xuống làm thể tích giảm.'],['Áp suất khối khí không đổi.',false,'Sai. Thể tích giảm và nhiệt độ tăng nên áp suất tăng.']]},
 {t:'ds',ls:'c1-2',q:'Kéo đi kéo lại sợi dây cuốn quanh một ống nhôm đựng nước được nút kín, người ta thấy nước trong ống nóng lên rồi sôi, hơi nước đẩy nút bật ra cùng một lớp hơi nước trắng do các hạt nước rất nhỏ tạo thành.',s:[['Có sự chuyển hoá từ cơ năng sang nhiệt năng khi kéo đi kéo lại sợi dây.',true,'Đúng. Ma sát giữa dây và ống nhôm sinh công, làm ống nóng lên.'],['Có sự truyền nhiệt năng từ ống nhôm vào nước làm nước nóng lên.',true,'Đúng. Ống nhôm nóng hơn nên truyền nhiệt cho nước.'],['Có sự chuyển hoá từ nhiệt năng sang cơ năng nên hơi nước làm nút bật ra.',true,'Đúng. Hơi nước sinh công đẩy nút: nội năng chuyển thành cơ năng.'],['Có sự truyền nhiệt năng từ hơi nước ra môi trường bên ngoài làm hơi nước lạnh đi, ngưng tụ thành giọt nước.',true,'Đúng. Lớp "khói trắng" chính là các giọt nước nhỏ ngưng tụ.']]},
 {t:'ds',ls:'c1-2',q:'Vào mùa hè, bước vào căn phòng đóng kín có tường làm bằng kính cường lực, ta thường thấy không khí trong phòng nóng hơn bên ngoài.',s:[['Không khí trong phòng không thực hiện công.',true,'Đúng. Phòng đóng kín, thể tích không khí không đổi nên không có công.'],['Không khí trong phòng nhận nhiệt từ ánh sáng mặt trời.',true,'Đúng. Ánh sáng xuyên qua kính, làm nóng đồ vật và không khí trong phòng.'],['Thể tích khí trong phòng tăng lên.',false,'Sai. Phòng kín nên thể tích khí không đổi.'],['Nội năng khí trong phòng tăng lên.',true,'Đúng. Khí nhận nhiệt mà không sinh công nên nội năng tăng, nhiệt độ tăng.']]},
 {t:'ds',ls:'c1-1',q:'Khi bay hơi, các phân tử chất lỏng thoát ra ngoài làm mất đi năng lượng dưới dạng động năng (của các phân tử thoát ra), dẫn đến',s:[['nội năng của khối chất lỏng giảm.',true,'Đúng. Phần năng lượng của các phân tử thoát ra bị mất khỏi khối chất lỏng.'],['nhiệt độ của khối chất lỏng giảm.',true,'Đúng. Phân tử nhanh nhất thoát ra, phần còn lại có động năng trung bình nhỏ hơn. Đó là lí do bay hơi làm lạnh (đổ mồ hôi).'],['quá trình đông đặc chuyển sang thể rắn.',false,'Sai. Bay hơi chỉ làm chất lỏng nguội đi, không làm nó đông đặc.'],['thể tích khối chất lỏng tăng lên.',false,'Sai. Chất lỏng mất bớt phân tử nên thể tích giảm.']]},
 {t:'ds',ls:'c1-2',q:'Một vận động viên nhảy cầu có khối lượng 55 kg nhảy từ độ cao 5 m xuống bể bơi. Bỏ qua sự trao đổi nhiệt của nước trong bể với môi trường bên ngoài, lấy g = 10 m/s².',s:[['Nội năng của nước trong bể bơi thay đổi chủ yếu là do quá trình truyền nhiệt từ cơ thể vận động viên sang nước.',false,'Sai. Nội năng của nước tăng chủ yếu do va chạm, tức thực hiện công: cơ năng của người biến thành nội năng của nước.'],['Độ biến thiên nội năng của nước trong bể bằng độ biến thiên nội năng của cơ thể vận động viên.',false,'Sai. Phần nội năng nước nhận được đến từ cơ năng của người, không phải từ nội năng cơ thể.'],['Cơ thể vận động viên đã truyền một nhiệt lượng là 2750 J cho bể nước.',false,'Sai. 2750 J là cơ năng (mgh) chuyển thành nội năng thông qua công, không phải nhiệt lượng.'],['Độ biến thiên nội năng của nước trong bể bơi là 2750 J.',true,'Đúng. Thế năng mgh = 55·10·5 = 2750 J; bỏ qua mất mát khác, phần này chuyển thành nội năng của nước.']]},
 {t:'ds',ls:'c1-4',q:'Để xác định nhiệt dung riêng của nước, người ta dùng sơ đồ gồm: biến áp nguồn, oát kế, dây điện trở nhúng trong nước đựng trong nhiệt lượng kế.',s:[['Biến áp nguồn có nhiệm vụ cung cấp cho mạch một hiệu điện thế.',true,'Đúng. Biến áp nguồn cấp điện cho dây điện trở.'],['Oát kế dùng để đo cường độ dòng điện của nguồn điện.',false,'Sai. Oát kế đo công suất (hoặc điện năng) cung cấp cho dây điện trở.'],['Nhiệt lượng toả ra trên dây điện trở bằng nhiệt lượng mà nước thu vào.',true,'Đúng, khi bỏ qua hao phí và phần nhiệt bình thu vào. Đây là giả thiết để tính c = Pτ/(mΔt).'],['Nhiệt lượng kế ngăn cản sự truyền nhiệt của các chất đặt trong bình với môi trường bên ngoài.',true,'Đúng. Nhiệt lượng kế có lớp cách nhiệt để giảm hao phí.']]},
 {t:'ds',ls:'c1-4',q:'Để xác định nhiệt độ của một lò, người ta đưa vào lò một miếng sắt khối lượng 75 g. Khi miếng sắt có nhiệt độ bằng nhiệt độ của lò, người ta lấy ra và thả ngay vào một nhiệt lượng kế khối lượng 200 g chứa 500 g nước ở 30 °C. Khi cân bằng, nhiệt độ của nước tăng lên đến 45 °C. Lấy c(nước) = 4200 J/kg.K, c(sắt) = 478 J/kg.K, c(nhiệt lượng kế) = 418 J/kg.K. Bỏ qua trao đổi nhiệt với môi trường.',s:[['Độ giảm nội năng của miếng sắt bằng độ tăng nội năng của nước.',false,'Sai. Độ giảm nội năng của sắt bằng tổng độ tăng nội năng của nước và của nhiệt lượng kế.'],['Độ tăng nội năng của nước là 31 500 J.',true,'Đúng. Q nước = 0,5·4200·15 = 31 500 J.'],['Nhiệt độ của lò xấp xỉ là 958,6 °C.',true,'Đúng. Q nhiệt lượng kế = 0,2·418·15 = 1254 J. Tổng Q thu = 32 754 J = 0,075·478·(t − 45) ⇒ t ≈ 958,6 °C.'],['Miếng sắt đã truyền một nhiệt lượng là 35 052 J cho nước và nhiệt lượng kế.',false,'Sai. Nhiệt lượng sắt toả ra là 31 500 + 1254 = 32 754 J.']]},
 {t:'ds',ls:'c1-4',q:'Người ta thả miếng đồng khối lượng 2 kg vào 2 lít nước. Miếng đồng nguội đi từ 80 °C đến 10 °C. Lấy c(đồng) = 380 J/kg.K, c(nước) = 4200 J/kg.K.',s:[['Nhiệt lượng toả ra của đồng là 53 200 J.',true,'Đúng. Q = 2·380·(80 − 10) = 53 200 J.'],['Nhiệt lượng mà nước thu vào bằng nhiệt lượng đồng toả ra và bằng 53 200 J.',true,'Đúng, khi bỏ qua hao phí ra môi trường.'],['Khi bỏ miếng đồng vào nước thì nước nóng thêm 63,33 °C.',false,'Sai. Δt = 53 200/(2·4200) ≈ 6,33 °C, không phải 63,33 °C.'],['Tỉ số giữa nhiệt lượng toả ra của đồng và nhiệt lượng mà nước thu vào bằng 1.',true,'Đúng. Q toả = Q thu nên tỉ số bằng 1.']]},
 {t:'ds',ls:'c1-4',q:'Một nhiệt lượng kế bằng đồng thau khối lượng 128 g chứa 210 g nước ở 8,4 °C. Thả một miếng kim loại khối lượng 192 g đã nung nóng tới 100 °C vào nhiệt lượng kế. Nhiệt độ khi cân bằng là 21,5 °C. Cho c(nước) = 4,18·10³ J/kg.K, c(đồng thau) = 0,128·10³ J/kg.K.',s:[['Khi thả miếng kim loại vào nhiệt lượng kế thì miếng kim loại toả nhiệt.',true,'Đúng. Kim loại nóng hơn (100 °C) nên toả nhiệt.'],['Khi thả miếng kim loại vào nhiệt lượng kế thì nhiệt lượng kế và nước thu nhiệt.',true,'Đúng. Cả hai đều lạnh hơn (8,4 °C) nên thu nhiệt.'],['Phương trình cân bằng nhiệt của hệ là Q thu = Q toả ⇔ Q thu đồng + Q thu nước = Q toả kim loại.',true,'Đúng. Đây là phương trình cân bằng nhiệt.'],['Nhiệt dung riêng của chất làm miếng kim loại là 777,2 J/kg.K.',true,'Đúng. (0,128·128 + 0,21·4180)·13,1 = 0,192·c·78,5 ⇒ c ≈ 777,2 J/kg.K.']]}]},
{key:'lt1d',title:'Trả lời ngắn',note:'Tự điền đáp số. Dùng dấu phẩy cho số thập phân.',items:[
 {t:'sa',ls:'c1-4',q:'Nhiệt lượng cần để đun sôi 2 lít nước ở nhiệt độ 37 °C, biết nhiệt dung riêng của nước xấp xỉ 4,2 kJ/kg.K, là bao nhiêu kJ?',a:529.2,tol:.05,u:'kJ',sol:'2 lít nước có m = 2 kg. Q = m·c·Δt = 2·4,2·(100 − 37) = 529,2 kJ.'},
 {t:'sa',ls:'c1-4',q:'Một miếng đồng có khối lượng 500 gam đang ở nhiệt độ 137 °C. Nếu nó toả ra môi trường một nhiệt lượng 19 kJ thì nhiệt độ lúc sau của nó là bao nhiêu °C? Biết nhiệt dung riêng của đồng là 380 J/kg.K.',a:37,tol:.05,u:'°C',sol:'Δt = Q/(mc) = 19 000/(0,5·380) = 100 °C. Nhiệt độ lúc sau: 137 − 100 = 37 °C.'},
 {t:'sa',ls:'c1-4',q:'Một miếng kim loại khối lượng 1,5 kg ở 37 °C nhận nhiệt lượng 35,91 kJ thì nóng lên đến 100 °C. Muốn 1 kg kim loại đó tăng thêm 1 °C thì cần cung cấp nhiệt lượng bao nhiêu jun?',a:380,tol:.5,u:'J',sol:'Câu hỏi chính là nhiệt dung riêng: c = Q/(mΔt) = 35 910/(1,5·63) = 380 J/kg.K. Vậy cần 380 J.'},
 {t:'sa',ls:'c1-4',q:'Một khối nhôm nặng 5 kg ở 200 °C toả nhiệt để hạ xuống 37 °C. Biết muốn 1 kg nhôm tăng lên 1 °C cần cung cấp 0,9 kJ. Tính nhiệt lượng toả ra theo đơn vị MJ (làm tròn đến 2 chữ số thập phân).',a:.73,tol:.006,u:'MJ',sol:'c = 900 J/kg.K. Q = 5·900·(200 − 37) = 733 500 J ≈ 0,73 MJ.'},
 {t:'sa',ls:'c1-4',q:'Tính nhiệt lượng cần thiết (theo MJ, làm tròn đến 2 chữ số thập phân) để đun 5 kg nước từ 15 °C đến 100 °C trong một cái thùng bằng sắt có khối lượng 1,5 kg. Biết c(nước) = 4200 J/kg.K, c(sắt) = 460 J/kg.K.',a:1.84,tol:.006,u:'MJ',sol:'Nước: 5·4200·85 = 1 785 000 J; thùng: 1,5·460·85 = 58 650 J. Tổng 1 843 650 J ≈ 1,84 MJ.'},
 {t:'sa',ls:'c1-4',q:'Một ấm đun nước bằng nhôm khối lượng 350 gam chứa 2,75 kg nước được đun trên bếp. Khi nhận được nhiệt lượng 650 kJ thì ấm đạt đến 60 °C. Nhiệt độ ban đầu của ấm là bao nhiêu °C? (Làm tròn đến 1 chữ số thập phân) Biết c(nhôm) = 880 J/kg.K, c(nước) = 4190 J/kg.K.',a:5.1,tol:.06,u:'°C',sol:'Q = (0,35·880 + 2,75·4190)·(60 − t₀) = 11 830,5·(60 − t₀) = 650 000 ⇒ 60 − t₀ ≈ 54,94 ⇒ t₀ ≈ 5,1 °C.'},
 {t:'sa',ls:'c1-4',q:'Thả một quả cầu nhôm khối lượng 0,15 kg được đun nóng tới 100 °C vào một cốc nước ở 20 °C. Sau một thời gian, nhiệt độ của quả cầu và của nước đều bằng 25 °C. Coi như chỉ có quả cầu và nước truyền nhiệt cho nhau, c(nhôm) = 880 J/kg.K, c(nước) = 4200 J/kg.K. Khối lượng nước là bao nhiêu kg? (Làm tròn đến 2 chữ số thập phân)',a:.47,tol:.006,u:'kg',sol:'Q toả = 0,15·880·(100 − 25) = 9900 J = m·4200·(25 − 20) ⇒ m = 9900/21 000 ≈ 0,47 kg.'},
 {t:'sa',ls:'c1-4',q:'Để xác định nhiệt dung riêng của một kim loại, người ta bỏ vào nhiệt lượng kế chứa 500 gam nước ở 15 °C một miếng kim loại khối lượng 400 gam được đun nóng tới 100 °C. Nhiệt độ khi cân bằng là 20 °C. Bỏ qua nhiệt lượng làm nóng nhiệt lượng kế và không khí. Lấy c(nước) = 4190 J/kg.K. Nhiệt dung riêng của kim loại là bao nhiêu J/kg.K? (Làm tròn đến hàng đơn vị)',a:327,tol:.6,u:'J/kg.K',sol:'Q thu = 0,5·4190·5 = 10 475 J = 0,4·c·(100 − 20) ⇒ c = 10 475/32 ≈ 327 J/kg.K.'},
 {t:'sa',ls:'c1-4',q:'Một bình nhôm khối lượng 0,5 kg chứa 4 kg nước ở 20 °C. Thả vào bình một miếng sắt khối lượng 0,2 kg đã nung nóng tới 500 °C. Cho c(nhôm) = 896 J/kg.K, c(nước) = 4,18·10³ J/kg.K, c(sắt) = 0,46·10³ J/kg.K. Nhiệt độ của nước khi bắt đầu cân bằng nhiệt là bao nhiêu °C? (Làm tròn đến 1 chữ số thập phân)',a:22.6,tol:.06,u:'°C',sol:'0,2·460·(500 − t) = (0,5·896 + 4·4180)(t − 20) ⇒ 92(500 − t) = 17 168(t − 20) ⇒ t ≈ 22,6 °C.'},
 {t:'sa',ls:'c1-2',q:'Người ta cọ xát hai vật với nhau. Nhiệt dung (nhiệt lượng cần để vật nóng thêm 1 °C) của hai vật lần lượt là 500 J/K và 800 J/K. Sau một phút, nhiệt độ của mỗi vật tăng thêm 30 K. Công suất trung bình của việc cọ xát là bao nhiêu W?',a:650,tol:.5,u:'W',sol:'Công cọ xát chuyển hết thành nội năng: A = (500 + 800)·30 = 39 000 J trong 60 s. P = 39 000/60 = 650 W.'},
 {t:'sa',ls:'c1-4',q:'Người ta cho vòi nước nóng 80 °C và vòi nước lạnh 10 °C đồng thời chảy vào bể đã có sẵn 100 lít nước ở 30 °C. Lưu lượng mỗi vòi là 20 lít/phút. Phải mở hai vòi trong bao nhiêu phút thì thu được nước có nhiệt độ 40 °C?',a:5,tol:.05,u:'phút',sol:'Sau t phút, mỗi vòi chảy 20t kg nước. Nước nóng toả: 20t·(80 − 40) = 800t; nước lạnh và nước trong bể thu: 20t·(40 − 10) + 100·(40 − 30) = 600t + 1000. Cân bằng: 800t = 600t + 1000 ⇒ t = 5 phút.'}]}
];
