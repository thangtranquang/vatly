const LT2=[
{key:'lt2a',title:'Mô hình động học phân tử. Chuyển động Brown',note:'Thí nghiệm Brown, các nội dung của mô hình động học phân tử, đặc điểm khí lí tưởng.',items:[
 {t:'mc',ls:'c2-1',q:'Thí nghiệm Brown: quan sát chuyển động của các hạt khói chứng tỏ',c:1,o:[['các phân tử khí có kích thước rất nhỏ so với khoảng cách giữa chúng.','Sai. Đây là một nội dung của mô hình, nhưng thí nghiệm Brown không chứng minh trực tiếp điều này.'],['các phân tử khí chuyển động hỗn loạn, không ngừng.','Đúng. Hạt khói bị các phân tử khí va chạm không đều từ mọi phía nên chuyển động hỗn loạn; điều đó chứng tỏ chính các phân tử khí chuyển động hỗn loạn, không ngừng.'],['nhiệt độ càng cao các phân tử khí chuyển động càng chậm.','Sai. Nhiệt độ càng cao thì phân tử chuyển động càng nhanh.'],['lực liên kết phân tử khí rất lớn.','Sai. Lực tương tác giữa các phân tử khí rất yếu.']]},
 {t:'mc',ls:'c2-1',q:'Trong thí nghiệm Brown, hình ảnh quan sát được qua kính hiển vi mô tả',c:0,o:[['chuyển động hỗn loạn của các hạt khói.','Đúng. Thứ nhìn thấy được là các hạt khói chuyển động theo đường gấp khúc.'],['chuyển động hỗn loạn của các phân tử không khí.','Sai. Phân tử không khí quá nhỏ, không nhìn thấy được qua kính hiển vi quang học.'],['chuyển động có quy luật của hạt khói.','Sai. Đường đi của hạt khói là hỗn loạn, không theo quy luật nào.'],['chuyển động có quy luật của các phân tử không khí.','Sai. Phân tử không nhìn thấy được, và chúng cũng chuyển động hỗn loạn.']]},
 {t:'mc',ls:'c2-1',q:'Chọn phát biểu đúng.',c:1,o:[['Các hạt khói chuyển động hỗn loạn, không ngừng là do va chạm với các phân tử không khí đứng yên.','Sai. Phân tử đứng yên thì không thể đẩy hạt khói chuyển động liên tục.'],['Các hạt khói chuyển động hỗn loạn, không ngừng là do va chạm với các phân tử không khí cũng đang chuyển động hỗn loạn, không ngừng.','Đúng. Đây là cách giải thích chuyển động Brown.'],['Nhiệt độ không ảnh hưởng đến chuyển động hỗn loạn của hạt khói.','Sai. Nhiệt độ càng cao, phân tử khí va càng mạnh, hạt khói chuyển động càng mạnh.'],['Chuyển động hỗn loạn và không ngừng của hạt khói là do ánh sáng mặt trời tác động.','Sai. Chuyển động Brown xảy ra cả trong bóng tối; ánh sáng chỉ giúp ta nhìn thấy hạt khói.']]},
 {t:'mc',ls:'c2-1',q:'Đâu không phải là đặc điểm của khí lí tưởng?',c:1,o:[['Có kích thước phân tử rất nhỏ so với khoảng cách giữa chúng.','Đây là đặc điểm của khí lí tưởng, nên không phải đáp án.'],['Va chạm với thành bình là va chạm đàn hồi không tuyệt đối.','Đúng, đây không phải đặc điểm của khí lí tưởng. Trong mô hình khí lí tưởng, va chạm của phân tử với nhau và với thành bình là hoàn toàn đàn hồi.'],['Các phân tử khí được coi như là chất điểm (bỏ qua kích thước).','Đây là đặc điểm của khí lí tưởng. Chú ý: chỉ bỏ qua kích thước, phân tử vẫn có khối lượng.'],['Không tương tác với nhau khi chưa va chạm.','Đây là đặc điểm của khí lí tưởng.']]},
 {t:'ds',ls:'c2-1',q:'Thí nghiệm về chuyển động Brown.',s:[['Chuyển động Brown mô tả chuyển động hỗn loạn của các hạt khói.',true,'Đúng. Chuyển động Brown là chuyển động của các hạt nhỏ lơ lửng như hạt khói, hạt phấn hoa.'],['Chuyển động Brown chứng tỏ các phân tử chất khí chuyển động hỗn loạn, không ngừng.',true,'Đúng. Đây là kết luận của thí nghiệm.'],['Kích thước của các hạt khói càng lớn thì chuyển động Brown càng dễ quan sát.',false,'Sai. Hạt càng lớn, các cú va chạm từ mọi phía càng bù trừ nhau và hạt càng nặng, nên chuyển động Brown càng khó thấy.'],['Chuyển động Brown là cơ sở để chứng minh các phân tử chất khí va chạm và tạo ra áp suất lên thành bình chứa nó.',false,'Sai. Thí nghiệm Brown chứng tỏ phân tử khí chuyển động hỗn loạn và va chạm với hạt khói; nó không phải là thí nghiệm chứng minh áp suất lên thành bình.']]},
 {t:'ds',ls:'c2-1',q:'Thí nghiệm về chuyển động Brown.',s:[['Chuyển động của các hạt khói là chuyển động Brown.',true,'Đúng.'],['Chuyển động của các phân tử không khí là chuyển động Brown.',false,'Sai. Phân tử không khí chuyển động nhiệt; chuyển động Brown là của hạt khói do bị phân tử va vào.'],['Các hạt khói tương tác hút và đẩy với các phân tử không khí, điều này tạo ra quỹ đạo gấp khúc của hạt khói.',false,'Sai. Quỹ đạo gấp khúc là do các cú va chạm không cân bằng từ phân tử khí, không phải do lực hút đẩy giữa hạt khói và phân tử.'],['Tổng hợp lực tác dụng lên hạt khói tại mọi vị trí bị triệt tiêu vì quỹ đạo chuyển động của nó là hỗn loạn.',false,'Sai. Chính vì tổng hợp lực tại mỗi lúc không bằng 0 (va chạm không đều) nên hạt khói mới liên tục đổi hướng.']]},
 {t:'ds',ls:'c2-1',q:'Phát biểu nào đúng, phát biểu nào sai?',s:[['Các phân tử khí chuyển động hỗn loạn, không ngừng. Chuyển động này càng nhanh thì nhiệt độ khối khí càng cao.',true,'Đúng. Nhiệt độ là thước đo mức độ chuyển động của phân tử.'],['Lực liên kết của phân tử khí mạnh hơn phân tử chất lỏng và yếu hơn của chất rắn.',false,'Sai. Lực liên kết giữa các phân tử khí yếu nhất trong ba thể.'],['Chất khí có tính bành trướng, chiếm một phần bình chứa.',false,'Sai. Chất khí bành trướng, chiếm toàn bộ thể tích bình chứa.'],['Các phân tử khí khi chuyển động va chạm với thành bình, gây ra áp suất lên thành bình.',true,'Đúng.']]},
 {t:'ds',ls:'c2-1',q:'Phát biểu nào đúng, phát biểu nào sai?',s:[['Phân tử chất khí có kích thước rất nhỏ so với khoảng cách giữa chúng.',true,'Đúng. Đây là nội dung đầu tiên của mô hình động học phân tử chất khí.'],['Chất khí khó nén hơn chất lỏng.',false,'Sai. Chất khí dễ nén hơn nhiều vì khoảng cách giữa các phân tử rất lớn.'],['Khối khí gây ra áp suất lên thành bình là do sự va chạm và lực liên kết giữa chúng.',false,'Sai. Áp suất chỉ do va chạm của phân tử với thành bình; lực liên kết giữa các phân tử khí không đáng kể.'],['Đối với khí lí tưởng, va chạm giữa các phân tử khí là hoàn toàn đàn hồi.',true,'Đúng.']]}]},
{key:'lt2b',title:'Định luật Boyle',note:'Quá trình đẳng nhiệt pV = hằng số, thí nghiệm kiểm chứng và bài tập bơm khí.',items:[
 {t:'mc',ls:'c2-2',q:'Đâu được xem là một quá trình đẳng nhiệt?',c:0,o:[['Nén chậm một khối khí trong một xilanh bằng pít-tông.','Đúng. Nén chậm để khí kịp trao đổi nhiệt với môi trường, nhiệt độ gần như không đổi.'],['Bơm nhanh không khí vào trong bóng.','Sai. Bơm nhanh làm khí nóng lên, và lượng khí trong bóng còn thay đổi.'],['Bong bóng để ngoài trời nắng sau một thời gian thì bị bể.','Sai. Nhiệt độ khí tăng do nắng.'],['Đun nóng một khối khí trong bình kín.','Sai. Đây là quá trình đẳng tích, nhiệt độ thay đổi.']]},
 {t:'mc',ls:'c2-2',q:'Nén đẳng nhiệt một khối khí xác định từ 8 lít còn 2 lít, áp suất của khối khí đã',c:0,o:[['tăng 4 lần.','Đúng. pV = hằng số; V giảm 4 lần thì p tăng 4 lần.'],['giảm 4 lần.','Sai. Nén khí thì áp suất tăng.'],['tăng 6 lần.','Sai. 8 − 2 = 6 là hiệu, không phải tỉ số.'],['giảm 6 lần.','Sai. Vừa nhầm chiều vừa nhầm hiệu với tỉ số.']]},
 {t:'mc',ls:'c2-2',q:'Một khối khí xác định dãn nở đẳng nhiệt làm thể tích tăng 20% so với ban đầu, áp suất ban đầu là 2 atm. Áp suất khối khí sau khi dãn nở',c:0,o:[['giảm 0,33 atm.','Đúng. V₂ = 1,2V₁ ⇒ p₂ = 2/1,2 ≈ 1,67 atm, tức giảm khoảng 0,33 atm.'],['giảm 1,67 atm.','Sai. 1,67 atm là áp suất lúc sau, không phải độ giảm.'],['tăng 0,33 atm.','Sai. Dãn nở đẳng nhiệt thì áp suất giảm.'],['tăng 1,67 atm.','Sai. Nhầm cả chiều thay đổi và độ lớn.']]},
 {fixed:true,t:'mc',ls:'c2-2',q:'Đồ thị nào sau đây phù hợp để mô tả quá trình đẳng nhiệt?',fig:mg('T','p',G_LINE,'A')+mg('V','p',G_HYP,'B')+mg('V','p',G_VERT,'C')+mg('T','V',G_LINE,'D'),c:1,o:[['Đồ thị A','Sai. Đường p–T thẳng qua gốc là quá trình đẳng tích.'],['Đồ thị B','Đúng. Trong hệ p–V, đường đẳng nhiệt là một nhánh hypebol vì pV = hằng số.'],['Đồ thị C','Sai. Đường thẳng đứng trong hệ p–V là quá trình đẳng tích (V không đổi).'],['Đồ thị D','Sai. Đường V–T thẳng qua gốc là quá trình đẳng áp.']]},
 {t:'ds',ls:'c2-2',q:'Thí nghiệm kiểm chứng định luật Boyle với một khối khí xác định ở 27 °C thu được bảng số liệu (V; p): (15 cm³; 1,30·10⁵ Pa), (20; 1,00), (25; 0,80), (30; 0,65), (35; 0,55).',fig:mg('V','p',G_HYP+'<text x="104" y="74">T</text>'),s:[['Định luật Boyle được kiểm chứng khi giữ không đổi nhiệt độ của khối khí.',true,'Đúng. Tất cả các lần đo đều ở 27 °C.'],['Tại các lần đo, khi thể tích được điều chỉnh tăng thì áp suất thu được cũng tăng.',false,'Sai. Thể tích tăng từ 15 lên 35 cm³ thì áp suất giảm từ 1,30 xuống 0,55·10⁵ Pa.'],['Đồ thị phù hợp nhất để mô tả mối liên hệ giữa thể tích và áp suất là đường hypebol như hình.',true,'Đúng. Tích pV ≈ 19,5 đến 20 (đơn vị 10⁵ Pa·cm³) gần như không đổi, nên đồ thị p–V là hypebol.'],['Từ thực nghiệm ta kết luận rằng khi giữ nhiệt độ không đổi thì thể tích tỉ lệ nghịch với áp suất của khối khí.',true,'Đúng. Đó chính là định luật Boyle.']]},
 {t:'ds',ls:'c2-2',q:'Bạn Thảo thực hiện thí nghiệm kiểm chứng định luật Boyle với xilanh có vạch chia, pít-tông và áp kế gắn sẵn.',s:[['Trong thí nghiệm ta cần xác định mối liên hệ giữa nhiệt độ và thể tích của khối khí.',false,'Sai. Cần xác định mối liên hệ giữa thể tích và áp suất khi nhiệt độ không đổi.'],['Điều kiện làm thí nghiệm là giữ áp suất của khối khí không đổi.',false,'Sai. Điều kiện là giữ nhiệt độ không đổi; áp suất thay đổi theo thể tích.'],['Các bước gồm: bố trí thí nghiệm; dịch chuyển thật nhanh pít-tông để thay đổi thể tích; đọc thể tích; đọc áp kế; lặp lại 3–4 lần.',false,'Sai. Phải dịch chuyển pít-tông từ từ để nhiệt độ khí không đổi. Dịch nhanh thì khí nóng lên hoặc lạnh đi.'],['Để kiểm chứng thành công, ta cần khảo sát được tích áp suất và thể tích khối khí không đổi qua các lần đo.',true,'Đúng. pV = hằng số là nội dung định luật Boyle.']]},
 {t:'ds',ls:'c2-2',q:'Một nhóm học sinh khảo sát định luật Boyle bằng xilanh có pít-tông, tay quay, áp kế và cảm biến nhiệt độ.',s:[['Di chuyển pít-tông có thể đồng thời làm thay đổi áp suất và thể tích của khối khí trong xilanh.',true,'Đúng. Thể tích thay đổi thì áp suất cũng thay đổi theo.'],['Cảm biến nhiệt độ giúp ta đảm bảo nhiệt độ của khối khí được giữ không đổi.',true,'Đúng. Cảm biến giúp theo dõi và kiểm tra rằng nhiệt độ không đổi trong các lần đo.'],['Nếu tích pV trong các lần đo là như nhau thì thí nghiệm khảo sát định luật Boyle thành công.',true,'Đúng.'],['Nếu thay đổi nhiệt độ khối khí là 25 °C thì tích pV vẫn giữ nguyên so với ban đầu, chứng tỏ định luật Boyle không phụ thuộc giá trị nhiệt độ.',false,'Sai. Tích pV tỉ lệ với nhiệt độ tuyệt đối (pV = nRT). Ở nhiệt độ khác, pV có giá trị khác.']]},
 {t:'sa',ls:'c2-2',q:'Một thiết bị bơm hơi mỗi lần bơm được 800 cm³ khí ở áp suất 1 bar. Sau 24 lần bơm thì quả bóng bán kính 15 cm căng. Xem như nhiệt độ khí không đổi, ban đầu bóng không có khí. Áp suất khí trong bóng khi căng là bao nhiêu bar? (Làm tròn đến hai chữ số thập phân)',a:1.36,tol:.006,u:'bar',sol:'Thể tích bóng: V = (4/3)π·15³ ≈ 14 137 cm³. Khí bơm vào: 24·800 = 19 200 cm³ ở 1 bar. Boyle: p = 1·19 200/14 137 ≈ 1,36 bar.'}]},
{key:'lt2c',title:'Định luật Charles',note:'Quá trình đẳng áp V/T = hằng số, đồ thị và thí nghiệm.',items:[
 {t:'mc',ls:'c2-3',q:'Quá trình khối khí xác định biến đổi trạng thái mà tuân theo định luật Charles',c:2,o:[['là quá trình nhiệt độ khối khí không thay đổi.','Sai. Đó là định luật Boyle.'],['là quá trình thể tích khối khí thay đổi tỉ lệ nghịch với nhiệt độ tuyệt đối.','Sai. V tỉ lệ thuận với T.'],['thì áp suất gây ra bởi khối khí không đổi trong quá trình biến đổi trạng thái.','Đúng. Định luật Charles áp dụng cho quá trình đẳng áp.'],['thì thể tích khối khí thay đổi không đáng kể.','Sai. Thể tích thay đổi tỉ lệ với nhiệt độ tuyệt đối.']]},
 {t:'mc',ls:'c2-3',q:'Đồ thị trong hình biểu diễn quá trình biến đổi trạng thái nào?',fig:mg('T','V',G_LINE),c:2,o:[['Đẳng nhiệt.','Sai. Đẳng nhiệt trong hệ V–T là đường thẳng đứng (T không đổi).'],['Đẳng tích.','Sai. Đẳng tích trong hệ V–T là đường nằm ngang (V không đổi).'],['Đẳng áp.','Đúng. V tỉ lệ thuận với T, đường kéo dài đi qua gốc toạ độ.'],['Bất kì.','Sai. Đường thẳng qua gốc trong hệ V–T đặc trưng cho quá trình đẳng áp.']]},
 {t:'mc',ls:'c2-3',q:'Chọn phát biểu sai.',c:3,o:[['Hệ số dãn nở đẳng áp là 1/273.','Đúng (gần đúng), nên không phải đáp án. Cứ tăng 1 °C, thể tích tăng 1/273 thể tích ở 0 °C.'],['Khi áp suất được giữ không đổi thì thể tích tỉ lệ thuận với nhiệt độ của nó.','Phát biểu đúng nếu hiểu là nhiệt độ tuyệt đối, nên không phải đáp án.'],['Trong hệ toạ độ V–T (K), đường đẳng áp là đường thẳng kéo dài đi qua gốc toạ độ.','Phát biểu đúng.'],['Trong hệ toạ độ V–t (°C), đường đẳng áp là đường thẳng kéo dài đi qua gốc toạ độ.','Đây là phát biểu sai, nên là đáp án. Theo t (°C), đường đẳng áp kéo dài cắt trục nhiệt độ tại −273 °C chứ không qua gốc.']]},
 {t:'mc',ls:'c2-3',q:'Nén đẳng áp một khối khí ở nhiệt độ 7 °C làm cho thể tích khối khí giảm từ 6 lít còn 4 lít. Nhiệt độ khối khí',c:1,o:[['tăng 93,3 K.','Sai. Nén đẳng áp thì nhiệt độ giảm cùng tỉ lệ với thể tích.'],['giảm 93,3 K.','Đúng. T₁ = 280 K; T₂ = 280·4/6 ≈ 186,7 K, tức giảm khoảng 93,3 K.'],['là 4,7 °C.','Sai. Kết quả này do dùng nhầm nhiệt độ °C: 7·4/6. Phải dùng nhiệt độ tuyệt đối.'],['giảm 2,3 °C.','Sai. Cũng do dùng nhầm °C (7 − 4,7).']]},
 {fixed:true,t:'mc',ls:'c2-3',q:'Đồ thị nào sau đây phù hợp với quá trình đẳng áp?',fig:mg('V','p',G_HYP,'(a)')+mg('V','p',G_LINE,'(b)')+mg('V','p',G_VERT,'(c)')+mg('V','p',G_HOR,'(d)'),c:3,o:[['Đồ thị (a)','Sai. Hypebol trong hệ p–V là đường đẳng nhiệt.'],['Đồ thị (b)','Sai. p tỉ lệ với V không phải quá trình nào trong ba đẳng quá trình.'],['Đồ thị (c)','Sai. Đường thẳng đứng là đẳng tích.'],['Đồ thị (d)','Đúng. Áp suất không đổi nên đồ thị p–V là đường nằm ngang.']]},
 {fixed:true,t:'mc',ls:'c2-3',q:'Một khối khí biến đổi từ trạng thái (1) sang (2) theo đồ thị p–V ở hình đầu tiên (áp suất không đổi bằng p₂, thể tích giảm từ V₁ xuống V₂). Đồ thị V–T nào phù hợp?',fig:mg('V','p','<path d="M18 36 H96" class="dash"/>'+pt(96,36,'(1)')+pt(62,36,'(2)',-14)+'<path d="M92 36 L68 36" class="ln"/><path d="M72 32 L66 36 L72 40" class="ln"/>','đề bài')+mg('T','V','<path d="M18 40 H50" class="dash"/>'+pt(50,40,'(1)',-6)+pt(96,40,'(2)')+'<path d="M54 40 H92" class="ln"/>','(a)')+mg('T','V',G_LINE+pt(56,60,'(1)')+pt(98,30,'(2)'),'(b)')+mg('T','V',G_LINE+pt(98,30,'(1)')+pt(56,60,'(2)'),'(c)')+mg('T','V','<path d="M18 40 H50" class="dash"/>'+pt(50,40,'(2)',-6)+pt(96,40,'(1)')+'<path d="M54 40 H92" class="ln"/>','(d)'),c:2,o:[['Đồ thị (a)','Sai. V không đổi là quá trình đẳng tích.'],['Đồ thị (b)','Sai. Đây là dãn nở đẳng áp (V và T cùng tăng), ngược chiều với đề bài.'],['Đồ thị (c)','Đúng. Áp suất không đổi nên điểm trạng thái nằm trên đường thẳng qua gốc; V giảm thì T giảm, đi từ (1) xuống (2).'],['Đồ thị (d)','Sai. V không đổi là quá trình đẳng tích.']]},
 {t:'ds',ls:'c2-3',q:'Bạn Dũng khảo sát mối liên hệ giữa thể tích khối khí và nhiệt độ tuyệt đối: nhúng xilanh chứa khí vào nước ở các nhiệt độ khác nhau, đọc thể tích qua vạch chia, dùng một giọt thuỷ ngân làm pít-tông chặn khí.',s:[['Mục tiêu thí nghiệm là khảo sát định luật Charles.',true,'Đúng. Khảo sát V theo T khi áp suất không đổi.'],['Giọt thuỷ ngân được bôi dầu để đảm bảo áp suất khí luôn không đổi trong quá trình thí nghiệm.',true,'Đúng. Dầu giảm ma sát để giọt thuỷ ngân di chuyển tự do, áp suất khí luôn cân bằng với áp suất bên ngoài.'],['Các bước: thay nước ở các nhiệt độ khác nhau, ghi số chỉ nhiệt kế và thể tích trên vạch chia, lặp lại các thao tác.',true,'Đúng.'],['Thí nghiệm thành công khi ta thu được các giá trị V/T khác nhau trong các lần đo.',false,'Sai. Thí nghiệm thành công khi V/T gần như không đổi qua các lần đo.']]},
 {t:'ds',ls:'c2-3',q:'Thí nghiệm kiểm chứng định luật Charles thu được số liệu (p; T; V): (1,01·10⁵ Pa; 297,5 K; 30 ml), (1,00; 273,5; 27), (1,00; 314,5; 33), (1,01; 323,3; 35), (1,00; 332,4; 36).',s:[['Thí nghiệm trên là thí nghiệm về quá trình đẳng áp.',true,'Đúng. Áp suất gần như không đổi (1,00 đến 1,01·10⁵ Pa).'],['Trên hệ toạ độ V–T, đường mô tả phù hợp nhất các số liệu là đường thẳng kéo dài qua gốc toạ độ.',true,'Đúng. V/T ≈ 0,099 đến 0,108 ml/K, gần như không đổi.'],['Giá trị cần thay đổi trong thí nghiệm là nhiệt độ và áp suất; giá trị cần giữ cố định là thể tích.',false,'Sai. Thay đổi nhiệt độ, đo thể tích; giữ cố định áp suất.'],['Nếu thể tích khối khí là 20 ml thì áp suất khối khí lúc đó xấp xỉ 248 K.',false,'Sai. Áp suất không đo bằng K. Nếu hỏi nhiệt độ thì T = V/(V/T) ≈ 20/0,104 ≈ 190 K, cũng không phải 248 K.']]},
 {t:'sa',ls:'c2-3',q:'Một khối khí xác định dãn nở đẳng áp, thể tích tăng 10% làm nhiệt độ tăng thêm 29 °C. Nhiệt độ ban đầu của khối khí là bao nhiêu K?',a:290,tol:.5,u:'K',sol:'V₂ = 1,1V₁ ⇒ T₂ = 1,1T₁ ⇒ ΔT = 0,1T₁ = 29 K ⇒ T₁ = 290 K.'},
 {t:'sa',ls:'c2-3',q:'Khi tăng nhiệt độ của một lượng khí xác định (đẳng áp) từ 37 °C lên 147 °C thì thể tích tăng thêm 0,7 lít. Thể tích lúc sau là bao nhiêu lít? (Làm tròn đến hai chữ số thập phân)',a:2.67,tol:.006,u:'lít',sol:'T₁ = 310 K, T₂ = 420 K. V₂/V₁ = 420/310 và V₂ − V₁ = 0,7 ⇒ V₁ = 0,7·310/110 ≈ 1,97 lít ⇒ V₂ ≈ 2,67 lít.'}]},
{key:'lt2d',title:'Phương trình trạng thái khí lí tưởng',note:'pV/T = hằng số, pV = nRT, chuỗi các quá trình biến đổi.',items:[
 {t:'mc',ls:'c2-4',q:'Một khối khí biến đổi đẳng áp từ trạng thái 1 (p₁, V₁, T₁) sang trạng thái A (p_A, V_A, T_A), rồi đẳng nhiệt sang trạng thái 2 (p₂, V₂, T₂). Biểu thức phù hợp cho quá trình 1 → A là',c:1,o:[['p₁/T₁ = p₂/T₂.','Sai. Đây là biểu thức của quá trình đẳng tích, và lại dùng trạng thái 2.'],['V₁/T₁ = V_A/T_A.','Đúng. Quá trình 1 → A đẳng áp nên V/T = hằng số.'],['T₁ = T_A.','Sai. Đẳng áp thì nhiệt độ thay đổi; T không đổi là ở quá trình A → 2.'],['p₁p₂ = 1.','Sai. Không có biểu thức nào như vậy.']]},
 {t:'mc',ls:'c2-4',q:'Với cùng chuỗi biến đổi trên, biểu thức phù hợp cho quá trình A → 2 (đẳng nhiệt) là',c:0,o:[['p_A/V₂ = p₂/V_A.','Đúng. Biểu thức này tương đương p_A·V_A = p₂·V₂, đúng định luật Boyle.'],['T₁T₂ = 1.','Sai. Không có biểu thức nào như vậy.'],['V_A/T_A = V₂/T₂.','Sai. Đây là biểu thức đẳng áp; quá trình A → 2 đẳng nhiệt.'],['V_A = V₂.','Sai. Đẳng nhiệt thì thể tích thay đổi.']]},
 {t:'mc',ls:'c2-4',q:'Từ chuỗi biến đổi trên, mối liên hệ giữa trạng thái 1 và trạng thái 2 là',c:0,o:[['p₁V₁/T₁ = p₂V₂/T₂.','Đúng. Đây là phương trình trạng thái của lượng khí xác định.'],['p₁T₁/V₁ = p₂T₂/V₂.','Sai. T phải ở mẫu số, V ở tử số.'],['p₁/(V₁T₁) = p₂/(V₂T₂).','Sai. V phải ở tử số.'],['p₁V₁T₁ = p₂V₂T₂.','Sai. T phải ở mẫu số.']]},
 {t:'mc',ls:'c2-4',q:'Từ biểu thức pV/T = hằng số thì hằng số này bằng',c:0,o:[['nR.','Đúng. pV = nRT ⇒ pV/T = nR.'],['R.','Sai. Chỉ đúng khi lượng khí là 1 mol.'],['n.','Sai. Thiếu hằng số khí R.'],['n/R.','Sai. Phải là tích nR.']]},
 {t:'mc',ls:'c2-4',q:'Trong phòng thí nghiệm, người ta điều chế được 40 cm³ khí H₂ ở áp suất 750 mmHg và nhiệt độ 27 °C. Ở điều kiện tiêu chuẩn (0 °C và 760 mmHg), lượng khí H₂ này có thể tích là',c:0,o:[['35,9 cm³.','Đúng. V₀ = V·(p/p₀)·(T₀/T) = 40·(750/760)·(273/300) ≈ 35,9 cm³.'],['42,3 cm³.','Sai. Đảo ngược các tỉ số: khi về 0 °C và áp suất cao hơn, thể tích phải giảm.'],['24,6 cm³.','Sai. Không khớp với phương trình trạng thái.'],['32,7 cm³.','Sai. Không khớp với phương trình trạng thái.']]},
 {t:'sa',ls:'c2-4',q:'Một bình dung tích 5 lít chứa khí heli ở áp suất 10⁶ Pa, nhiệt độ −3 °C. Lượng khí heli trong bình là bao nhiêu mol? (R = 8,31 J/(mol·K); làm tròn đến hai chữ số thập phân)',a:2.23,tol:.006,u:'mol',sol:'n = pV/(RT) = 10⁶·5·10⁻³/(8,31·270) ≈ 2,23 mol.'},
 {t:'sa',ls:'c2-4',q:'Một bình dung tích 50 lít chứa 12 mol khí oxygen ở nhiệt độ 7 °C (coi là khí lí tưởng). Áp suất khí lên thành bình là bao nhiêu 10⁵ Pa? (R = 8,31 J/(mol·K); làm tròn đến hai chữ số thập phân)',a:5.58,tol:.006,u:'·10⁵ Pa',sol:'p = nRT/V = 12·8,31·280/0,05 ≈ 5,58·10⁵ Pa.'},
 {t:'sa',ls:'c2-4',q:'Bình 50 lít chứa 12 mol oxygen ở 7 °C như câu trên. Bình để hở làm một lượng khí thoát ra ngoài, nhiệt độ trong bình tăng thêm 10 °C, áp suất trong bình coi như không đổi. Biết M(O₂) = 32 g/mol. Khối lượng khí oxygen thoát ra là bao nhiêu gam? (Làm tròn đến một chữ số thập phân)',a:13.2,tol:.06,u:'g',sol:'p, V không đổi ⇒ n·T không đổi: n₂ = 12·280/290 ≈ 11,586 mol. Số mol thoát ra ≈ 0,414 mol ⇒ m ≈ 0,414·32 ≈ 13,2 g.'},
 {t:'sa',ls:'c2-4',q:'Nén một khối khí xác định từ 2 atm lên 5 atm, đồng thời thể tích giảm 20%. Nhiệt độ tuyệt đối ban đầu là 280 K thì lúc sau là bao nhiêu K?',a:560,tol:.5,u:'K',sol:'T₂ = T₁·(p₂V₂)/(p₁V₁) = 280·(5·0,8)/(2·1) = 560 K.'},
 {t:'sa',ls:'c2-4',q:'Lốp ô tô có áp suất tiêu chuẩn 2,30 bar ở 25 °C. Khi xe chạy nhanh, không khí trong lốp nóng lên đến 50 °C, thể tích lốp coi như không đổi. Áp suất khí trong lốp là bao nhiêu bar? (Làm tròn đến hàng phần trăm)',a:2.49,tol:.006,u:'bar',sol:'Đẳng tích: p₂ = p₁·T₂/T₁ = 2,30·323/298 ≈ 2,49 bar.'},
 {t:'sa',ls:'c2-4',q:'Nén một khối khí làm nhiệt độ tăng từ 450 K lên 500 K thì thể tích giảm từ 2,2 lít còn 1,1 lít. Áp suất khối khí tăng từ 1,1 bar lên bao nhiêu bar? (Làm tròn đến hàng phần mười)',a:2.4,tol:.06,u:'bar',sol:'p₂ = p₁·(V₁/V₂)·(T₂/T₁) = 1,1·2·(500/450) ≈ 2,44 ≈ 2,4 bar.'},
 {t:'sa',ls:'c2-4',q:'Một khối khí biến đổi trạng thái làm thể tích thay đổi từ 4 ml thành 6 ml, áp suất từ 1,5 bar lên 1,6 bar. Nhiệt độ ban đầu là 27 °C thì lúc sau là bao nhiêu °C? (Làm tròn đến hàng đơn vị)',a:207,tol:.5,u:'°C',sol:'T₂ = 300·(1,6·6)/(1,5·4) = 480 K = 207 °C.'},
 {t:'sa',ls:'c2-4',q:'Một bình dung tích 2 lít chứa khí ở 7 °C và áp suất 10⁶ Pa. Số phân tử khí trong bình là bao nhiêu 10²³ phân tử? (k = 1,38·10⁻²³ J/K; làm tròn đến hàng phần mười)',a:5.2,tol:.06,u:'·10²³',sol:'N = pV/(kT) = 10⁶·2·10⁻³/(1,38·10⁻²³·280) ≈ 5,2·10²³ phân tử.'},
 {t:'sa',ls:'c2-4',q:'Bóng đèn sợi đốt được bơm khí trơ ở áp suất 0,48 atm và 27 °C. Khi đèn sáng, áp suất khí tăng lên bằng áp suất khí quyển 1,00 atm. Coi thể tích bóng không đổi. Nhiệt độ khí trong bóng lúc đó là bao nhiêu °C? (Làm tròn đến hàng đơn vị)',a:352,tol:.5,u:'°C',sol:'Đẳng tích: T₂ = T₁·p₂/p₁ = 300·1/0,48 = 625 K = 352 °C.'}]},
{key:'lt2e',title:'Áp suất và động năng phân tử',note:'Xây dựng công thức áp suất theo mô hình động học, hằng số Boltzmann, động năng tịnh tiến trung bình.',items:[
 {t:'mc',ls:'c2-5',q:'Xét một khối khí hình lập phương cạnh l. Một phân tử khối lượng m chuyển động với vận tốc v dọc trục Ox, va chạm đàn hồi với hai thành đối diện. Lực trung bình mà phân tử này tác dụng lên một thành bình có độ lớn',c:1,o:[['mv/l.','Sai. Đây là động lượng chia cho quãng đường, chưa phải lực.'],['mv²/l.','Đúng. Mỗi va chạm truyền động lượng 2mv; thời gian giữa hai lần va vào cùng một thành là 2l/v. F = 2mv/(2l/v) = mv²/l.'],['2mv/l.','Sai. Chưa chia đúng thời gian giữa hai lần va chạm.'],['2mv²/l.','Sai. Thời gian giữa hai lần va vào cùng một thành là 2l/v, không phải l/v.']]},
 {t:'mc',ls:'c2-5',q:'Với khối khí lập phương thể tích V = l³ như trên, áp suất do một phân tử khí gây ra lên thành bình là',c:1,o:[['(m/V)·v.','Sai. Áp suất tỉ lệ với v².'],['(m/V)·v².','Đúng. p = F/l² = (mv²/l)/l² = mv²/l³ = (m/V)·v².'],['(2m/V)·v.','Sai. Thiếu bình phương và thừa hệ số 2.'],['(2m/V)·v².','Sai. Thừa hệ số 2 do tính sai lực.']]},
 {t:'mc',ls:'c2-5',q:'Áp suất của khối khí gồm N phân tử chuyển động hỗn loạn tác dụng lên thành bình được xác định bởi công thức',c:1,o:[['N·(m/V)·v.','Sai. Áp suất tỉ lệ với trung bình bình phương tốc độ.'],['(1/3)·(N/V)·m·v̄².','Đúng. Các phân tử chuyển động đều theo 3 phương nên chỉ ⅓ "đóng góp" vào mỗi phương.'],['(2/3)·(N/V)·m·v̄².','Sai. (2/3) xuất hiện khi viết theo động năng: p = (2/3)μ·W̄đ.'],['N·(m/V)·v̄².','Sai. Thiếu hệ số ⅓ vì phân tử chuyển động theo cả 3 phương.']]},
 {t:'mc',ls:'c2-5',q:'Mật độ phân tử khí càng lớn thì áp suất khí càng lớn vì',c:1,o:[['số lần va chạm của mỗi phân tử khí với thành bình nhiều hơn.','Sai. Ở cùng nhiệt độ, mỗi phân tử va vào thành với tần suất không phụ thuộc mật độ.'],['số lượng phân tử khí va chạm lên thành bình trong một đơn vị thời gian nhiều hơn.','Đúng. Nhiều phân tử hơn trong mỗi m³ thì mỗi giây có nhiều cú va lên thành hơn.'],['lực liên kết giảm đi.','Sai. Lực liên kết không liên quan đến áp suất khí lí tưởng.'],['mỗi phân tử va chạm với thành bình nhanh hơn.','Sai. Tốc độ phân tử chỉ phụ thuộc nhiệt độ.']]},
 {t:'mc',ls:'c2-5',q:'Một khối khí ở nhiệt độ 27 °C có mật độ phân tử 10²⁵ phân tử/m³. Áp suất khối khí gây nên thành bình là (k = 1,38·10⁻²³ J/K)',c:1,o:[['41802 Pa.','Sai. Không khớp với p = μkT.'],['41400 Pa.','Đúng. p = μkT = 10²⁵·1,38·10⁻²³·300 = 41 400 Pa.'],['45050 Pa.','Sai. Không khớp với p = μkT.'],['42000 Pa.','Sai. Làm tròn k thành 1,4·10⁻²³ quá thô.']]},
 {t:'mc',ls:'c2-5',q:'Một khối khí có mật độ phân tử μ và thể tích V; mỗi phân tử có động năng tịnh tiến trung bình W̄đ. Biểu thức xác định áp suất của khối khí là',c:1,o:[['(2/3)·V·W̄đ.','Sai. Áp suất tỉ lệ với mật độ μ, không phải thể tích V.'],['(2/3)·μ·W̄đ.','Đúng. p = (1/3)μm·v̄² = (2/3)μ·(½m·v̄²) = (2/3)μ·W̄đ.'],['(3/2)·V·W̄đ.','Sai. Sai cả hệ số và đại lượng.'],['(3/2)·μ·W̄đ.','Sai. Hệ số phải là 2/3, không phải 3/2.']]},
 {t:'mc',ls:'c2-5',q:'Từ biểu thức áp suất p = (2/3)(N/V)·W̄đ và pV = nRT, ta rút ra được biểu thức của W̄đ là',c:1,o:[['(3/2)·(R/N_A)·T².','Sai. Động năng tỉ lệ bậc nhất với T.'],['(3/2)·(R/N_A)·T.','Đúng. (2/3)N·W̄đ = nRT, mà N = n·N_A ⇒ W̄đ = (3/2)(R/N_A)T = (3/2)kT.'],['(3/2)·(R/N_A)·V.','Sai. Động năng không phụ thuộc thể tích.'],['(3/2)·(R/N_A)·V².','Sai. Động năng không phụ thuộc thể tích.']]},
 {t:'mc',ls:'c2-5',q:'Tỉ số của hai hằng số R/N_A được gọi là',c:1,o:[['hằng số khí lí tưởng.','Sai. Hằng số khí lí tưởng là R.'],['hằng số Boltzmann.','Đúng. k = R/N_A ≈ 1,38·10⁻²³ J/K.'],['hằng số điện môi.','Sai. Không liên quan.'],['hằng số Avogadro.','Sai. Hằng số Avogadro là N_A.']]},

function Recorder(kind,ref,title){this.kind=kind;this.ref=ref;this.title=title;this.id=null;this.q=Promise.resolve();this.t0=Date.now();}
Recorder.prototype.ensure=function(){if(!this.idp)this.idp=API.post('/api/attempts',{kind:this.kind,ref:this.ref,title:this.title}).then(r=>{this.id=r.id;});return this.idp;};
Recorder.prototype.err=function(e){if(e.status===401){USER=null;showAuth('Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại; kết quả lượt này chưa được lưu.');}else toast('Chưa lưu được kết quả: '+e.message,true);};
Recorder.prototype.answer=function(list){this.q=this.q.then(()=>this.ensure()).then(()=>API.post('/api/attempts/'+this.id+'/answers',{answers:list})).catch(e=>this.err(e));return this.q;};
Recorder.prototype.finish=function(score,max){this.q=this.q.then(()=>this.ensure()).then(()=>API.post('/api/attempts/'+this.id+'/finish',{score:Math.round(score*1000)/1000,max,duration:Math.round((Date.now()-this.t0)/1000)})).then(()=>toast('Đã lưu kết quả vào lịch sử.')).catch(e=>this.err(e));return this.q;};

function showAuth(msg,mode){const app=$('#app');app.removeAttribute('data-ch');$('#tnav').innerHTML='';renderUser();active=null;clearInterval(EXTIMER);mode=mode||'login';
  app.innerHTML='<section class="authwrap"><div class="authintro"><p class="eyebrow">Ôn thi tốt nghiệp THPT · Vật lí 12</p><h1>Hiểu <em>bản chất</em>, nhớ công thức lâu</h1><p class="sub">20 bài học có hình động, hơn 200 câu luyện tập, thi thử theo cấu trúc đề tốt nghiệp. Đăng nhập để lưu lịch sử làm bài, xem lại câu sai và làm lại cho đến khi đúng.</p></div>'+
   '<div class="authcard"><div class="seg authtabs" role="tablist"><label><input type="radio" name="am" id="am-login" value="login"'+(mode==='login'?' checked':'')+'> Đăng nhập</label><label><input type="radio" name="am" id="am-reg" value="register"'+(mode==='register'?' checked':'')+'> Tạo tài khoản</label></div>'+
   (msg?'<p class="amsg">'+esc(msg)+'</p>':'')+'<form id="authform" novalidate><div class="field" id="f-name"'+(mode==='login'?' hidden':'')+'><label for="a-name">Họ và tên</label><input id="a-name" name="name" autocomplete="name" maxlength="80"></div>'+
   '<div class="field"><label for="a-email">Email</label><input id="a-email" name="email" type="email" autocomplete="email" required maxlength="254"></div>'+
   '<div class="field"><label for="a-pass">Mật khẩu</label><input id="a-pass" name="password" type="password" autocomplete="'+(mode==='login'?'current-password':'new-password')+'" required minlength="8" maxlength="128"><small id="a-hint"'+(mode==='login'?' hidden':'')+'>Ít nhất 8 kí tự.</small></div>'+
   '<p class="aerr" id="aerr" role="alert" hidden></p><button class="btn fill wide" type="submit" id="asubmit">'+(mode==='login'?'Đăng nhập':'Tạo tài khoản')+'</button></form>'+
   '<p class="qnote">Quên mật khẩu? Hãy nhờ thầy cô quản trị đặt lại mật khẩu tạm thời cho em.</p></div></section>';
  app.querySelectorAll('input[name=am]').forEach(r=>r.addEventListener('change',()=>showAuth('',r.value)));
  $('#authform').addEventListener('submit',async e=>{e.preventDefault();const err=$('#aerr'),btn=$('#asubmit');err.hidden=true;
    const email=$('#a-email').value.trim(),password=$('#a-pass').value,name=$('#a-name').value.trim();
    if(!email||!password||(mode==='register'&&!name)){err.textContent='Hãy điền đủ các ô.';err.hidden=false;return;}
    if(mode==='register'&&password.length<8){err.textContent='Mật khẩu cần ít nhất 8 kí tự.';err.hidden=false;return;}
    btn.disabled=true;btn.textContent='Đang xử lí...';
    try{const r=await API.post(mode==='login'?'/api/login':'/api/register',mode==='login'?{email,password}:{email,password,name});USER=r.user;await loadSummary();renderUser();if(!location.hash||location.hash==='#login')location.hash='#home';route();}
    catch(ex){err.textContent=ex.message;err.hidden=false;btn.disabled=false;btn.textContent=mode==='login'?'Đăng nhập':'Tạo tài khoản';}});}
const KIND={lesson:'Bài học',practice:'Luyện tập',test:'Kiểm tra chương',exam:'Thi thử',review:'Ôn câu sai'};
const when=t=>new Date(t).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
function scoreText(a){if(a.finished_at==null)return '<span class="chip">Chưa xong</span>';const ten=a.kind==='exam'||a.kind==='test';return '<span class="chip '+(a.score/a.max>=.8?'ok':'mid')+'">'+(ten?fmt(a.score/a.max*10,2)+'/10':fmt(a.score,2)+'/'+fmt(a.max,a.max%1?2:0))+'</span>';}
function pageShell(title,sub){const app=$('#app');app.removeAttribute('data-ch');nav('me');active=null;app.innerHTML='<p class="crumbs"><a href="#home">Trang chủ</a> › '+esc(title)+'</p><header class="lhead"><span class="lno">'+esc(USER.name)+'</span><h1>'+esc(title)+'</h1>'+(sub?'<p class="one">'+sub+'</p>':'')+'</header><div id="pg"><p class="qnote">Đang tải...</p></div>';return $('#pg');}
function failBox(pg,e){pg.innerHTML='<p class="aerr">'+esc(e.message)+'</p><button class="btn" type="button" onclick="location.reload()">Tải lại trang</button>';}
async function mePage(){const pg=pageShell('Tiến bộ của em','Tổng hợp từ tất cả các lượt em đã làm. Bài nào tỉ lệ đúng thấp thì nên ôn lại trước.');
  try{const [s,h]=await Promise.all([API.get('/api/me/summary'),API.get('/api/attempts?limit=5')]);
    const rows=L.map(l=>({l,st:s.lessons[l.id]})).filter(x=>x.st);const weak=rows.filter(x=>x.st.max>0).sort((a,b)=>a.st.points/a.st.max-b.st.points/b.st.max).slice(0,3);
    let html='<div class="stats"><a class="stat" href="#history"><b>'+s.totals.attempts+'</b><span>lượt làm bài</span></a><div class="stat"><b>'+s.totals.questions+'</b><span>câu hỏi khác nhau đã làm</span></div><a class="stat warn" href="#wrong"><b>'+s.totals.wrongNow+'</b><span>câu đang sai, cần làm lại</span></a></div>';
    if(!rows.length)html+='<p class="sub">Em chưa làm câu nào. Hãy bắt đầu từ <a href="#c1-1">Bài 1.1</a> hoặc vào <a href="#exam">Thi thử</a>.</p>';
    else{if(weak.length)html+='<h2 class="part2">Nên ôn lại trước</h2><ul class="weaklist">'+weak.map(x=>'<li><a href="#'+x.l.id+'">'+esc(lessonName(x.l.id))+'</a><span>đúng '+fmt(100*x.st.points/x.st.max,0)+'%</span></li>').join('')+'</ul>';
      html+='<h2 class="part2">Theo từng bài</h2><div class="scroll"><table class="t prog"><tr><th>Bài</th><th>Số câu đã trả lời</th><th>Tỉ lệ điểm đúng</th></tr>'+L.map(l=>{const st=s.lessons[l.id];if(!st)return '<tr><td><a href="#'+l.id+'">'+esc(lessonName(l.id))+'</a></td><td colspan="2" class="qnote">Chưa làm</td></tr>';const p=st.max?st.points/st.max:0;return '<tr><td><a href="#'+l.id+'">'+esc(lessonName(l.id))+'</a></td><td>'+st.answered+'</td><td><span class="bar"><i style="width:'+Math.round(p*100)+'%" class="'+(p>=.8?'g':p>=.5?'m':'b')+'"></i></span> '+fmt(p*100,0)+'%</td></tr>';}).join('')+'</table></div>';}
    if(h.attempts.length)html+='<h2 class="part2">Lượt làm gần đây</h2>'+histList(h.attempts)+'<p><a class="btn" href="#history">Xem toàn bộ lịch sử</a></p>';
    pg.innerHTML=html;}catch(e){failBox(pg,e);}}
function histList(list){return '<ul class="hist">'+list.map(a=>'<li><a href="#attempt-'+a.id+'"><span class="hk">'+KIND[a.kind]+'</span><span class="ht">'+esc(a.title)+'</span><span class="hd">'+when(a.started_at)+' · '+a.answered+' câu'+(a.wrong?' · sai '+a.wrong:'')+'</span>'+scoreText(a)+'</a></li>').join('')+'</ul>';}
async function historyPage(){const pg=pageShell('Lịch sử làm bài','Bấm vào từng lượt để xem lại em đã chọn gì, câu nào sai và lời giải.');let off=0;const box=document.createElement('div');
  async function more(){try{const h=await API.get('/api/attempts?limit=50&offset='+off);if(off===0){pg.innerHTML='';if(!h.total){pg.innerHTML='<p class="sub">Chưa có lượt làm bài nào.</p>';return;}pg.appendChild(box);}
    box.insertAdjacentHTML('beforeend',histList(h.attempts));off+=h.attempts.length;const old=$('#hmore');if(old)old.remove();if(off<h.total){const b=button(pg,'Xem thêm',more);b.id='hmore';}}catch(e){failBox(pg,e);}}
  more();}
function reviewCard(q,a,n){const d=document.createElement('div');d.className='qi '+(a.correct?'okq':'noq');const type=q.t==='mc'?'Trắc nghiệm':q.t==='ds'?'Đúng / Sai':'Trả lời ngắn';
  let h='<div class="qhead"><span class="qtype">'+type+'</span><span class="qnum">Câu '+n+'</span><a class="tag2" href="#'+q.ls+'">Bài '+(BYID[q.ls]?BYID[q.ls].no:'')+'</a><span class="qpts">'+fmt(a.points,2)+'/'+fmt(a.max,2)+' điểm</span></div><p class="qq">'+sx(q.q)+'</p>'+(q.fig?'<div class="qfig">'+q.fig+'</div>':'');
  if(q.t==='mc'){const pick=a.answer&&a.answer.pick;h+='<div class="mopts">'+q.o.map((o,i)=>'<div class="mo ro'+(i===q.c?' right':i===pick?' wrong':'')+'"><span class="ml">'+'ABCD'[i]+'</span><span>'+sx(o[0])+(i===pick?' <b>(em chọn)</b>':'')+'</span></div>').join('')+'</div>';
    h+='<div class="fb '+(a.correct?'ok':'no')+'"><div class="h">'+(a.correct?'Em làm đúng':pick==null?'Em bỏ trống':'Em làm sai')+'</div>'+(pick!=null&&!a.correct?'<p><b>Vì sao lựa chọn của em sai:</b> '+sx(q.o[pick][1])+'</p>':'')+'<p><b>Đáp án đúng:</b> '+sx(q.o[q.c][1])+'</p></div>';}
  else if(q.t==='ds'){const picks=(a.answer&&a.answer.picks)||[];h+=q.s.map((s,si)=>{const p=picks[si];const ok=p===s[1];return '<div class="dsr"><div class="dsline"><span class="dl">'+'abcd'[si]+')</span><span class="dt">'+sx(s[0])+'</span><span class="chip '+(ok?'ok':'')+'">Em chọn: '+(p==null?'bỏ trống':p?'Đúng':'Sai')+' · Đáp án: '+(s[1]?'Đúng':'Sai')+'</span></div><div class="fb '+(ok?'ok':'no')+'">'+sx(s[2])+'</div></div>';}).join('');}
  else{const v=a.answer&&a.answer.value;h+='<div class="fb '+(a.correct?'ok':'no')+'"><div class="h">Em trả lời: '+esc(v==null||v===''?'bỏ trống':String(v))+' · Đáp số: '+String(q.a).replace('.',',')+' '+esc(q.u||'')+'</div><p>'+sx(q.sol)+'</p></div>';}
  d.innerHTML=h;return d;}
async function attemptPage(id){const pg=pageShell('Xem lại lượt làm bài');
  try{const r=await API.get('/api/attempts/'+id);const a=r.attempt;$('#app .lhead h1').textContent=a.title;
    const wrong=r.answers.filter(x=>!x.correct).length;pg.innerHTML='<div class="qsum exsumbox"><div>'+scoreText(Object.assign({},a))+' <span class="qnote">'+KIND[a.kind]+' · '+when(a.started_at)+(a.duration_s?' · làm trong '+Math.floor(a.duration_s/60)+' phút '+(a.duration_s%60)+' giây':'')+'</span></div><p>Em đã trả lời '+r.answers.length+' câu, '+(wrong?'<b>sai '+wrong+' câu</b>. Câu viền đỏ là câu sai.':'đúng toàn bộ.')+'</p>'+(wrong?'<a class="btn fill" href="#review">Làm lại các câu đang sai</a>':'')+'</div>';
    const list=document.createElement('div');pg.appendChild(list);let n=0;r.answers.forEach(x=>{const q=QBANK[x.qid];n++;if(!q){list.insertAdjacentHTML('beforeend','<div class="qi"><p class="qnote">Câu '+n+' không còn trong ngân hàng câu hỏi.</p></div>');return;}list.appendChild(reviewCard(q,x,n));});}
  catch(e){failBox(pg,e);}}
async function wrongPage(){const pg=pageShell('Câu đang sai','Đây là những câu mà lần gần nhất em trả lời còn sai. Làm lại đúng thì câu đó sẽ tự rời khỏi danh sách.');
  try{const r=await API.get('/api/wrong');const list=r.wrong.filter(w=>QBANK[w.qid]);if(!list.length){pg.innerHTML='<p class="sub">Không còn câu nào sai. Rất tốt! Hãy thử <a href="#exam">một đề thi thử</a>.</p>';return;}
    const by={};list.forEach(w=>{(by[w.ls]=by[w.ls]||[]).push(w);});
    let h='<div class="qsum exsumbox"><p><b>'+list.length+' câu</b> đang sai.</p><a class="btn fill" href="#review">Làm lại '+Math.min(list.length,30)+' câu sai nhiều nhất</a></div>';
    L.filter(l=>by[l.id]).forEach(l=>{h+='<h2 class="part2"><a href="#'+l.id+'">'+esc(lessonName(l.id))+'</a> <span class="qnote">'+by[l.id].length+' câu</span></h2><ul class="wl">'+by[l.id].map(w=>'<li><span>'+sx(QBANK[w.qid].q.length>300?QBANK[w.qid].q.slice(0,300)+'…':QBANK[w.qid].q)+'</span><span class="chip">sai '+w.wrongCount+'/'+w.tries+' lần</span></li>').join('')+'</ul>';});
    pg.innerHTML=h;}catch(e){failBox(pg,e);}}
async function reviewPage(){const pg=pageShell('Làm lại câu sai','Làm như bài luyện tập: chọn xong là thấy ngay đúng sai và lời giải.');
  try{const r=await API.get('/api/wrong');const items=r.wrong.map(w=>QBANK[w.qid]).filter(Boolean).slice(0,30);if(!items.length){pg.innerHTML='<p class="sub">Không còn câu nào sai để làm lại.</p>';return;}
    pg.innerHTML='<div id="quiz"></div><p><a class="btn" href="#wrong">Về danh sách câu sai</a></p>';renderQuiz($('#quiz'),items,'rv'+Date.now(),null,()=>new Recorder('review','wrong','Làm lại câu sai ('+items.length+' câu)'));}
  catch(e){failBox(pg,e);}}
function accountPage(){const pg=pageShell('Đổi mật khẩu','Email đăng nhập: '+esc(USER.email));
  pg.innerHTML='<form id="pwform" class="authcard" novalidate><div class="field"><label for="p-old">Mật khẩu hiện tại</label><input id="p-old" type="password" autocomplete="current-password" required></div><div class="field"><label for="p-new">Mật khẩu mới</label><input id="p-new" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><small>Ít nhất 8 kí tự. Các thiết bị khác sẽ bị đăng xuất.</small></div><p class="aerr" id="perr" role="alert" hidden></p><button class="btn fill" type="submit">Lưu mật khẩu mới</button></form>';
  $('#pwform').addEventListener('submit',async e=>{e.preventDefault();const er=$('#perr');er.hidden=true;try{await API.post('/api/me/password',{oldPassword:$('#p-old').value,newPassword:$('#p-new').value});toast('Đã đổi mật khẩu.');location.hash='#me';}catch(ex){er.textContent=ex.message;er.hidden=false;}});}

function route(){const h=(location.hash||'#home').slice(1);active=null;clearInterval(EXTIMER);if(!USER){showAuth();return;}window.scrollTo(0,0);if(h==='me')return mePage();if(h==='history')return historyPage();if(h==='wrong')return wrongPage();if(h==='review')return reviewPage();if(h==='account')return accountPage();{const m=h.match(/^attempt-(\d{1,12})$/);if(m)return attemptPage(m[1]);}if(h==='exam'){examLanding();window.scrollTo(0,0);return;}if(/^exam-(1|2|r)$/.test(h)){examPage(h.slice(5));window.scrollTo(0,0);return;}if(/^lt-[12]$/.test(h)){practice(+h.slice(3));window.scrollTo(0,0);return;}if(BYID[h])lesson(BYID[h]);else if(/^test-[1-4]$/.test(h))test(+h.slice(5));else home();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);
if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(readColors,50));
new MutationObserver(()=>setTimeout(readColors,20)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
readColors();assignIds();API.get('/api/me').then(r=>{USER=r.user;return loadSummary();}).then(()=>{renderUser();route();}).catch(e=>{USER=null;showAuth(e.status&&e.status!==401?e.message:'');});
let last=0;function frame(ts){const dt=Math.min(.04,Math.max(0,(ts-last)/1000));last=ts;if(active&&active.visible&&!document.hidden){if(active.playing)active.step(dt);active.draw();}requestAnimationFrame(frame);}requestAnimationFrame(frame);
})();
</script>

</body>
