 <ul><li><b>Thang Celsius (°C):</b> 0 °C là nước đá tan, 100 °C là nước sôi ở áp suất 1 atm.</li>
 <li><b>Thang Kelvin (K), còn gọi là thang nhiệt độ tuyệt đối:</b> 0 K là <b>không độ tuyệt đối</b> (−273,15 °C), lúc chuyển động nhiệt của phân tử gần như ngừng. Không có nhiệt độ nào thấp hơn. Độ chia 1 K bằng 1 °C.</li>
 <li><b>Thang Fahrenheit (°F):</b> 32 °F là nước đá tan, 212 °F là nước sôi.</li></ul>
 <p><b>Nhiệt kế</b> hoạt động dựa trên một tính chất thay đổi theo nhiệt độ: sự giãn nở của chất lỏng, điện trở, bức xạ hồng ngoại...</p>`,
 observe:['Đặt A nóng, B lạnh rồi bấm "Cho tiếp xúc": mũi tên nhiệt đi từ A sang B.','Theo dõi số đo: chênh lệch giảm nhanh lúc đầu rồi chậm dần, cuối cùng hai vật cùng nhiệt độ.','Thử cho B nóng hơn A: mũi tên đổi chiều.','Đặt A và B cùng nhiệt độ rồi cho tiếp xúc: không có mũi tên nào.'],
 formulas:[{f:'T (K) = t (°C) + 273',parts:[['T','nhiệt độ tuyệt đối (K)'],['t','nhiệt độ Celsius (°C)'],['273','chính xác là 273,15; khi tính toán thường lấy 273']],why:'Thang Kelvin lấy gốc 0 tại <b>không độ tuyệt đối</b>, còn độ chia giống hệt thang Celsius. Vì vậy chỉ cần dời gốc đi 273.'},
  {f:'t (°F) = 1,8·t (°C) + 32',parts:[['32 °F','nước đá tan (0 °C)'],['212 °F','nước sôi (100 °C)']],why:'Từ đá tan đến nước sôi là <b>180 °F</b> nhưng chỉ <b>100 °C</b>, nên mỗi độ C bằng 1,8 độ F.'},
  {f:'ΔT (K) = Δt (°C)',parts:[['Δ','độ chênh lệch, độ tăng']],why:'Hai thang có độ chia bằng nhau: tăng 1 °C cũng là tăng 1 K. <b>Không cộng 273</b> vào độ chênh lệch.'}],
 memo:'"Kelvin = Celsius + 273". Đổi sang độ F thì "nhân 1,8 rồi cộng 32".',
 wrong:[['Nhiệt truyền từ vật có nội năng lớn sang vật có nội năng nhỏ.','Nhiệt truyền từ vật nhiệt độ cao sang nhiệt độ thấp. Một bể nước lạnh có nội năng lớn hơn cốc nước sôi nhưng vẫn nhận nhiệt từ cốc.'],['Tăng 10 °C là tăng 283 K.','Độ chênh lệch thì như nhau: tăng 10 °C là tăng 10 K.'],['Có thể làm lạnh một vật xuống −300 °C.','Không thể thấp hơn 0 K = −273,15 °C.']],
 quiz:[
 {t:'mc',q:'Khi cho hai vật tiếp xúc nhau, nhiệt tự truyền từ:',c:0,o:[['Vật có nhiệt độ cao hơn sang vật có nhiệt độ thấp hơn','Đúng. Chiều truyền nhiệt do nhiệt độ quyết định và dừng khi hai vật cùng nhiệt độ.'],['Vật có nội năng lớn hơn sang vật có nội năng nhỏ hơn','Sai. Một bể nước lạnh có nội năng lớn hơn cốc nước sôi, nhưng cốc nước sôi vẫn truyền nhiệt cho bể.'],['Vật có khối lượng lớn hơn sang vật có khối lượng nhỏ hơn','Sai. Khối lượng không quyết định chiều truyền nhiệt.'],['Vật có nhiệt dung riêng lớn hơn sang vật có nhiệt dung riêng nhỏ hơn','Sai. Nhiệt dung riêng chỉ cho biết vật nóng lên nhanh hay chậm.']]},
 {t:'mc',q:'Nhiệt độ 27 °C ứng với bao nhiêu kelvin?',c:0,o:[['300 K','Đúng. T = t + 273 = 27 + 273 = 300 K.'],['246 K','Sai. Đây là phép trừ 273 − 27. Đổi sang kelvin phải cộng thêm 273.'],['27 K','Sai. Độ chia hai thang bằng nhau nhưng điểm 0 lệch nhau 273.'],['−246 K','Sai. Nhiệt độ kelvin không bao giờ âm, vì 0 K là thấp nhất.']]},
 {t:'mc',q:'Ở không độ tuyệt đối (0 K) thì:',c:0,o:[['Chuyển động nhiệt của các phân tử gần như ngừng lại','Đúng. 0 K là nhiệt độ thấp nhất, khi động năng chuyển động nhiệt nhỏ nhất.'],['Mọi chất đều bay hơi hết','Sai. Ngược lại, ở nhiệt độ rất thấp hầu hết các chất đều ở thể rắn.'],['Nhiệt độ bằng −100 °C','Sai. 0 K = −273,15 °C.'],['Các phân tử chuyển động nhanh nhất','Sai. Nhiệt độ càng thấp, phân tử chuyển động càng chậm.']]},
 {t:'ds',q:'Nhiệt độ của một vật tăng từ 20 °C lên 50 °C.',s:[['Độ tăng nhiệt độ là 30 K.',true,'Đúng. Độ chia hai thang bằng nhau: tăng 30 °C cũng là tăng 30 K.'],['Nhiệt độ lúc sau là 323 K.',true,'Đúng. 50 + 273 = 323 K.'],['Theo thang Kelvin, độ tăng nhiệt độ là 303 K.',false,'Sai. 303 K là nhiệt độ 30 °C chứ không phải độ tăng. Độ tăng là 323 − 293 = 30 K.'],['Động năng trung bình của các phân tử trong vật tăng lên.',true,'Đúng. Nhiệt độ là thước đo động năng trung bình của chuyển động nhiệt.']]},
 {t:'sa',q:'Nhiệt độ cơ thể người bình thường là 37 °C. Nhiệt độ này bằng bao nhiêu độ F?',a:98.6,tol:.05,u:'°F',sol:'t(°F) = 1,8·t(°C) + 32 = 1,8·37 + 32 = 66,6 + 32 = 98,6 °F.'}]},

{id:'c1-4',ch:1,no:'1.4',title:'Nhiệt dung riêng',sim:'heatcap',
 one:'Nhiệt dung riêng cho biết một chất "khó nóng" đến đâu. Nhiệt lượng cần để làm nóng vật là Q = m·c·Δt.',
 essence:`<p>Nhiệt lượng cần để làm một vật nóng lên phụ thuộc vào ba thứ: <b>khối lượng m</b>, <b>độ tăng nhiệt độ Δt</b> và <b>chất làm nên vật</b>. Ảnh hưởng của chất được thể hiện qua <b>nhiệt dung riêng c</b>.</p>
 <p><b>Nhiệt dung riêng c</b> là nhiệt lượng cần để <b>1 kg</b> chất tăng thêm <b>1 K</b> (tức 1 °C). Đơn vị J/(kg·K). Chất có c lớn thì <b>khó nóng lên và cũng khó nguội đi</b>.</p>
 <ul><li>Nước có c rất lớn (4200 J/(kg·K)), nên được dùng làm chất làm mát động cơ, túi chườm nóng. Vùng ven biển có khí hậu ôn hoà hơn vùng sâu trong đất liền.</li>
 <li>Kim loại có c nhỏ (đồng 380, sắt 460, nhôm 880), nên nóng lên và nguội đi rất nhanh.</li></ul>
 <p><b>Đo c trong phòng thí nghiệm:</b> dùng dây điện trở công suất P đun vật trong thời gian τ. Điện năng chuyển hết thành nhiệt (bỏ qua hao phí): Q = P·τ. Đo Δt bằng nhiệt kế rồi tính c.</p>
 <p><b>Cân bằng nhiệt:</b> khi các vật trao đổi nhiệt với nhau, tổng nhiệt lượng toả ra bằng tổng nhiệt lượng thu vào.</p>`,
 observe:['Bốn vật cùng khối lượng, cùng nhận nhiệt như nhau mỗi giây. Đồng nóng nhanh nhất, nước chậm nhất.','Tăng khối lượng hoặc giảm công suất: mọi đường đều thoải hơn.','Nước cần thời gian gấp khoảng 11 lần đồng để cùng tăng nhiệt độ, vì 4200/380 ≈ 11.'],
 formulas:[{f:'Q = m·c·Δt',parts:[['Q','nhiệt lượng thu vào (J)'],['m','khối lượng (kg)'],['c','nhiệt dung riêng (J/(kg·K))'],['Δt','độ tăng nhiệt độ (K hoặc °C)']],why:'Gấp đôi khối lượng thì gấp đôi số phân tử cần làm nóng. Muốn nóng thêm gấp đôi thì cần gấp đôi năng lượng. Còn c cho biết mỗi chất <b>"khó nóng"</b> đến mức nào.'},
  {f:'c = P·τ / (m·Δt)',parts:[['P','công suất dây nung (W)'],['τ','thời gian đun (s)']],why:'Đây là cách đo c: điện năng P·τ biến hết thành nhiệt lượng Q = m·c·Δt.'},
  {f:'Q toả = Q thu',parts:[['Q toả','tổng nhiệt các vật nóng toả ra'],['Q thu','tổng nhiệt các vật lạnh thu vào']],why:'Bảo toàn năng lượng: vật nóng mất bao nhiêu thì vật lạnh nhận bấy nhiêu, nếu bỏ qua hao phí ra môi trường.'}],
 memo:'Q = m·c·Δt đọc là "mờ-xê-đen-ta-tê". Câu nhớ: "Quả Mít Chín Đỏ Tươi".',
 wrong:[['Ấm có công suất lớn hơn cần ít nhiệt lượng hơn để đun sôi.','Nhiệt lượng cần chỉ phụ thuộc m, c, Δt. Công suất lớn chỉ làm nước sôi nhanh hơn.'],['Cầm thanh sắt thấy lạnh hơn thanh gỗ cùng nhiệt độ, vì sắt lạnh hơn.','Hai thanh cùng nhiệt độ. Sắt dẫn nhiệt tốt nên lấy nhiệt từ tay nhanh hơn, ta cảm thấy lạnh hơn.'],['Nhiệt dung riêng lớn nghĩa là chất nóng lên nhanh.','Ngược lại: c lớn thì nóng lên chậm.']],
 quiz:[
 {t:'mc',q:'Nhiệt dung riêng của nước là 4200 J/(kg·K). Con số này có nghĩa là:',c:0,o:[['Muốn 1 kg nước tăng thêm 1 K cần cung cấp 4200 J','Đúng. Đó chính là định nghĩa nhiệt dung riêng.'],['1 kg nước ở 1 °C có nội năng 4200 J','Sai. Nhiệt dung riêng nói về nhiệt lượng cần để tăng nhiệt độ, không phải nội năng đang có.'],['Muốn 4200 kg nước tăng thêm 1 K cần 1 J','Sai. Định nghĩa đã bị đảo ngược.'],['1 kg nước toả ra 4200 J khi sôi','Sai. Lúc sôi liên quan đến nhiệt hoá hơi riêng L, không phải nhiệt dung riêng.']]},
 {t:'mc',q:'Bốn khối nước, nhôm, sắt, đồng có cùng khối lượng và cùng nhận một nhiệt lượng như nhau. Khối nào nóng lên nhiều nhất? (c: nước 4200, nhôm 880, sắt 460, đồng 380 J/(kg·K))',c:0,o:[['Khối đồng','Đúng. Δt = Q/(m·c). Cùng Q và m, chất có c nhỏ nhất (đồng) tăng nhiệt độ nhiều nhất.'],['Khối nước','Sai. Nước có c lớn nhất nên tăng nhiệt độ ít nhất.'],['Khối nhôm','Sai. c của nhôm lớn hơn của sắt và đồng.'],['Bốn khối nóng lên như nhau','Sai. Độ tăng nhiệt độ còn phụ thuộc vào chất (qua c), không chỉ vào Q.']]},
 {t:'mc',q:'Vì sao khí hậu vùng ven biển thường ôn hoà hơn vùng sâu trong đất liền?',c:0,o:[['Nước có nhiệt dung riêng lớn nên nóng lên và nguội đi chậm','Đúng. Ban ngày nước biển hấp thụ nhiều nhiệt mà ít nóng lên, ban đêm toả nhiệt chậm, làm nhiệt độ không khí ven biển ít thay đổi.'],['Nước dẫn nhiệt tốt hơn đất','Sai. Nước dẫn nhiệt kém. Yếu tố chính là nhiệt dung riêng lớn.'],['Nước biển có khối lượng riêng nhỏ','Sai. Khối lượng riêng không giải thích được việc nhiệt độ ít thay đổi.'],['Gió biển lúc nào cũng thổi lạnh','Sai. Gió biển, gió đất chỉ là hệ quả của việc đất và nước nóng lên khác nhau; nguyên nhân gốc vẫn là nhiệt dung riêng.']]},
 {t:'ds',q:'Dùng ấm điện 1000 W đun 2 kg nước từ 25 °C. Bỏ qua hao phí, c = 4200 J/(kg·K).',s:[['Nhiệt lượng cần để đun nước đến 100 °C là 630 000 J.',true,'Đúng. Q = m·c·Δt = 2 · 4200 · 75 = 630 000 J.'],['Thời gian đun đến sôi là 630 s.',true,'Đúng. τ = Q/P = 630 000/1000 = 630 s, tức 10,5 phút.'],['Nếu chỉ đun 1 kg nước thì thời gian giảm một nửa.',true,'Đúng. Q tỉ lệ với m: m giảm một nửa thì Q và thời gian đều giảm một nửa.'],['Nếu dùng ấm 2000 W thì nhiệt lượng cần cung cấp giảm một nửa.',false,'Sai. Nhiệt lượng cần vẫn là 630 000 J vì chỉ phụ thuộc m, c, Δt. Ấm mạnh hơn chỉ làm thời gian giảm còn 315 s.']]},
 {t:'sa',q:'Thả miếng đồng 0,5 kg ở 100 °C vào 0,5 kg nước ở 20 °C. Bỏ qua trao đổi nhiệt với bình và môi trường; c(đồng) = 380 J/(kg·K), c(nước) = 4200 J/(kg·K). Nhiệt độ khi cân bằng là bao nhiêu °C? (Làm tròn đến 1 chữ số thập phân)',a:26.6,tol:.06,u:'°C',sol:'Q toả = Q thu: 0,5·380·(100 − t) = 0,5·4200·(t − 20) ⇒ 380(100 − t) = 4200(t − 20) ⇒ 122 000 = 4580·t ⇒ t ≈ 26,6 °C. Nước có c lớn nên nhiệt độ cân bằng gần nhiệt độ ban đầu của nước.'}]},

{id:'c1-5',ch:1,no:'1.5',title:'Nhiệt nóng chảy riêng. Nhiệt hoá hơi riêng',sim:'curve',
 one:'Khi chuyển thể, nhiệt được dùng để phá liên kết nên nhiệt độ đứng yên. Nóng chảy cần Q = λm, hoá hơi cần Q = Lm.',
 essence:`<p>Khi một chất <b>đang nóng chảy</b> hoặc <b>đang sôi</b>, nhiệt cung cấp vào <b>không làm tăng nhiệt độ</b>. Nó được dùng để phá vỡ liên kết giữa các phân tử, làm thế năng phân tử tăng. Động năng trung bình không đổi nên nhiệt độ đứng yên, trên đồ thị là <b>đoạn nằm ngang</b>. Nội năng vẫn tăng.</p>
 <ul><li><b>Nhiệt nóng chảy riêng λ:</b> nhiệt lượng để 1 kg chất rắn nóng chảy hoàn toàn ở nhiệt độ nóng chảy. Khi đông đặc, chất toả ra đúng lượng nhiệt này. Nước đá: λ = 3,34·10⁵ J/kg.</li>
 <li><b>Nhiệt hoá hơi riêng L:</b> nhiệt lượng để 1 kg chất lỏng hoá hơi hoàn toàn ở nhiệt độ xác định. Khi ngưng tụ, chất toả ra đúng lượng nhiệt này. Nước ở 100 °C: L = 2,26·10⁶ J/kg.</li></ul>
 <p>L của nước <b>gấp gần 7 lần λ</b>. Nóng chảy chỉ cần "nới lỏng" mạng tinh thể, còn hoá hơi phải kéo các phân tử ra rất xa nhau, nên tốn năng lượng hơn nhiều.</p>`,
 observe:['Đoạn nằm ngang ở 100 °C dài nhất: hoá hơi tốn nhiều năng lượng nhất (thanh màu đỏ bên phải).','Trong đoạn nằm ngang ở 0 °C, nhiệt kế đứng yên nhưng đá vẫn tan dần.','Tăng công suất bếp: thời gian ngắn lại, nhưng tỉ lệ các đoạn không đổi.','Tăng khối lượng: mọi nhiệt lượng đều tăng theo cùng tỉ lệ.'],
 formulas:[{f:'Q = λ·m',parts:[['λ','nhiệt nóng chảy riêng (J/kg)'],['m','khối lượng phần nóng chảy (kg)']],why:'Mỗi kg chất cần một lượng năng lượng nhất định để phá mạng tinh thể. Đông đặc thì <b>toả</b> ra đúng lượng này.'},
  {f:'Q = L·m',parts:[['L','nhiệt hoá hơi riêng (J/kg)'],['m','khối lượng phần hoá hơi (kg)']],why:'Hoá hơi phải tách phân tử ra rất xa nhau, nên L lớn hơn λ nhiều. Ngưng tụ thì <b>toả</b> ra đúng lượng này.'},
  {f:'Q = m(c₁Δt₁ + λ + c₂Δt₂ + L)',parts:[['','bài nhiều giai đoạn: tính và cộng từng giai đoạn']],why:'Chia quá trình theo đồ thị: đoạn <b>dốc</b> dùng m·c·Δt, đoạn <b>nằm ngang</b> dùng λ·m hoặc L·m.'}],
 memo:'"λ là lam-đa, như cục đá tan." "L là Lên hơi."',
 wrong:[['Trong lúc nước đá tan, nội năng không đổi vì nhiệt độ không đổi.','Nội năng vẫn tăng (thế năng phân tử tăng). Chỉ có động năng trung bình, tức nhiệt độ, là không đổi.'],['Đun lửa to hơn thì nước sôi ở nhiệt độ cao hơn.','Nhiệt độ sôi chỉ phụ thuộc áp suất. Lửa to chỉ làm nước hoá hơi nhanh hơn.']],
 quiz:[
 {t:'mc',q:'Trong lúc nước đá đang tan ở 0 °C, nhiệt lượng được cung cấp dùng để:',c:0,o:[['Phá vỡ liên kết giữa các phân tử, nên nhiệt độ không đổi','Đúng. Năng lượng làm tăng thế năng phân tử (tách chúng khỏi mạng tinh thể). Động năng trung bình không đổi nên nhiệt độ đứng yên.'],['Làm tăng nhiệt độ của nước đá','Sai. Trong khi đang tan, hỗn hợp nước và đá vẫn ở 0 °C.'],['Làm tăng động năng trung bình của phân tử','Sai. Nếu động năng trung bình tăng thì nhiệt độ phải tăng, nhưng thực tế nhiệt độ không đổi.'],['Bị mất hết ra môi trường','Sai. Nhiệt vẫn được nước đá hấp thụ, thể hiện ở việc đá tan dần.']]},
 {t:'mc',q:'Cần cung cấp bao nhiêu nhiệt lượng để làm nóng chảy hoàn toàn 2 kg nước đá ở 0 °C? Biết λ = 3,34·10⁵ J/kg.',c:0,o:[['6,68·10⁵ J','Đúng. Q = λ·m = 3,34·10⁵ · 2 = 6,68·10⁵ J.'],['1,67·10⁵ J','Sai. Đây là λ chia cho m. Nhiệt lượng tỉ lệ thuận với khối lượng.'],['3,34·10⁵ J','Sai. Đây là nhiệt lượng cho 1 kg, nhưng đề cho 2 kg.'],['8,4·10³ J','Sai. Đây là dùng nhầm nhiệt dung riêng (2 · 4200). Khi chuyển thể phải dùng λ.']]},
 {t:'mc',q:'Vì sao bị bỏng bởi hơi nước ở 100 °C thường nặng hơn bị bỏng bởi nước sôi 100 °C?',c:0,o:[['Hơi nước ngưng tụ trên da và toả thêm nhiệt hoá hơi rất lớn','Đúng. Mỗi kg hơi nước khi ngưng tụ toả ra 2,26·10⁶ J; sau đó phần nước 100 °C này còn tiếp tục toả nhiệt khi nguội đi.'],['Hơi nước có nhiệt độ cao hơn nước sôi','Sai. Đề bài cho cả hai cùng 100 °C.'],['Hơi nước có nhiệt dung riêng lớn hơn nước','Sai. Hơi nước có nhiệt dung riêng nhỏ hơn nước lỏng. Nguyên nhân là nhiệt ngưng tụ.'],['Hơi nước có khối lượng lớn hơn','Sai. Cùng khối lượng thì hơi nước vẫn gây bỏng nặng hơn.']]},
 {t:'ds',q:'Đun một cục nước đá ở −10 °C cho đến khi hoá hơi hết, công suất bếp không đổi. Vẽ đồ thị nhiệt độ theo thời gian.',s:[['Đồ thị có hai đoạn nằm ngang, ứng với nóng chảy và sôi.',true,'Đúng. Trong lúc chuyển thể, nhiệt độ không đổi.'],['Đoạn sôi dài hơn đoạn nóng chảy.',true,'Đúng. L = 2,26·10⁶ J/kg gấp gần 7 lần λ = 3,34·10⁵ J/kg, nên sôi tốn thời gian gấp gần 7 lần.'],['Trong các đoạn nằm ngang, nội năng của nước không đổi.',false,'Sai. Nội năng vẫn tăng vì thế năng phân tử tăng (liên kết bị phá vỡ). Chỉ có nhiệt độ là không đổi.'],['Nhiệt lượng làm 1 kg nước nóng từ 0 °C lên 100 °C lớn hơn nhiệt lượng làm 1 kg nước hoá hơi hết ở 100 °C.',false,'Sai. Làm nóng cần 4200 · 100 = 420 000 J, còn hoá hơi cần 2 260 000 J, gấp hơn 5 lần.']]},
 {t:'sa',q:'Tính nhiệt lượng (theo kJ) cần cung cấp để 0,2 kg nước đá ở 0 °C chuyển hoàn toàn thành hơi nước ở 100 °C. Biết λ = 3,34·10⁵ J/kg, c(nước) = 4200 J/(kg·K), L = 2,26·10⁶ J/kg.',a:602.8,tol:1,u:'kJ',sol:'Ba giai đoạn: nóng chảy Q₁ = λm = 66 800 J; nước nóng lên từ 0 đến 100 °C: Q₂ = mcΔt = 0,2·4200·100 = 84 000 J; hoá hơi Q₃ = Lm = 452 000 J. Tổng Q = 602 800 J = 602,8 kJ.'}]},

{id:'c2-1',ch:2,no:'2.1',title:'Mô hình động học phân tử chất khí',sim:'brown',
 one:'Chất khí gồm các phân tử rất nhỏ, chuyển động hỗn loạn và va chạm vào thành bình. Bằng chứng là chuyển động Brown.',
 essence:`<p>Mô hình động học phân tử chất khí gồm 3 nội dung:</p>
 <ul><li>Chất khí gồm rất nhiều phân tử có kích thước <b>rất nhỏ</b> so với khoảng cách giữa chúng.</li>
 <li>Các phân tử <b>chuyển động hỗn loạn không ngừng</b>. Nhiệt độ càng cao thì chúng chuyển động càng nhanh.</li>
 <li>Khi chuyển động, các phân tử <b>va chạm</b> với nhau và với thành bình. Va chạm với thành bình gây ra <b>áp suất</b>.</li></ul>
 <p><b>Khí lí tưởng</b> là mô hình đơn giản hoá: các phân tử được coi là chất điểm và chỉ tương tác với nhau khi va chạm. Ở áp suất không quá cao và nhiệt độ không quá thấp, khí thực rất gần khí lí tưởng.</p>
 <p><b>Bằng chứng: chuyển động Brown.</b> Năm 1827, Robert Brown thấy hạt phấn hoa trong nước chuyển động hỗn loạn không ngừng. Với chất khí, ta quan sát hạt khói trong không khí. Phân tử khí quá nhỏ nên không nhìn thấy được, nhưng chúng va vào hạt khói từ mọi phía. Số cú va ở các phía không đều nhau nên hạt khói bị xô lung tung theo đường zíc zắc.</p>
 <p><b>Lượng chất:</b> 1 mol chứa N<sub>A</sub> = 6,02·10²³ hạt.</p>`,
 observe:['Bỏ chọn "Hiện phân tử khí": chỉ còn thấy hạt khói chạy zíc zắc, giống như nhìn qua kính hiển vi.','Chọn lại: thấy nguyên nhân là các cú va của phân tử khí không đều từ các phía.','Tăng nhiệt độ: hạt khói run mạnh hơn và đi xa hơn trong cùng thời gian.','Bấm "Xoá vết" rồi quan sát: đường đi không bao giờ lặp lại.'],
 table:{head:['Từ khoá','Nội dung của mô hình'],rows:[['Nhỏ','Phân tử rất nhỏ so với khoảng cách giữa chúng'],['Chạy','Chuyển động hỗn loạn không ngừng; nóng hơn thì chạy nhanh hơn'],['Va','Va chạm với nhau và với thành bình, gây ra áp suất']]},
 formulas:[{f:'n = m/M = N/N_A',parts:[['n','số mol'],['m','khối lượng khí (g)'],['M','khối lượng mol (g/mol)'],['N','số phân tử'],['N_A','số Avogadro = 6,02·10²³ mol⁻¹']],why:'1 mol giống như một "tá" khổng lồ gồm 6,02·10²³ hạt. Biết số mol là biết có bao nhiêu phân tử.'}],
 memo:'"Thấy khói nhảy, biết phân tử chạy." Ba ý của mô hình: "Nhỏ – Chạy – Va".',
 wrong:[['Chuyển động Brown là chuyển động của phân tử khí.','Đó là chuyển động của hạt lớn hơn (khói, phấn hoa) do bị phân tử va vào. Phân tử thì không nhìn thấy được.'],['Hạt càng to thì chuyển động Brown càng mạnh.','Hạt càng nhỏ, nhẹ thì càng dễ bị xô và chuyển động Brown càng rõ.']],
 quiz:[
 {t:'mc',q:'Chuyển động Brown là:',c:0,o:[['Chuyển động hỗn loạn của các hạt nhỏ (khói, phấn hoa) do bị các phân tử va chạm không đều','Đúng. Ta thấy hạt khói chuyển động; nguyên nhân là các phân tử vô hình va vào nó từ mọi phía nhưng không cân bằng.'],['Chuyển động của các phân tử khí','Sai. Phân tử khí quá nhỏ, không thấy được qua kính hiển vi quang học. Thứ ta thấy là hạt khói.'],['Chuyển động do các dòng đối lưu trong chất khí','Sai. Chuyển động Brown xảy ra cả khi không khí đứng yên hoàn toàn, và nó hỗn loạn chứ không theo dòng.'],['Chuyển động thẳng đều theo một hướng xác định','Sai. Đường đi của hạt là đường gấp khúc, đổi hướng liên tục.']]},
 {t:'mc',q:'Khí lí tưởng là chất khí trong đó:',c:0,o:[['Các phân tử được coi là chất điểm và chỉ tương tác với nhau khi va chạm','Đúng. Đây là mô hình đơn giản hoá: bỏ qua kích thước phân tử và lực hút giữa chúng khi ở xa nhau.'],['Không có phân tử nào','Sai. Khí lí tưởng vẫn gồm rất nhiều phân tử.'],['Các phân tử đứng yên','Sai. Phân tử khí lí tưởng vẫn chuyển động hỗn loạn không ngừng.'],['Lực hút giữa các phân tử rất lớn','Sai. Ngược lại, lực tương tác được bỏ qua, trừ lúc va chạm.']]},
 {t:'mc',q:'Trong 2 g khí hiđrô H₂ (M = 2 g/mol) có bao nhiêu phân tử?',c:0,o:[['6,02·10²³ phân tử','Đúng. n = m/M = 2/2 = 1 mol, nên N = n·N_A = 6,02·10²³ phân tử.'],['1,204·10²⁴ phân tử','Sai. Đây là số nguyên tử H (mỗi phân tử H₂ có 2 nguyên tử). Đề hỏi số phân tử.'],['3,01·10²³ phân tử','Sai. Đây là kết quả khi lấy nhầm M = 4 g/mol.'],['2 phân tử','Sai. 2 là khối lượng theo gam, không phải số phân tử.']]},
 {t:'ds',q:'Quan sát hạt khói trong không khí qua kính hiển vi, rồi làm nóng không khí trong hộp.',s:[['Khi nóng lên, hạt khói chuyển động hỗn loạn mạnh hơn.',true,'Đúng. Phân tử khí chạy nhanh hơn nên va vào hạt khói mạnh hơn.'],['Khi nóng lên, các phân tử khí chuyển động nhanh hơn.',true,'Đúng. Đây là một nội dung của mô hình động học phân tử.'],['Hạt khói càng to thì chuyển động Brown càng rõ.',false,'Sai. Hạt to bị va từ mọi phía nhiều hơn nên các cú va bù trừ nhau tốt hơn, và hạt nặng khó bị xô. Hạt càng nhỏ, chuyển động Brown càng rõ.'],['Qua kính hiển vi quang học có thể nhìn thấy từng phân tử khí.',false,'Sai. Phân tử khí có kích thước cỡ 10⁻¹⁰ m, quá nhỏ để thấy bằng kính hiển vi quang học.']]},
 {t:'sa',q:'Có bao nhiêu mol khí trong 8,4 g khí nitơ N₂? Biết M(N₂) = 28 g/mol.',a:.3,tol:.002,u:'mol',sol:'n = m/M = 8,4/28 = 0,3 mol.'}]},

{id:'c2-2',ch:2,no:'2.2',title:'Định luật Boyle (quá trình đẳng nhiệt)',sim:'boyle',
 one:'Nhiệt độ không đổi: nén thể tích nhỏ đi bao nhiêu lần thì áp suất tăng lên bấy nhiêu lần.',
 essence:`<p>Xét một <b>lượng khí xác định</b> ở <b>nhiệt độ không đổi</b> (quá trình đẳng nhiệt). Định luật Boyle: áp suất tỉ lệ nghịch với thể tích, p·V = hằng số.</p>
 <p><b>Bản chất:</b> T không đổi nên tốc độ trung bình của phân tử không đổi, mỗi cú va mạnh như cũ. Khi giảm V, mật độ phân tử tăng, nên mỗi giây có <b>nhiều cú va</b> lên thành bình hơn. V giảm 2 lần thì mật độ tăng 2 lần, số cú va tăng 2 lần, áp suất tăng 2 lần.</p>
 <ul><li>Đồ thị p theo V là đường <b>hypebol</b>, gọi là đường đẳng nhiệt.</li>
 <li>Đồ thị p theo 1/V là <b>đường thẳng qua gốc toạ độ</b>.</li>
 <li>Đường đẳng nhiệt ứng với nhiệt độ cao hơn nằm <b>xa gốc toạ độ hơn</b>.</li></ul>`,
 observe:['Kéo V nhỏ lại: số cú va lên pít-tông mỗi giây tăng, áp suất tăng.','Tích p·V luôn bằng 4 atm·L dù V thay đổi thế nào.','Điểm trạng thái chạy trên đường hypebol màu đậm. Đường nhạt phía trên là đường đẳng nhiệt ở nhiệt độ cao hơn.','Màu phân tử không đổi: nhiệt độ được giữ nguyên.'],
 formulas:[{f:'p₁V₁ = p₂V₂',parts:[['p','áp suất (Pa, atm, mmHg...)'],['V','thể tích (m³, lít...)']],why:'T không đổi nên tốc độ phân tử không đổi; áp suất chỉ phụ thuộc mật độ phân tử, mà mật độ tỉ lệ nghịch với V. Chỉ cần đơn vị hai vế giống nhau, <b>không bắt buộc</b> đổi ra SI.'},
  {f:'p = p₀ + ρ·g·h',parts:[['p₀','áp suất khí quyển'],['ρgh','áp suất của cột chất lỏng cao h']],why:'Dùng trong bài bọt khí dưới nước: càng xuống sâu, áp suất càng lớn, bọt khí càng bị nén nhỏ.'}],
 memo:'Boyle: "Bóp lại thì Bức lên". V giảm bao nhiêu lần, p tăng bấy nhiêu lần (T giữ nguyên).',
 wrong:[['Nén khí đẳng nhiệt làm phân tử chạy nhanh hơn.','Tốc độ phân tử không đổi vì T không đổi. Áp suất tăng vì số cú va tăng.'],['Đồ thị p theo V của quá trình đẳng nhiệt là đường thẳng.','Đó là đường hypebol. Đường thẳng qua gốc là đồ thị p theo 1/V.']],
 quiz:[
 {t:'mc',q:'Một lượng khí được nén đẳng nhiệt để thể tích giảm 3 lần. Áp suất của khí:',c:0,o:[['Tăng 3 lần','Đúng. Đẳng nhiệt: p·V = hằng số. V giảm 3 lần thì p tăng 3 lần.'],['Giảm 3 lần','Sai. p và V tỉ lệ nghịch: thể tích nhỏ lại thì áp suất lớn lên.'],['Tăng 9 lần','Sai. p tỉ lệ nghịch bậc nhất với V, không phải bình phương.'],['Không đổi','Sai. Chỉ nhiệt độ không đổi; áp suất thay đổi theo thể tích.']]},
 {t:'mc',q:'Khi nén đẳng nhiệt một lượng khí, áp suất tăng là vì:',c:0,o:[['Mật độ phân tử tăng nên mỗi giây có nhiều phân tử va chạm lên thành bình hơn','Đúng. Tốc độ phân tử không đổi (T không đổi), nhưng phân tử dày đặc hơn nên số cú va tăng.'],['Các phân tử chuyển động nhanh hơn','Sai. T không đổi nên tốc độ trung bình của phân tử không đổi.'],['Các phân tử to ra','Sai. Kích thước phân tử không thay đổi khi nén.'],['Lực hút giữa các phân tử tăng','Sai. Với khí lí tưởng ta bỏ qua lực hút; áp suất do va chạm gây ra.']]},
 {t:'mc',q:'Trên đồ thị p–V có hai đường đẳng nhiệt (1) và (2) của cùng một lượng khí; đường (2) nằm xa gốc toạ độ hơn. So sánh nhiệt độ T₁ và T₂:',c:0,o:[['T₂ > T₁','Đúng. Kẻ một đường thẳng đứng (cùng V) cắt hai đường: áp suất trên đường (2) lớn hơn. Cùng thể tích mà áp suất lớn hơn thì nhiệt độ cao hơn.'],['T₂ < T₁','Sai. Ở cùng thể tích, đường (2) có áp suất cao hơn, tức phân tử chạy nhanh hơn.'],['T₂ = T₁','Sai. Hai đường đẳng nhiệt khác nhau ứng với hai nhiệt độ khác nhau.'],['Không so sánh được','Sai. So sánh được bằng cách xét cùng một thể tích trên hai đường.']]},
 {t:'ds',q:'Một lượng khí có thể tích 2 lít, áp suất 1 atm được nén đẳng nhiệt đến thể tích 0,5 lít.',s:[['Áp suất lúc sau là 4 atm.',true,'Đúng. p₂ = p₁V₁/V₂ = 1·2/0,5 = 4 atm.'],['Tích p·V không đổi và bằng 2 atm·lít.',true,'Đúng. 1·2 = 4·0,5 = 2 atm·lít.'],['Nhiệt độ của khí tăng 4 lần.',false,'Sai. Đây là quá trình đẳng nhiệt nên nhiệt độ không đổi.'],['Mật độ phân tử khí tăng 4 lần.',true,'Đúng. Số phân tử giữ nguyên, thể tích giảm 4 lần nên mật độ tăng 4 lần. Đó là lí do p tăng 4 lần.']]},
 {t:'sa',q:'Một bọt khí ở đáy hồ sâu 10 m có thể tích 2 cm³. Coi nhiệt độ không đổi; áp suất khí quyển p₀ = 10⁵ Pa, ρ(nước) = 1000 kg/m³, g = 10 m/s². Khi nổi lên sát mặt nước, thể tích bọt khí là bao nhiêu cm³?',a:4,tol:.01,u:'cm³',sol:'Ở đáy: p₁ = p₀ + ρgh = 10⁵ + 1000·10·10 = 2·10⁵ Pa. Ở mặt nước: p₂ = 10⁵ Pa. Theo Boyle: V₂ = p₁V₁/p₂ = 2·10⁵·2/10⁵ = 4 cm³. Bọt khí to dần khi nổi lên.'}]},

{id:'c2-3',ch:2,no:'2.3',title:'Định luật Charles (quá trình đẳng áp)',sim:'charles',
 one:'Áp suất không đổi: nhiệt độ tuyệt đối tăng bao nhiêu lần thì thể tích tăng bấy nhiêu lần.',
 essence:`<p>Xét một lượng khí xác định ở <b>áp suất không đổi</b> (quá trình đẳng áp). Định luật Charles: thể tích tỉ lệ thuận với <b>nhiệt độ tuyệt đối</b>, V/T = hằng số.</p>
 <p><b>Bản chất:</b> nhiệt độ tăng thì phân tử chạy nhanh hơn, va vào thành bình mạnh hơn. Muốn áp suất không đổi, khí phải nở ra để mật độ phân tử giảm, số cú va mỗi giây giảm bù lại.</p>
 <ul><li>Đồ thị V theo T (K) là <b>đường thẳng</b>, kéo dài thì đi qua gốc toạ độ (0 K).</li>
 <li>Đồ thị V theo t (°C) là đường thẳng, kéo dài cắt trục nhiệt độ tại <b>−273 °C</b>.</li>
 <li>Thực tế khí hoá lỏng trước khi xuống tới 0 K, nên đoạn gần gốc vẽ bằng nét đứt.</li></ul>`,
 observe:['Tăng T: phân tử nhanh hơn (cam hơn), pít-tông nâng lên. Quả nặng giữ cho áp suất không đổi.','Tỉ số V/T luôn không đổi.','Đường V–T là đường thẳng; kéo dài về bên trái sẽ đi qua gốc 0 K.','Nhìn thanh trượt: từ 300 K lên 600 K, thể tích gấp đôi; nhưng từ 27 °C lên 54 °C thì không.'],
 formulas:[{f:'V₁/T₁ = V₂/T₂',parts:[['V','thể tích (đơn vị bất kì, hai vế như nhau)'],['T','nhiệt độ tuyệt đối (K), bắt buộc']],why:'Nóng lên thì phân tử va mạnh hơn. Để áp suất không đổi, khí phải nở ra cho mật độ giảm đúng tỉ lệ với T.'},
  {f:'V = V₀(1 + t/273)',parts:[['V₀','thể tích ở 0 °C'],['t','nhiệt độ (°C)']],why:'Cách viết khác theo °C: cứ tăng 1 °C, thể tích tăng thêm 1/273 thể tích ở 0 °C.'}],
 memo:'Charles: "Càng nóng càng Căng". Nóng lên thì nở ra (p giữ nguyên), và nhớ dùng kelvin.',
 wrong:[['V tỉ lệ thuận với nhiệt độ °C.','V tỉ lệ với nhiệt độ tuyệt đối T (K). Từ 10 °C lên 20 °C, V chỉ tăng khoảng 3,5%, không gấp đôi.'],['Khí nở ra vì các phân tử to lên.','Phân tử không to lên. Chúng chạy nhanh hơn và ở xa nhau hơn.']],
 quiz:[
 {t:'mc',q:'Một lượng khí được nung nóng đẳng áp từ 300 K lên 600 K. Thể tích khí:',c:0,o:[['Tăng 2 lần','Đúng. Đẳng áp: V/T = hằng số. T tăng 2 lần thì V tăng 2 lần.'],['Tăng 4 lần','Sai. V tỉ lệ bậc nhất với T.'],['Giảm 2 lần','Sai. Nóng lên ở áp suất không đổi thì khí nở ra.'],['Không đổi','Sai. Áp suất không đổi chứ không phải thể tích.']]},
 {t:'mc',q:'Một lượng khí được nung nóng đẳng áp từ 10 °C lên 20 °C. Thể tích khí:',c:0,o:[['Tăng khoảng 3,5%','Đúng. Phải đổi ra kelvin: V₂/V₁ = 293/283 ≈ 1,035, tức tăng khoảng 3,5%.'],['Tăng gấp đôi','Sai. Lỗi kinh điển: dùng °C thay cho K. V tỉ lệ với nhiệt độ tuyệt đối.'],['Giảm khoảng 3,5%','Sai. Nóng lên thì khí nở ra chứ không co lại.'],['Không đổi','Sai. Nhiệt độ tăng nên thể tích tăng, dù chỉ tăng ít.']]},
 {t:'mc',q:'Trong quá trình đẳng áp, đồ thị biểu diễn thể tích V theo nhiệt độ t (°C) là:',c:0,o:[['Đường thẳng, kéo dài cắt trục nhiệt độ tại −273 °C','Đúng. V tỉ lệ với T = t + 273, nên khi vẽ theo t, đường thẳng bị dời sang trái 273 đơn vị.'],['Đường thẳng đi qua gốc toạ độ','Sai. Chỉ khi vẽ theo nhiệt độ tuyệt đối T (K) thì đường mới đi qua gốc.'],['Đường hypebol','Sai. Hypebol là đồ thị p–V của quá trình đẳng nhiệt.'],['Đường thẳng song song với trục nhiệt độ','Sai. Như vậy là V không đổi khi nhiệt độ thay đổi, trái với định luật Charles.']]},
 {t:'ds',q:'Một quả bóng bay được đưa từ phòng có nhiệt độ 27 °C ra ngoài nắng 47 °C. Coi áp suất khí trong bóng không đổi.',s:[['Thể tích bóng tăng 47/27 lần.',false,'Sai. Không được dùng °C. Phải dùng nhiệt độ tuyệt đối: 320/300.'],['Tỉ số thể tích sau và trước là 320/300.',true,'Đúng. V₂/V₁ = T₂/T₁ = (47 + 273)/(27 + 273) = 320/300 ≈ 1,067.'],['Các phân tử khí trong bóng chuyển động nhanh hơn.',true,'Đúng. Nhiệt độ tăng thì tốc độ trung bình của phân tử tăng.'],['Mật độ phân tử khí trong bóng tăng.',false,'Sai. Số phân tử không đổi mà thể tích tăng, nên mật độ giảm. Mật độ giảm bù lại việc phân tử va mạnh hơn, giữ áp suất không đổi.']]},
 {t:'sa',q:'3 lít khí ở 27 °C được nung nóng đẳng áp đến 127 °C. Thể tích lúc sau là bao nhiêu lít?',a:4,tol:.01,u:'lít',sol:'T₁ = 300 K, T₂ = 400 K. V₂ = V₁·T₂/T₁ = 3·400/300 = 4 lít.'}]},

{id:'c2-4',ch:2,no:'2.4',title:'Phương trình trạng thái khí lí tưởng',sim:'state',
 one:'Gộp ba định luật lại thành pV/T = hằng số, và phương trình Clapeyron pV = nRT.',
 essence:`<p>Với một lượng khí xác định, khi cả p, V, T cùng thay đổi: <b>pV/T = hằng số</b>. Đây là cách gộp định luật Boyle (T không đổi), Charles (p không đổi) và quá trình đẳng tích (V không đổi).</p>
 <p><b>Quá trình đẳng tích</b> (V không đổi): p/T = hằng số. Bản chất: bình kín nóng lên thì phân tử chạy nhanh hơn, vừa va <b>mạnh hơn</b> vừa va <b>nhiều hơn</b>, nên áp suất tăng tỉ lệ với T.</p>
 <p><b>Phương trình Clapeyron:</b> pV = nRT với R = 8,31 J/(mol·K). Phương trình này cho phép tính số mol, khối lượng khí. Ở điều kiện tiêu chuẩn (0 °C, 1 atm), 1 mol khí bất kì chiếm 22,4 lít.</p>`,
 observe:['Chọn từng quá trình rồi kéo thanh trượt: một đại lượng giữ nguyên, hai đại lượng còn lại thay đổi.','Dù đi đường nào, giá trị pV/T vẫn giữ nguyên.','Thử đi một vòng: đẳng áp tăng T, rồi đẳng tích giảm T, rồi đẳng nhiệt đưa V về 2 L. Điểm trạng thái quay về gần chỗ cũ.','Đẳng tích trên đồ thị p–V là đoạn thẳng đứng; đẳng áp là đoạn nằm ngang; đẳng nhiệt là đường cong.'],
 formulas:[{f:'p₁V₁/T₁ = p₂V₂/T₂',parts:[['T','bắt buộc dùng kelvin'],['p, V','đơn vị bất kì, hai vế như nhau']],why:'Dùng khi lượng khí không đổi và cả ba đại lượng đều thay đổi.'},
  {f:'pV = nRT',parts:[['R','8,31 J/(mol·K)'],['p','Pa'],['V','m³'],['n','số mol']],why:'Dùng khi cần số mol hoặc khối lượng khí. <b>Bắt buộc dùng đơn vị SI</b>: 1 lít = 10⁻³ m³, 1 atm ≈ 1,013·10⁵ Pa.'},
  {f:'p₁/T₁ = p₂/T₂',parts:[['','thể tích không đổi (đẳng tích)']],why:'Bình kín nóng lên: phân tử va mạnh hơn và nhiều hơn, nên áp suất tăng tỉ lệ với T.'}],
 table:{head:['Quá trình','Giữ nguyên','Công thức','Đồ thị p–V'],rows:[['Đẳng nhiệt (Boyle)','T','pV = hằng số','Hypebol'],['Đẳng áp (Charles)','p','V/T = hằng số','Đoạn nằm ngang'],['Đẳng tích','V','p/T = hằng số','Đoạn thẳng đứng']]},
 memo:'pV = nRT: "Pha Viên Nước Rất Trong". Tên gọi: nhiệt = T, áp = p, tích = thể tích V.',
 wrong:[['Dùng V theo lít với R = 8,31 vẫn ra đúng.','R = 8,31 đi với đơn vị SI: p (Pa), V (m³). Lít phải đổi ra m³.'],['Đẳng tích nghĩa là nhiệt độ không đổi.','Đẳng tích là thể tích không đổi; "tích" là thể tích.']],
 quiz:[
 {t:'mc',q:'Phương trình trạng thái của một lượng khí lí tưởng xác định là:',c:0,o:[['pV/T = hằng số','Đúng. Đây là cách gộp ba định luật Boyle, Charles và đẳng tích.'],['pT/V = hằng số','Sai. p tỉ lệ thuận với T và tỉ lệ nghịch với V, nên T phải ở mẫu.'],['VT/p = hằng số','Sai. Sai vị trí của cả p và T.'],['pVT = hằng số','Sai. Nếu vậy thì nóng lên ở thể tích không đổi sẽ làm áp suất giảm, trái với thực tế.']]},
 {t:'mc',q:'Lốp xe được bơm ở 27 °C có áp suất 2 atm. Buổi trưa nhiệt độ lốp là 57 °C. Coi thể tích lốp không đổi. Áp suất khí trong lốp là:',c:0,o:[['2,2 atm','Đúng. Đẳng tích: p₂ = p₁·T₂/T₁ = 2·330/300 = 2,2 atm.'],['4,22 atm','Sai. Đây là kết quả khi dùng °C: 2·57/27. Phải dùng kelvin.'],['1,82 atm','Sai. Tỉ số bị đảo ngược. Nóng lên thì áp suất tăng.'],['2 atm','Sai. Thể tích không đổi chứ không phải áp suất.']]},
 {t:'mc',q:'Ở điều kiện tiêu chuẩn (0 °C, 1 atm), 1 mol khí lí tưởng bất kì chiếm thể tích:',c:0,o:[['22,4 lít','Đúng. V = nRT/p = 1·8,31·273/(1,013·10⁵) ≈ 0,0224 m³ = 22,4 lít.'],['24 lít','Sai. Khoảng 24 lít là ở nhiệt độ phòng (khoảng 20 °C), không phải 0 °C.'],['1 lít','Sai. Không có cơ sở.'],['2,24 lít','Sai. Sai một bậc mười.']]},
 {t:'ds',q:'Một lượng khí ở trạng thái đầu: p₁ = 1 atm, V₁ = 6 lít, T₁ = 300 K. Sau khi biến đổi: p₂ = 3 atm, V₂ = 3 lít.',s:[['Nhiệt độ lúc sau T₂ = 450 K.',true,'Đúng. T₂ = T₁·p₂V₂/(p₁V₁) = 300·9/6 = 450 K.'],['Nhiệt độ của khí tăng thêm 150 °C.',true,'Đúng. Tăng 150 K, cũng chính là tăng 150 °C.'],['Đây là quá trình đẳng nhiệt.',false,'Sai. Nếu đẳng nhiệt thì tích pV phải không đổi, nhưng ở đây pV tăng từ 6 lên 9.'],['Tích p·V tăng 1,5 lần.',true,'Đúng. p₁V₁ = 6, p₂V₂ = 9, tăng 1,5 lần, đúng bằng tỉ số nhiệt độ 450/300.']]},
 {t:'sa',q:'Một bình chứa 8,31 lít khí ở 27 °C, áp suất 3·10⁵ Pa. Tính số mol khí trong bình (R = 8,31 J/(mol·K)).',a:1,tol:.01,u:'mol',sol:'Đổi V = 8,31·10⁻³ m³, T = 300 K. n = pV/(RT) = 3·10⁵ · 8,31·10⁻³ / (8,31 · 300) = 1 mol.'}]},

{id:'c2-5',ch:2,no:'2.5',title:'Áp suất khí theo mô hình động học. Động năng phân tử',sim:'kinetic',
 one:'Áp suất do phân tử va đập vào thành bình. Nhiệt độ tuyệt đối là thước đo động năng trung bình: W = (3/2)kT.',
 essence:`<p>Mỗi lần một phân tử va vào thành bình rồi bật ra, nó truyền cho thành một động lượng. Rất nhiều cú va như vậy cộng lại thành <b>áp lực đều</b> lên thành bình. Áp suất càng lớn khi:</p>
 <ul><li>có <b>nhiều</b> phân tử trong mỗi m³ (mật độ μ lớn), nên va nhiều lần hơn;</li>
 <li>phân tử <b>nặng</b> hơn và chạy <b>nhanh</b> hơn, nên mỗi cú va mạnh hơn và số cú va cũng nhiều hơn.</li></ul>
 <p>Vì vậy p tỉ lệ với μ·m·v̄². Phân tử chuyển động hỗn loạn theo 3 phương như nhau, nên có hệ số ⅓.</p>
 <p>So sánh với pV = nRT ta được <b>W̄đ = (3/2)kT</b>: <b>nhiệt độ tuyệt đối tỉ lệ với động năng trung bình</b> của phân tử. Ở cùng nhiệt độ, mọi chất khí có cùng động năng trung bình; khí nào phân tử nhẹ hơn thì chạy nhanh hơn.</p>`,
 observe:['Tăng N: thanh "đo từ các cú va" tăng tỉ lệ, luôn bám sát thanh tính theo mô hình.','Tăng T gấp đôi: áp suất gấp đôi, nhưng tốc độ phân tử N₂ chỉ tăng √2 ≈ 1,4 lần.','Biểu đồ: các phân tử có tốc độ rất khác nhau; tăng T thì cả biểu đồ dịch sang phía "nhanh".','Màu hạt cho biết tốc độ từng hạt: có hạt rất chậm, có hạt rất nhanh ở cùng một nhiệt độ.'],
 formulas:[{f:'p = ⅓·μ·m·v̄²',parts:[['μ','mật độ phân tử N/V (m⁻³)'],['m','khối lượng 1 phân tử (kg)'],['v̄²','trung bình của bình phương tốc độ']],why:'Mỗi cú va truyền động lượng 2mv cho thành bình; số cú va mỗi giây tỉ lệ với μ và v. Nhân lại được μ·m·v². Hệ số ⅓ vì chuyển động chia đều cho 3 phương.'},
  {f:'W̄đ = ½m·v̄² = (3/2)·k·T',parts:[['k','hằng số Boltzmann = R/N_A = 1,38·10⁻²³ J/K'],['T','nhiệt độ tuyệt đối (K)']],why:'Ghép p = ⅓μmv̄² với pV = nRT là ra ngay. Nhiệt độ chính là <b>thước đo động năng trung bình</b> của phân tử.'},
  {f:'v = √(3kT/m) = √(3RT/M)',parts:[['v','tốc độ căn quân phương'],['M','khối lượng mol (kg/mol)']],why:'Tốc độ tỉ lệ với √T và tỉ lệ nghịch với √M. H₂ nhẹ hơn O₂ 16 lần nên chạy nhanh hơn 4 lần ở cùng nhiệt độ.'}],
 memo:'"Ba phần hai Khoai Tây" = (3/2)kT. Động năng theo T, tốc độ theo √T.',
 wrong:[['Nhiệt độ tăng gấp đôi thì tốc độ phân tử tăng gấp đôi.','Động năng tăng gấp đôi, còn tốc độ chỉ tăng √2 lần.'],['Ở cùng nhiệt độ, phân tử nặng có động năng lớn hơn.','Mọi khí ở cùng nhiệt độ có cùng động năng trung bình; phân tử nặng thì chạy chậm hơn.']],
 quiz:[
 {t:'mc',q:'Động năng tịnh tiến trung bình của phân tử khí lí tưởng:',c:0,o:[['Tỉ lệ thuận với nhiệt độ tuyệt đối T','Đúng. W̄đ = (3/2)kT. Nhiệt độ tuyệt đối chính là thước đo động năng trung bình.'],['Tỉ lệ thuận với √T','Sai. √T là quy luật của tốc độ căn quân phương, không phải của động năng.'],['Không phụ thuộc nhiệt độ','Sai. Nhiệt độ càng cao, phân tử chuyển động càng mạnh.'],['Ở cùng nhiệt độ, phụ thuộc vào loại khí','Sai. Mọi khí ở cùng nhiệt độ có cùng động năng trung bình, bất kể phân tử nặng hay nhẹ.']]},
 {t:'mc',q:'Khi nhiệt độ tuyệt đối của khí tăng 4 lần, tốc độ căn quân phương của phân tử:',c:0,o:[['Tăng 2 lần','Đúng. v = √(3kT/m) tỉ lệ với √T, nên T tăng 4 lần thì v tăng √4 = 2 lần.'],['Tăng 4 lần','Sai. Động năng mới tăng 4 lần; tốc độ chỉ tăng theo căn bậc hai.'],['Tăng 16 lần','Sai. Đây là bình phương chứ không phải căn bậc hai.'],['Không đổi','Sai. Nóng lên thì phân tử chạy nhanh hơn.']]},
 {t:'mc',q:'Hai bình chứa khí H₂ và O₂ ở cùng nhiệt độ. Kết luận nào đúng?',c:0,o:[['Phân tử hai khí có cùng động năng trung bình, nhưng phân tử H₂ chạy nhanh hơn','Đúng. Cùng T thì cùng W̄đ = (3/2)kT. Vì ½mv² như nhau mà H₂ nhẹ hơn 16 lần, H₂ chạy nhanh hơn √16 = 4 lần.'],['Phân tử O₂ có động năng trung bình lớn hơn vì nặng hơn','Sai. Động năng trung bình chỉ phụ thuộc nhiệt độ.'],['Phân tử hai khí có cùng tốc độ trung bình','Sai. Phân tử nhẹ hơn thì chạy nhanh hơn ở cùng nhiệt độ.'],['Phân tử H₂ có động năng trung bình lớn hơn vì chạy nhanh hơn','Sai. H₂ chạy nhanh hơn nhưng nhẹ hơn, nên động năng vẫn bằng của O₂.']]},
 {t:'ds',q:'Khí trong một bình kín, thể tích không đổi, được nung nóng từ 300 K lên 600 K.',s:[['Động năng trung bình của phân tử tăng 2 lần.',true,'Đúng. W̄đ tỉ lệ với T.'],['Tốc độ căn quân phương của phân tử tăng 2 lần.',false,'Sai. Tốc độ tỉ lệ với √T, nên chỉ tăng √2 ≈ 1,41 lần.'],['Áp suất khí tăng 2 lần.',true,'Đúng. Đẳng tích: p tỉ lệ với T. Theo mô hình, p = (2/3)·μ·W̄đ, mà μ không đổi còn W̄đ tăng 2 lần.'],['Mật độ phân tử trong bình tăng 2 lần.',false,'Sai. Số phân tử và thể tích đều không đổi nên mật độ không đổi.']]},
 {t:'sa',q:'Tính động năng tịnh tiến trung bình của một phân tử khí ở 27 °C. Biết k = 1,38·10⁻²³ J/K. Viết kết quả theo đơn vị 10⁻²¹ J (làm tròn đến 2 chữ số thập phân).',a:6.21,tol:.006,u:'·10⁻²¹ J',sol:'T = 300 K. W̄đ = (3/2)kT = 1,5 · 1,38·10⁻²³ · 300 = 6,21·10⁻²¹ J. Đáp số: 6,21.'}]},
{id:'c3-1',ch:3,no:'3.1',title:'Từ trường',sim:'field',
 one:'Quanh nam châm và quanh dòng điện có từ trường. Đường sức từ cho biết hướng của từ trường: ra ở cực Bắc, vào ở cực Nam, luôn khép kín.',
 essence:`<p><b>Từ trường</b> là dạng vật chất tồn tại xung quanh <b>nam châm</b> và xung quanh <b>dòng điện</b> (tức là quanh các điện tích chuyển động). Ta nhận ra nó vì nó tác dụng <b>lực từ</b> lên nam châm hoặc dòng điện khác đặt trong đó.</p>
 <p><b>Hướng của từ trường</b> tại một điểm là hướng từ cực Nam sang cực Bắc của kim nam châm nhỏ nằm cân bằng tại điểm đó.</p>
 <p><b>Đường sức từ</b> là những đường vẽ sao cho tiếp tuyến tại mỗi điểm trùng với hướng của từ trường tại điểm đó.</p>
 <ul><li>Bên ngoài nam châm, đường sức đi <b>ra ở cực Bắc (N)</b> và <b>vào ở cực Nam (S)</b>; trong lòng nam châm thì đi từ S sang N. Vì vậy đường sức từ luôn <b>khép kín</b>.</li>
 <li>Các đường sức <b>không cắt nhau</b>. Chỗ nào từ trường mạnh thì đường sức <b>dày</b> hơn.</li>
 <li><b>Dòng điện thẳng dài:</b> đường sức là các vòng tròn đồng tâm nằm trong mặt phẳng vuông góc với dây. Chiều tìm bằng <b>quy tắc nắm tay phải</b>: ngón cái chỉ chiều dòng điện, bốn ngón khum lại chỉ chiều đường sức.</li>
 <li><b>Ống dây có dòng điện:</b> giống một nam châm thẳng. Trong lòng ống, đường sức gần như song song, đó là <b>từ trường đều</b>. Khum bốn ngón tay phải theo chiều dòng điện trong các vòng dây thì ngón cái chỉ chiều đường sức trong lòng ống, tức là hướng về đầu cực Bắc.</li></ul>
 <p>Rắc mạt sắt lên tấm bìa đặt trên nam châm, các mạt sắt xếp thành hình ảnh đường sức, gọi là <b>từ phổ</b>. Trái Đất cũng có từ trường, nên kim la bàn luôn chỉ hướng Bắc – Nam.</p>`,
 observe:['Di chuột quanh nam châm: kim nam châm thử luôn nằm dọc theo đường sức, đầu đỏ (cực Bắc) chỉ theo chiều mũi tên.','Bấm "Đổi cực nam châm": mọi kim đều quay ngược lại.','Chọn "Dòng điện thẳng": đường sức là những vòng tròn quanh dây. Đổi chiều dòng điện thì vòng tròn đổi chiều.','Chọn "Ống dây": so sánh với nam châm thẳng. Hai hình gần như giống hệt nhau.'],
 formulas:[{f:'Quy tắc nắm tay phải',parts:[['Dây thẳng','ngón cái theo chiều I, bốn ngón khum chỉ chiều đường sức'],['Ống dây','bốn ngón khum theo chiều I trong vòng dây, ngón cái chỉ chiều đường sức trong lòng ống (đầu N)']],why:'Cùng một bàn tay phải cho cả hai trường hợp, chỉ đổi vai trò của ngón cái và bốn ngón.'},
  {f:'Đường sức: ra N, vào S',parts:[['Bên ngoài','từ N sang S'],['Bên trong','từ S sang N'],['Mật độ','dày ở nơi từ trường mạnh']],why:'Tại mỗi điểm từ trường chỉ có một hướng, nên các đường sức không thể cắt nhau.'}],
 memo:'"Bắc ra, Nam vào". "Tay phải nắm dây, ngón cái theo dòng."',
 wrong:[['Đường sức từ bắt đầu ở cực Bắc và kết thúc ở cực Nam.','Đường sức từ khép kín: bên ngoài đi từ N sang S, bên trong nam châm đi từ S về N.'],['Chỉ nam châm mới tạo ra từ trường.','Dòng điện (điện tích chuyển động) cũng tạo ra từ trường. Ống dây có dòng điện giống hệt một nam châm thẳng.']],
 quiz:[
 {t:'mc',q:'Hướng của từ trường tại một điểm được quy ước là:',c:0,o:[['Hướng từ cực Nam sang cực Bắc của kim nam châm nhỏ nằm cân bằng tại điểm đó','Đúng. Kim nam châm thử tự xoay theo từ trường; cực Bắc của nó chỉ hướng của từ trường.'],['Hướng của lực từ tác dụng lên đoạn dây dẫn đặt tại điểm đó','Sai. Lực từ lên dây dẫn luôn vuông góc với từ trường, không cùng hướng.'],['Hướng từ cực Bắc sang cực Nam của kim nam châm nằm cân bằng','Sai. Ngược quy ước: phải là từ cực Nam sang cực Bắc của kim.'],['Hướng về phía cực Bắc địa lí của Trái Đất','Sai. Đó chỉ là hướng từ trường Trái Đất, không phải định nghĩa chung.']]},
 {t:'mc',q:'Đường sức từ của dòng điện chạy trong dây dẫn thẳng dài là:',c:0,o:[['Những đường tròn đồng tâm nằm trong mặt phẳng vuông góc với dây, tâm nằm trên dây','Đúng. Đây là hình mà mô phỏng "Dòng điện thẳng" cho thấy.'],['Những đường thẳng song song với dây dẫn','Sai. Đường sức bao quanh dây, không chạy dọc theo dây.'],['Những đường thẳng vuông góc với dây, đi ra xa dây','Sai. Đó giống hình đường sức điện của một điện tích, không phải từ trường của dòng điện.'],['Những đường xoắn ốc quanh dây','Sai. Đường sức là các vòng tròn khép kín nằm trong mặt phẳng vuông góc với dây.']]},
 {t:'mc',q:'Áp dụng quy tắc nắm tay phải cho ống dây: khum bốn ngón tay theo chiều dòng điện trong các vòng dây thì ngón cái choãi ra chỉ:',c:0,o:[['Chiều đường sức từ trong lòng ống, tức hướng về đầu cực Bắc của ống','Đúng. Trong lòng ống đường sức đi từ S sang N, nên ngón cái chỉ về đầu cực Bắc.'],['Chiều dòng điện trong ống dây','Sai. Chiều dòng điện đã được biểu diễn bằng bốn ngón tay.'],['Đầu cực Nam của ống dây','Sai. Ngón cái chỉ về đầu cực Bắc.'],['Chiều lực từ tác dụng lên ống dây','Sai. Quy tắc nắm tay phải dùng để tìm chiều đường sức, không phải chiều lực.']]},
 {t:'ds',q:'Xét các phát biểu về đường sức từ:',s:[['Bên ngoài nam châm, đường sức từ đi ra từ cực Bắc và đi vào cực Nam.',true,'Đúng. Đây là quy ước chiều đường sức.'],['Các đường sức từ có thể cắt nhau.',false,'Sai. Tại mỗi điểm từ trường chỉ có một hướng, nên qua mỗi điểm chỉ vẽ được một đường sức.'],['Nơi nào từ trường mạnh thì đường sức từ được vẽ dày hơn.',true,'Đúng. Ví dụ gần hai cực nam châm, đường sức dày hơn.'],['Đường sức từ của nam châm là đường hở, bắt đầu ở cực N và kết thúc ở cực S.',false,'Sai. Đường sức từ luôn khép kín; trong lòng nam châm nó đi từ S về N.']]},
 {t:'sa',q:'Đặt hai kim nam châm nhỏ ở hai điểm đối xứng nhau qua một dây dẫn thẳng dài có dòng điện (cùng khoảng cách tới dây, nằm trong mặt phẳng vuông góc với dây). Góc giữa hướng của hai kim là bao nhiêu độ?',a:180,tol:.5,u:'độ',sol:'Đường sức là vòng tròn quanh dây; hai điểm đối xứng nằm ở hai đầu một đường kính, tiếp tuyến tại đó song song nhưng ngược chiều. Vì vậy hai kim chỉ ngược nhau, góc 180°.'}]},

{id:'c3-2',ch:3,no:'3.2',title:'Lực từ tác dụng lên dây dẫn. Cảm ứng từ',sim:'force',
 one:'Dây dẫn có dòng điện đặt trong từ trường chịu lực từ F = B·I·l·sinα, chiều theo quy tắc bàn tay trái. B (tesla) cho biết từ trường mạnh hay yếu.',
 essence:`<p>Đặt một đoạn dây dẫn có dòng điện vào từ trường, dây chịu một <b>lực từ</b>. Lực này có:</p>
 <ul><li><b>Phương:</b> vuông góc với cả đoạn dây và đường sức từ.</li>
 <li><b>Chiều:</b> theo <b>quy tắc bàn tay trái</b>: đặt bàn tay trái sao cho đường sức đâm vào lòng bàn tay, chiều từ cổ tay đến ngón giữa là chiều dòng điện, thì ngón cái choãi ra 90° chỉ chiều lực từ.</li>
 <li><b>Độ lớn:</b> F = B·I·l·sinα, với α là góc giữa dây và đường sức. Dây song song với đường sức thì F = 0; dây vuông góc thì F lớn nhất.</li></ul>
 <p><b>Cảm ứng từ B</b> là đại lượng đặc trưng cho từ trường về độ mạnh yếu: B = F/(I·l) khi dây vuông góc với đường sức. Đơn vị là <b>tesla (T)</b>: 1 T = 1 N/(A·m). B là một vectơ, cùng hướng với từ trường.</p>
 <p><b>Từ trường đều</b> có B như nhau tại mọi điểm, đường sức là những đường thẳng song song cách đều, ví dụ trong lòng ống dây dài hoặc giữa hai cực của nam châm chữ U. Có thể đo B bằng cân dòng điện.</p>`,
 observe:['Chế độ "B vuông góc trang giấy": tăng I hoặc B, dây bị đẩy lệch nhiều hơn.','Đổi dấu dòng điện I hoặc bấm "Đổi chiều B": lực từ đổi chiều.','Chế độ "B nằm trong trang giấy": kéo góc α về 0° hoặc 180°, lực từ bằng 0. Ở 90° lực lớn nhất.','Ở chế độ thứ hai, lực từ hướng vào hoặc ra khỏi trang giấy, vuông góc với cả dây và B.'],
 formulas:[{f:'F = B·I·l·sinα',parts:[['F','lực từ (N)'],['B','cảm ứng từ (T)'],['I','cường độ dòng điện (A)'],['l','chiều dài đoạn dây trong từ trường (m)'],['α','góc giữa dây và đường sức']],why:'Lực tỉ lệ với số điện tích đang chuyển động (I), độ dài đoạn dây (l), độ mạnh từ trường (B). Chỉ phần dòng điện vuông góc với B mới chịu lực, nên có sinα.'},
  {f:'1 T = 1 N/(A·m)',parts:[['','đoạn dây 1 m, dòng 1 A, vuông góc với B, chịu lực 1 N thì B = 1 T']],why:'Định nghĩa tesla trực tiếp từ công thức lực từ.'}],
 memo:'"Fải Biết It Là sin": F = BIl·sinα. Tính lực dùng tay TRÁI; tìm đường sức dùng tay PHẢI.',
 wrong:[['Lực từ cùng phương với đường sức từ.','Lực từ luôn vuông góc với cả dây dẫn và đường sức từ.'],['Đổi chiều dòng điện thì độ lớn lực từ thay đổi.','Độ lớn giữ nguyên, chỉ có chiều của lực đổi ngược.']],
 quiz:[
 {t:'mc',q:'Một đoạn dây dẫn dài 0,2 m mang dòng điện 5 A đặt vuông góc với đường sức của từ trường đều B = 0,5 T. Lực từ tác dụng lên đoạn dây có độ lớn:',c:0,o:[['0,5 N','Đúng. F = B·I·l·sin90° = 0,5·5·0,2·1 = 0,5 N.'],['2 N','Sai. Có lẽ đã nhân 5·0,2 rồi chia cho 0,5. Phải nhân cả ba đại lượng.'],['5 N','Sai. Quên nhân với chiều dài 0,2 m.'],['0 N','Sai. Lực bằng 0 khi dây song song với đường sức, còn ở đây dây vuông góc.']]},
 {t:'mc',q:'Lực từ tác dụng lên đoạn dây dẫn có dòng điện bằng 0 khi:',c:0,o:[['Dây dẫn đặt song song với đường sức từ','Đúng. Khi đó α = 0 nên sinα = 0 và F = 0.'],['Dây dẫn đặt vuông góc với đường sức từ','Sai. Đó là lúc lực từ lớn nhất.'],['Cường độ dòng điện rất lớn','Sai. I lớn thì lực càng lớn.'],['Từ trường là từ trường đều','Sai. Từ trường đều vẫn tác dụng lực lên dây không song song với đường sức.']]},
 {t:'mc',q:'Đơn vị tesla (T) của cảm ứng từ bằng:',c:0,o:[['1 N/(A·m)','Đúng. Từ B = F/(I·l) suy ra 1 T = 1 N/(1 A · 1 m).'],['1 N·A·m','Sai. I và l nằm ở mẫu số chứ không nhân với N.'],['1 A/(N·m)','Sai. Đảo ngược vị trí N và A.'],['1 Wb·m²','Sai. 1 T = 1 Wb/m², không phải Wb nhân m².']]},
 {t:'ds',q:'Một đoạn dây dài 10 cm mang dòng điện 2 A đặt trong từ trường đều B = 0,4 T, dây hợp với đường sức một góc 30°.',s:[['Lực từ tác dụng lên đoạn dây có độ lớn 0,04 N.',true,'Đúng. F = 0,4·2·0,1·sin30° = 0,08·0,5 = 0,04 N.'],['Nếu xoay dây cho vuông góc với đường sức thì lực từ tăng gấp đôi.',true,'Đúng. sin90° = 1 gấp đôi sin30° = 0,5.'],['Lực từ có phương song song với đường sức từ.',false,'Sai. Lực từ luôn vuông góc với cả dây và đường sức.'],['Đổi chiều dòng điện thì độ lớn lực từ thay đổi, còn chiều giữ nguyên.',false,'Sai. Ngược lại: độ lớn giữ nguyên, chiều lực đổi ngược.']]},
 {t:'sa',q:'Một đoạn dây dẫn dài 25 cm, khối lượng 10 g được treo nằm ngang bằng hai dây mảnh trong từ trường đều có đường sức nằm ngang, vuông góc với dây, B = 0,08 T. Cho dòng điện qua dây thì lực từ hướng lên và hai dây treo vừa hết căng. Cường độ dòng điện là bao nhiêu ampe? (g = 10 m/s²)',a:5,tol:.01,u:'A',sol:'Dây treo hết căng khi lực từ cân bằng trọng lực: B·I·l = m·g ⇒ I = mg/(Bl) = 0,01·10/(0,08·0,25) = 0,1/0,02 = 5 A.'}]},

{id:'c3-3',ch:3,no:'3.3',title:'Từ thông. Hiện tượng cảm ứng điện từ',sim:'induction',
 one:'Khi từ thông qua mạch kín thay đổi thì trong mạch xuất hiện dòng điện cảm ứng. Dòng này luôn chống lại sự thay đổi đã sinh ra nó.',
 essence:`<p><b>Từ thông</b> Φ qua một diện tích S đặt trong từ trường đều B là Φ = B·S·cosα, với α là góc giữa vectơ B và <b>pháp tuyến</b> của mặt S. Đơn vị là vêbe (Wb). Có thể hiểu đơn giản Φ là "số đường sức xuyên qua mạch".</p>
 <p><b>Hiện tượng cảm ứng điện từ:</b> khi từ thông qua một mạch kín <b>biến thiên</b> thì trong mạch xuất hiện <b>dòng điện cảm ứng</b>. Có ba cách làm Φ thay đổi: thay đổi B (đưa nam châm lại gần hoặc ra xa), thay đổi diện tích S, hoặc thay đổi góc α (quay khung dây).</p>
 <p><b>Định luật Lenz:</b> dòng điện cảm ứng có chiều sao cho từ trường do nó sinh ra <b>chống lại sự biến thiên</b> của từ thông đã sinh ra nó. Đưa nam châm lại gần thì ống dây đẩy nam châm ra; kéo nam châm ra xa thì ống dây hút nó lại.</p>
 <p><b>Định luật Faraday:</b> suất điện động cảm ứng có độ lớn bằng tốc độ biến thiên của từ thông: |e| = N·|ΔΦ|/Δt. Từ thông thay đổi càng nhanh, dòng điện càng mạnh.</p>
 <p>Khi khối kim loại chuyển động trong từ trường hoặc nằm trong từ trường biến thiên, trong khối xuất hiện <b>dòng điện Foucault</b> (dòng xoáy), được dùng trong bếp từ và phanh điện từ.</p>`,
 observe:['Quan sát đồ thị: e khác 0 chỉ khi Φ đang thay đổi. Lúc nam châm dừng ở hai đầu hành trình, e = 0.','Khi nam châm tiến vào: đầu ống dây hoá cực N để đẩy ra. Khi kéo ra: hoá cực S để hút lại.','Tăng tốc độ: Φ vẫn thay đổi giữa các giá trị như cũ, nhưng nhanh hơn nên e lớn hơn.','Bỏ chọn "Tự động" rồi kéo thanh vị trí thật chậm và thật nhanh để so sánh kim điện kế.'],
 formulas:[{f:'Φ = B·S·cosα',parts:[['Φ','từ thông (Wb)'],['S','diện tích mạch (m²)'],['α','góc giữa B và pháp tuyến n của mặt']],why:'Chỉ thành phần của B vuông góc với mặt phẳng khung mới "xuyên qua" khung. Khung vuông góc với đường sức thì α = 0, từ thông lớn nhất.'},
  {f:'e = −N·ΔΦ/Δt',parts:[['e','suất điện động cảm ứng (V)'],['N','số vòng dây'],['ΔΦ/Δt','tốc độ biến thiên từ thông qua một vòng'],['dấu −','định luật Lenz: chống lại sự biến thiên']],why:'Mỗi vòng dây góp một phần suất điện động như nhau, nên nhân với N. Không phải từ thông lớn mà là từ thông thay đổi nhanh mới sinh ra điện.'}],
 memo:'"Không đổi thì không có điện." Lenz: "Anh thêm thì tôi bớt, anh bớt thì tôi thêm."',
 wrong:[['Nam châm càng mạnh đặt yên trong ống dây thì dòng điện cảm ứng càng lớn.','Nam châm đứng yên thì Φ không đổi, không có dòng điện cảm ứng.'],['α trong Φ = BS·cosα là góc giữa B và mặt phẳng khung.','α là góc giữa B và pháp tuyến của khung. Nếu đề cho góc giữa B và mặt phẳng khung thì phải dùng sin.']],
 quiz:[
 {t:'mc',q:'Từ thông qua một vòng dây diện tích S đặt trong từ trường đều B, pháp tuyến của vòng dây hợp với B một góc α, được tính bằng:',c:0,o:[['Φ = B·S·cosα','Đúng. α là góc giữa B và pháp tuyến.'],['Φ = B·S·sinα','Sai. Công thức này dùng khi α là góc giữa B và mặt phẳng vòng dây, không phải pháp tuyến.'],['Φ = B/S','Sai. Từ thông tỉ lệ thuận với diện tích.'],['Φ = B·S/cosα','Sai. Không có phép chia cho cosα.']]},
 {t:'mc',q:'Trường hợp nào dưới đây KHÔNG xuất hiện dòng điện cảm ứng trong khung dây kín?',c:0,o:[['Nam châm đặt đứng yên trong lòng khung dây','Đúng. Từ thông qua khung không đổi nên không có dòng điện cảm ứng.'],['Đưa nam châm lại gần khung dây','Sai. B qua khung tăng, từ thông tăng, có dòng điện cảm ứng.'],['Quay khung dây trong từ trường đều','Sai. Góc α thay đổi nên từ thông thay đổi.'],['Ngắt dòng điện trong một cuộn dây đặt cạnh khung','Sai. Từ trường của cuộn dây giảm về 0, từ thông qua khung giảm, có dòng điện cảm ứng.']]},
 {t:'mc',q:'Đưa cực Bắc của một nam châm lại gần một đầu của ống dây kín. Theo định luật Lenz, đầu ống dây gần nam châm trở thành:',c:0,o:[['Cực Bắc, đẩy nam châm ra xa','Đúng. Từ thông đang tăng, ống dây tạo ra cực cùng tên để đẩy nam châm, chống lại sự tăng.'],['Cực Nam, hút nam châm lại gần','Sai. Hút lại sẽ làm từ thông tăng nhanh hơn, trái với định luật Lenz.'],['Không trở thành cực nào','Sai. Có dòng điện cảm ứng thì ống dây trở thành một nam châm điện.'],['Cực Bắc, hút nam châm lại gần','Sai. Hai cực cùng tên thì đẩy nhau chứ không hút.']]},
 {t:'ds',q:'Một khung dây gồm 100 vòng, diện tích mỗi vòng 50 cm², đặt trong từ trường đều, mặt khung vuông góc với đường sức. Cảm ứng từ tăng đều từ 0 đến 0,2 T trong 0,1 s.',s:[['Từ thông qua mỗi vòng dây lúc cuối là 10⁻³ Wb.',true,'Đúng. Mặt khung vuông góc với đường sức nên α = 0: Φ = 0,2·50·10⁻⁴ = 10⁻³ Wb.'],['Độ lớn suất điện động cảm ứng là 1 V.',true,'Đúng. |e| = N·ΔΦ/Δt = 100·10⁻³/0,1 = 1 V.'],['Nếu B tăng đều trong 0,2 s thì suất điện động tăng gấp đôi.',false,'Sai. Thời gian dài gấp đôi thì từ thông thay đổi chậm hơn, suất điện động giảm một nửa.'],['Khi B đã đạt 0,2 T và giữ không đổi, khung vẫn có dòng điện cảm ứng.',false,'Sai. Từ thông không đổi thì không còn dòng điện cảm ứng.']]},
 {t:'sa',q:'Một vòng dây diện tích 0,02 m² đặt trong từ trường đều B = 0,5 T, ban đầu pháp tuyến cùng hướng với B. Quay vòng dây 90° trong 0,05 s. Độ lớn suất điện động cảm ứng trung bình là bao nhiêu vôn?',a:.2,tol:.002,u:'V',sol:'Lúc đầu Φ₁ = B·S·cos0° = 0,5·0,02 = 0,01 Wb. Lúc sau Φ₂ = B·S·cos90° = 0. |e| = |ΔΦ|/Δt = 0,01/0,05 = 0,2 V.'}]},

{id:'c3-4',ch:3,no:'3.4',title:'Máy phát điện xoay chiều. Dòng điện xoay chiều',sim:'gen',
 one:'Khung dây quay đều trong từ trường thì từ thông biến thiên điều hoà, sinh ra suất điện động xoay chiều e = NBSω·sin(ωt).',
 essence:`<p>Cho khung dây N vòng, diện tích S <b>quay đều</b> với tốc độ góc ω trong từ trường đều B (trục quay vuông góc với B). Góc giữa pháp tuyến và B là θ = ωt, nên từ thông qua khung là Φ = N·B·S·cos(ωt).</p>
 <p>Từ thông biến thiên liên tục nên trong khung có suất điện động cảm ứng e = N·B·S·ω·sin(ωt), có giá trị cực đại <b>E₀ = N·B·S·ω</b>. Chú ý: e lớn nhất khi Φ = 0 (mặt khung song song với đường sức), vì lúc đó từ thông <b>thay đổi nhanh nhất</b>.</p>
 <p>Dòng điện có cường độ biến thiên điều hoà theo thời gian, i = I₀·cos(ωt + φ), gọi là <b>dòng điện xoay chiều</b>. Chu kì T = 2π/ω, tần số f = 1/T. Điện lưới Việt Nam có f = 50 Hz.</p>
 <p><b>Giá trị hiệu dụng:</b> I = I₀/√2, U = U₀/√2. Đó là cường độ của dòng điện không đổi, khi chạy qua cùng một điện trở trong cùng thời gian thì toả ra cùng nhiệt lượng. Số ghi trên thiết bị (220 V) và số đo của đồng hồ là giá trị hiệu dụng.</p>
 <p><b>Máy phát điện xoay chiều</b> gồm phần cảm (nam châm tạo từ trường) và phần ứng (các cuộn dây có suất điện động). Nếu rôto là nam châm có p cặp cực quay n vòng/giây thì f = p·n.</p>`,
 observe:['Đường sức màu đậm là những đường đang xuyên qua khung. Khi khung nằm dọc theo đường sức, không đường nào xuyên qua: Φ = 0.','Nhìn đồ thị: đúng lúc Φ = 0 thì e lớn nhất, và lúc Φ lớn nhất thì e = 0.','Tăng tốc độ quay: E₀ tăng và tần số cũng tăng theo.','Tăng N hoặc B: E₀ tăng nhưng tần số không đổi.'],
 formulas:[{f:'e = N·B·S·ω·sin(ωt)',parts:[['E₀ = NBSω','suất điện động cực đại (V)'],['ω = 2πf','tốc độ góc (rad/s)']],why:'Đạo hàm của cos là sin: từ thông dạng cos thì suất điện động dạng sin, lệch nhau một phần tư chu kì. Quay nhanh hơn thì từ thông thay đổi nhanh hơn nên E₀ tỉ lệ với ω.'},
  {f:'I = I₀/√2   ·   U = U₀/√2',parts:[['I, U','giá trị hiệu dụng'],['I₀, U₀','giá trị cực đại']],why:'Nhiệt toả ra tỉ lệ với i². Trung bình của cos² trong một chu kì là ½, nên dòng không đổi tương đương có I² = I₀²/2.'},
  {f:'f = p·n',parts:[['p','số cặp cực của nam châm'],['n','số vòng quay mỗi giây']],why:'Mỗi cặp cực đi qua cuộn dây tạo một chu kì; quay một vòng có p cặp cực đi qua.'}],
 memo:'"Từ thông đỉnh thì điện bằng không, từ thông bằng không thì điện ở đỉnh." Hiệu dụng = cực đại chia √2.',
 wrong:[['Suất điện động lớn nhất khi từ thông qua khung lớn nhất.','Ngược lại: e lớn nhất khi Φ = 0, vì lúc đó Φ thay đổi nhanh nhất.'],['Với u = 220√2·cos(100πt) V thì f = 100 Hz.','ω = 100π rad/s nên f = ω/(2π) = 50 Hz.']],
 quiz:[
 {t:'mc',q:'Một khung dây quay đều trong từ trường đều. Suất điện động cảm ứng trong khung đạt giá trị cực đại khi:',c:0,o:[['Mặt khung song song với đường sức từ (từ thông qua khung bằng 0)','Đúng. Lúc này từ thông đang thay đổi nhanh nhất.'],['Mặt khung vuông góc với đường sức từ (từ thông cực đại)','Sai. Khi từ thông đạt cực đại, nó ngừng tăng và sắp giảm: tốc độ biến thiên bằng 0 nên e = 0.'],['Khung quay chậm nhất','Sai. Khung quay đều, và quay chậm thì e nhỏ hơn.'],['Không phụ thuộc vị trí của khung','Sai. e biến thiên theo sin(ωt), phụ thuộc vị trí của khung.']]},
 {t:'mc',q:'Điện áp xoay chiều u = 220√2·cos(100πt) V có giá trị hiệu dụng và tần số là:',c:0,o:[['220 V và 50 Hz','Đúng. U = U₀/√2 = 220 V; f = ω/(2π) = 100π/(2π) = 50 Hz.'],['220√2 V và 50 Hz','Sai. 220√2 V là giá trị cực đại U₀.'],['220 V và 100 Hz','Sai. Nhầm ω với f. Phải chia ω cho 2π.'],['311 V và 100π Hz','Sai. 311 V là U₀, còn 100π là tốc độ góc (rad/s).']]},
 {t:'mc',q:'Giá trị hiệu dụng của dòng điện xoay chiều được xây dựng dựa trên tác dụng nào?',c:0,o:[['Tác dụng nhiệt: bằng cường độ dòng không đổi toả cùng nhiệt lượng trên cùng điện trở trong cùng thời gian','Đúng. Vì vậy công suất toả nhiệt P = I²R dùng I hiệu dụng.'],['Giá trị trung bình của i trong một chu kì','Sai. Trung bình của i trong một chu kì bằng 0.'],['Giá trị lớn nhất của i','Sai. Đó là I₀, lớn hơn I hiệu dụng √2 lần.'],['Tác dụng từ của dòng điện','Sai. Định nghĩa dựa trên tác dụng nhiệt.']]},
 {t:'ds',q:'Một khung dây 200 vòng, diện tích mỗi vòng 100 cm², quay đều 50 vòng/giây quanh trục vuông góc với từ trường đều B = 0,1 T.',s:[['Tốc độ góc của khung là 100π rad/s.',true,'Đúng. ω = 2πn = 2π·50 = 100π rad/s.'],['Suất điện động cực đại khoảng 62,8 V.',true,'Đúng. E₀ = NBSω = 200·0,1·0,01·100π = 20π ≈ 62,8 V.'],['Suất điện động hiệu dụng khoảng 88,8 V.',false,'Sai. E = E₀/√2 ≈ 44,4 V. Con số 88,8 V là do nhân √2 thay vì chia.'],['Nếu tốc độ quay tăng gấp đôi thì E₀ và tần số đều tăng gấp đôi.',true,'Đúng. E₀ tỉ lệ với ω, và f = n cũng tăng gấp đôi.']]},
 {t:'sa',q:'Một máy phát điện xoay chiều có rôto là nam châm gồm 4 cặp cực, quay với tốc độ 750 vòng/phút. Tần số của dòng điện do máy phát ra là bao nhiêu Hz?',a:50,tol:.01,u:'Hz',sol:'n = 750 vòng/phút = 12,5 vòng/giây. f = p·n = 4·12,5 = 50 Hz.'}]},

{id:'c3-5',ch:3,no:'3.5',title:'Điện từ trường. Sóng điện từ',sim:'emwave',
 one:'Điện trường biến thiên sinh ra từ trường và ngược lại. Chúng lan truyền cùng nhau thành sóng điện từ, đi được cả trong chân không với tốc độ c.',
 essence:`<p>Maxwell phát hiện: từ trường biến thiên sinh ra <b>điện trường xoáy</b> (đường sức khép kín), và điện trường biến thiên sinh ra <b>từ trường</b>. Hai trường này không tách rời nhau, là hai mặt của một trường thống nhất gọi là <b>điện từ trường</b>.</p>
 <p><b>Sóng điện từ</b> là điện từ trường lan truyền trong không gian. Đặc điểm:</p>
 <ul><li>Truyền được trong <b>chân không</b> với tốc độ c = 3·10⁸ m/s. Trong các môi trường khác tốc độ nhỏ hơn.</li>
 <li>Là <b>sóng ngang</b>: E ⊥ B ⊥ phương truyền. E và B dao động <b>cùng pha</b>, cùng tần số.</li>
 <li>Có phản xạ, khúc xạ, giao thoa như ánh sáng, và mang năng lượng.</li></ul>
 <p>Bước sóng λ = c/f. Sắp xếp theo bước sóng giảm dần (tần số tăng dần): <b>sóng vô tuyến</b> (gồm vi sóng) → <b>hồng ngoại</b> → <b>ánh sáng nhìn thấy</b> (khoảng 380 nm đến 760 nm) → <b>tử ngoại</b> → <b>tia X</b> → <b>tia γ</b>. Ranh giới giữa các vùng chỉ là gần đúng. Bước sóng càng ngắn, năng lượng càng lớn và càng có hại cho cơ thể.</p>`,
 observe:['Kéo tần số tăng dần: bước sóng ngắn lại, mũi tên trên thang sóng chạy sang phải.','E (dọc) và B (xiên, vuông góc với E) luôn đạt cực đại cùng lúc: chúng dao động cùng pha.','Kéo vào vùng ánh sáng nhìn thấy: màu của sóng đổi từ đỏ (bước sóng dài) sang tím (bước sóng ngắn).','Thử f = 2,4 GHz (wifi) và f = 100 MHz (đài FM) để xem bước sóng thực tế.'],
 formulas:[{f:'λ = c/f = c·T',parts:[['λ','bước sóng (m)'],['c','3·10⁸ m/s trong chân không'],['f','tần số (Hz)']],why:'Trong một chu kì T, sóng đi được đúng một bước sóng: λ = c·T.'},
  {f:'E ⊥ B ⊥ v',parts:[['E','cường độ điện trường'],['B','cảm ứng từ'],['v','phương truyền sóng']],why:'Ba hướng vuông góc từng đôi một, nên sóng điện từ là sóng ngang.'}],
 table:{head:['Vùng sóng','Bước sóng (gần đúng)','Ứng dụng'],rows:[['Sóng vô tuyến','từ 1 mm trở lên','Phát thanh, truyền hình, wifi, điện thoại'],['Hồng ngoại','760 nm – 1 mm','Điều khiển từ xa, sưởi, camera nhiệt'],['Ánh sáng nhìn thấy','380 nm – 760 nm','Thị giác, chiếu sáng'],['Tử ngoại','10 nm – 380 nm','Diệt khuẩn, khử trùng'],['Tia X','10⁻¹¹ m – 10⁻⁸ m','Chụp X-quang, kiểm tra an ninh'],['Tia γ','dưới 10⁻¹¹ m','Xạ trị, khử trùng thực phẩm']]},
 memo:'Thứ tự từ bước sóng dài đến ngắn: "Vui Học Ánh Trăng Xa Gần" (Vô tuyến, Hồng ngoại, Ánh sáng, Tử ngoại, X, Gamma).',
 wrong:[['Sóng điện từ cần môi trường để truyền như sóng âm.','Sóng điện từ truyền được cả trong chân không; ánh sáng Mặt Trời tới Trái Đất qua khoảng chân không.'],['Trong sóng điện từ, E và B lệch pha nhau 90°.','E và B dao động cùng pha: cùng lúc đạt cực đại, cùng lúc bằng 0.']],
 quiz:[
 {t:'mc',q:'Trong sóng điện từ, vectơ cường độ điện trường E và vectơ cảm ứng từ B:',c:0,o:[['Vuông góc với nhau, vuông góc với phương truyền và dao động cùng pha','Đúng. Đây là đặc điểm của sóng ngang điện từ.'],['Cùng phương với phương truyền sóng','Sai. Như vậy là sóng dọc; sóng điện từ là sóng ngang.'],['Vuông góc với nhau nhưng lệch pha 90°','Sai. E và B dao động cùng pha.'],['Song song với nhau','Sai. E và B luôn vuông góc với nhau.']]},
 {t:'mc',q:'Sóng điện từ có tần số 100 MHz (sóng FM) truyền trong chân không có bước sóng:',c:0,o:[['3 m','Đúng. λ = c/f = 3·10⁸/10⁸ = 3 m.'],['0,3 m','Sai. Sai một bậc mười: 100 MHz = 10⁸ Hz.'],['30 m','Sai. Đây là kết quả khi lấy f = 10⁷ Hz.'],['3·10⁸ m','Sai. Đó là tốc độ ánh sáng tính bằng m/s, chưa chia cho tần số.']]},
 {t:'mc',q:'Điểm khác nhau quan trọng giữa sóng điện từ và sóng âm là:',c:0,o:[['Sóng điện từ truyền được trong chân không, còn sóng âm thì không','Đúng. Sóng âm cần môi trường vật chất (khí, lỏng, rắn) để truyền.'],['Sóng điện từ là sóng dọc','Sai. Sóng điện từ là sóng ngang.'],['Sóng âm truyền nhanh hơn sóng điện từ','Sai. Âm truyền trong không khí khoảng 340 m/s, còn sóng điện từ khoảng 3·10⁸ m/s.'],['Sóng âm mang năng lượng, còn sóng điện từ thì không','Sai. Cả hai đều mang năng lượng.']]},
 {t:'ds',q:'Xét các phát biểu về thang sóng điện từ:',s:[['Ánh sáng nhìn thấy có bước sóng trong khoảng từ 380 nm đến 760 nm.',true,'Đúng. Đỏ ở phía bước sóng dài, tím ở phía bước sóng ngắn.'],['Tia X có bước sóng dài hơn tia hồng ngoại.',false,'Sai. Tia X có bước sóng ngắn hơn rất nhiều, nên năng lượng lớn hơn và đâm xuyên mạnh.'],['Tia hồng ngoại được dùng trong bộ điều khiển từ xa của tivi.',true,'Đúng. Điều khiển từ xa phát tia hồng ngoại.'],['Trong chân không, mọi sóng điện từ truyền với cùng tốc độ c.',true,'Đúng. Các sóng khác nhau ở tần số và bước sóng, không khác ở tốc độ trong chân không.']]},
 {t:'sa',q:'Wifi phát sóng điện từ có tần số 2,4 GHz. Bước sóng của sóng này trong không khí là bao nhiêu xentimét? (Lấy c = 3·10⁸ m/s)',a:12.5,tol:.05,u:'cm',sol:'λ = c/f = 3·10⁸/(2,4·10⁹) = 0,125 m = 12,5 cm.'}]},

{id:'c4-1',ch:4,no:'4.1',title:'Cấu trúc hạt nhân',sim:'ruth',
 one:'Nguyên tử có một hạt nhân rất nhỏ, mang điện dương, chứa gần như toàn bộ khối lượng. Hạt nhân gồm proton và neutron, kí hiệu ᴬ_Z X.',
 essence:`<p><b>Thí nghiệm tán xạ hạt α của Rutherford (1911):</b> bắn chùm hạt α vào một lá vàng rất mỏng. Hầu hết hạt α đi thẳng qua, một số ít bị lệch, và rất hiếm hạt bị bật ngược lại. Kết luận: nguyên tử gần như là khoảng trống, ở giữa có một <b>hạt nhân</b> rất nhỏ, mang điện dương và chứa gần như toàn bộ khối lượng nguyên tử.</p>
 <p>Hạt nhân gồm các <b>proton</b> (điện tích +e) và <b>neutron</b> (không mang điện), gọi chung là <b>nucleon</b>. Kí hiệu <b>ᴬ<sub>Z</sub>X</b>:</p>
 <ul><li><b>Z</b> là số proton, cũng là số thứ tự trong bảng tuần hoàn. Điện tích hạt nhân là +Ze.</li>
 <li><b>A</b> là số khối, bằng tổng số nucleon. Số neutron <b>N = A − Z</b>.</li>
 <li><b>Đồng vị:</b> các hạt nhân có cùng Z nhưng khác N, ví dụ ¹²C và ¹⁴C. Chúng có tính chất hoá học giống nhau.</li></ul>
 <p>Bán kính hạt nhân R ≈ 1,2·10⁻¹⁵·A^(1/3) m, nhỏ hơn bán kính nguyên tử khoảng 10⁴ đến 10⁵ lần. Đơn vị khối lượng nguyên tử: 1 u = 1/12 khối lượng nguyên tử ¹²C ≈ 1,66·10⁻²⁷ kg; mₚ ≈ 1,00728 u, mₙ ≈ 1,00866 u.</p>
 <p><b>Lực hạt nhân</b> là lực hút rất mạnh giữa các nucleon, mạnh hơn nhiều lực đẩy điện giữa các proton, nhưng chỉ tác dụng trong phạm vi rất ngắn, cỡ 10⁻¹⁵ m. Lực này không phụ thuộc điện tích, nên tác dụng cả giữa các neutron.</p>`,
 observe:['Thí nghiệm Rutherford: để mô phỏng chạy một lúc rồi xem bảng thống kê. Đa số hạt α lệch rất ít.','Thỉnh thoảng có hạt đi rất gần một hạt nhân và bị bật ngược: đó là bằng chứng hạt nhân nhỏ, nặng, mang điện dương.','Chọn "Lắp hạt nhân": giữ Z, thay đổi N để xem các đồng vị của cùng một nguyên tố.','Thử tạo ¹²C (Z = 6, N = 6) và ¹⁴C (Z = 6, N = 8). Chương trình cho biết đồng vị nào bền.'],
 formulas:[{f:'A = Z + N',parts:[['A','số khối (số nucleon)'],['Z','số proton'],['N','số neutron']],why:'Proton và neutron có khối lượng xấp xỉ 1 u, nên A cũng gần bằng khối lượng hạt nhân tính theo u.'},
  {f:'R ≈ 1,2·10⁻¹⁵·A^(1/3) m',parts:[['R','bán kính hạt nhân'],['A^(1/3)','căn bậc ba của số khối']],why:'Các nucleon xếp sát nhau như những viên bi, nên thể tích tỉ lệ với A, còn bán kính tỉ lệ với căn bậc ba của A.'}],
 memo:'"A ở trên là tổng, Z ở dưới là proton." Đồng vị: "cùng Z, khác N".',
 wrong:[['Hạt nhân chiếm phần lớn thể tích nguyên tử.','Hạt nhân rất nhỏ (cỡ 10⁻¹⁵ m), nhưng chiếm gần như toàn bộ khối lượng nguyên tử.'],['Số khối A là số proton.','A là tổng số proton và neutron. Số proton là Z.']],
 quiz:[
 {t:'mc',q:'Trong thí nghiệm Rutherford, phần lớn hạt α đi thẳng qua lá vàng, chỉ rất ít hạt bị lệch mạnh hoặc bật ngược. Điều đó chứng tỏ:',c:0,o:[['Nguyên tử có một hạt nhân rất nhỏ mang điện dương, phần lớn nguyên tử là khoảng trống','Đúng. Hạt α chỉ bị lệch mạnh khi đi rất gần hạt nhân, mà hạt nhân lại rất nhỏ nên hiếm khi xảy ra.'],['Nguyên tử là một khối đặc mang điện dương phân bố đều','Sai. Nếu điện tích dương phân bố đều thì không có hạt α nào bị bật ngược.'],['Hạt α không mang điện','Sai. Hạt α mang điện +2e; chính lực đẩy điện làm nó bị lệch.'],['Các electron đã chặn hạt α lại','Sai. Electron rất nhẹ, không thể làm hạt α nặng bật ngược.']]},
 {t:'mc',q:'Hạt nhân ⁵⁶₂₆Fe có:',c:0,o:[['26 proton và 30 neutron','Đúng. Z = 26 proton; N = A − Z = 56 − 26 = 30 neutron.'],['26 neutron và 30 proton','Sai. Số dưới (26) là số proton.'],['56 proton','Sai. 56 là số khối, tức tổng số nucleon.'],['26 proton và 56 neutron','Sai. Số neutron phải lấy A trừ đi Z.']]},
 {t:'mc',q:'Các hạt nhân đồng vị là những hạt nhân có:',c:0,o:[['Cùng số proton, khác số neutron','Đúng. Cùng Z nên cùng là một nguyên tố, cùng vị trí trong bảng tuần hoàn.'],['Cùng số neutron, khác số proton','Sai. Khác số proton là khác nguyên tố.'],['Cùng số khối A','Sai. Đồng vị có số khối khác nhau.'],['Cùng khối lượng','Sai. Khác số neutron nên khối lượng khác nhau.']]},
 {t:'ds',q:'Xét các phát biểu về lực hạt nhân:',s:[['Lực hạt nhân là lực hút giữ các nucleon liên kết với nhau trong hạt nhân.',true,'Đúng. Nhờ lực này hạt nhân không bị lực đẩy điện giữa các proton làm tan rã.'],['Lực hạt nhân có bản chất là lực điện.',false,'Sai. Lực hạt nhân không phụ thuộc điện tích; nó tác dụng cả giữa hai neutron không mang điện.'],['Lực hạt nhân chỉ tác dụng trong phạm vi rất ngắn, cỡ kích thước hạt nhân.',true,'Đúng. Phạm vi tác dụng cỡ 10⁻¹⁵ m; ra xa hơn thì lực gần như bằng 0.'],['Trong hạt nhân, lực đẩy điện giữa hai proton mạnh hơn lực hút hạt nhân.',false,'Sai. Ở khoảng cách trong hạt nhân, lực hạt nhân mạnh hơn nhiều, nên hạt nhân bền.']]},
 {t:'sa',q:'Bán kính hạt nhân được tính gần đúng bằng R ≈ 1,2·10⁻¹⁵·A^(1/3) m. Bán kính hạt nhân ²⁷₁₃Al bằng bao nhiêu fm? (1 fm = 10⁻¹⁵ m)',a:3.6,tol:.02,u:'fm',sol:'A = 27 nên A^(1/3) = 3. R ≈ 1,2·3 = 3,6 fm = 3,6·10⁻¹⁵ m.'}]},

{id:'c4-2',ch:4,no:'4.2',title:'Năng lượng liên kết. Phản ứng hạt nhân',sim:'bind',
 one:'Khối lượng hạt nhân nhỏ hơn tổng khối lượng các nucleon tạo nên nó. Phần hụt khối đó chính là năng lượng liên kết, theo E = mc².',
 essence:`<p>Einstein: khối lượng và năng lượng tương đương nhau, <b>E = m·c²</b>. Trong vật lí hạt nhân hay dùng: 1 u ≈ 931,5 MeV/c², và 1 MeV = 1,6·10⁻¹³ J.</p>
 <p><b>Độ hụt khối:</b> khối lượng hạt nhân luôn <b>nhỏ hơn</b> tổng khối lượng các nucleon riêng rẽ tạo nên nó: Δm = Z·mₚ + (A − Z)·mₙ − m<sub>X</sub>.</p>
 <p><b>Năng lượng liên kết</b> W = Δm·c² là năng lượng cần để tách hạt nhân thành các nucleon riêng rẽ (cũng là năng lượng toả ra khi các nucleon kết hợp lại). <b>Năng lượng liên kết riêng</b> W/A là năng lượng liên kết tính cho một nucleon; <b>W/A càng lớn thì hạt nhân càng bền</b>. Các hạt nhân có A khoảng 50 đến 80 (quanh ⁵⁶Fe) bền nhất, khoảng 8,8 MeV/nucleon.</p>
 <p><b>Phản ứng hạt nhân</b> là quá trình các hạt nhân tương tác và biến đổi thành hạt nhân khác. Các đại lượng được <b>bảo toàn</b>: số nucleon A, điện tích Z, năng lượng toàn phần và động lượng. <b>Khối lượng nghỉ không bảo toàn</b>.</p>
 <p>Năng lượng của phản ứng: ΔE = (m<sub>trước</sub> − m<sub>sau</sub>)·c². Nếu khối lượng giảm (ΔE &gt; 0) thì phản ứng <b>toả</b> năng lượng; nếu khối lượng tăng thì phản ứng <b>thu</b> năng lượng.</p>`,
 observe:['Chọn lần lượt ⁴He, ¹²C, ¹⁶O, ⁵⁶Fe, ²³⁵U: xem từng bước tính độ hụt khối và năng lượng liên kết.','⁵⁶Fe nằm gần đỉnh đồ thị nên bền nhất. ²³⁵U có năng lượng liên kết toàn phần lớn nhất nhưng W/A lại nhỏ hơn Fe.','Chọn phản ứng D + T: tổng khối lượng sau nhỏ hơn trước, phần chênh lệch biến thành 17,6 MeV.'],
 formulas:[{f:'Δm = Z·mₚ + (A − Z)·mₙ − m_X',parts:[['Δm','độ hụt khối (u)'],['m_X','khối lượng hạt nhân X']],why:'Khi các nucleon liên kết lại, chúng toả ra năng lượng, nên hệ "nhẹ đi" đúng bằng năng lượng đó chia cho c².'},
  {f:'W = Δm·c²   ·   W/A',parts:[['W','năng lượng liên kết (MeV)'],['W/A','năng lượng liên kết riêng, đặc trưng cho độ bền'],['1 u·c²','≈ 931,5 MeV']],why:'Muốn so sánh độ bền phải chia cho số nucleon, vì hạt nhân lớn đương nhiên có tổng năng lượng liên kết lớn.'},
  {f:'ΔE = (m_trước − m_sau)·c²',parts:[['ΔE > 0','phản ứng toả năng lượng'],['ΔE < 0','phản ứng thu năng lượng']],why:'Bảo toàn năng lượng toàn phần: khối lượng nghỉ giảm bao nhiêu thì năng lượng (động năng, bức xạ) tăng bấy nhiêu.'}],
 memo:'"Ghép lại thì nhẹ đi, phần nhẹ đi là năng lượng." Bền hay không: nhìn W/A, đừng nhìn W.',
 wrong:[['Hạt nhân có năng lượng liên kết lớn hơn thì bền hơn.','Phải so sánh năng lượng liên kết riêng W/A. ²³⁵U có W lớn hơn ⁵⁶Fe nhưng kém bền hơn.'],['Trong phản ứng hạt nhân, tổng khối lượng được bảo toàn.','Khối lượng nghỉ không bảo toàn; chỉ số nucleon, điện tích, năng lượng toàn phần và động lượng được bảo toàn.']],
 quiz:[
 {t:'mc',q:'Năng lượng liên kết riêng của một hạt nhân là:',c:0,o:[['Năng lượng liên kết tính cho một nucleon, đặc trưng cho độ bền vững của hạt nhân','Đúng. W/A càng lớn thì hạt nhân càng bền.'],['Năng lượng liên kết của toàn bộ hạt nhân','Sai. Đó là năng lượng liên kết W, chưa chia cho A.'],['Năng lượng cần để tách một electron ra khỏi nguyên tử','Sai. Đó là năng lượng ion hoá, không liên quan đến hạt nhân.'],['Năng lượng nghỉ của hạt nhân','Sai. Năng lượng nghỉ là m·c², lớn hơn rất nhiều.']]},
 {t:'mc',q:'Trong các hạt nhân ⁴He (7,07 MeV/nucleon), ⁵⁶Fe (8,79 MeV/nucleon), ²³⁵U (7,59 MeV/nucleon), ¹²C (7,68 MeV/nucleon), hạt nhân bền vững nhất là:',c:0,o:[['⁵⁶Fe','Đúng. Năng lượng liên kết riêng của ⁵⁶Fe lớn nhất.'],['²³⁵U','Sai. ²³⁵U có năng lượng liên kết toàn phần lớn nhất, nhưng tính cho mỗi nucleon thì nhỏ hơn Fe.'],['⁴He','Sai. ⁴He bền hơn các hạt nhẹ lân cận nhưng W/A vẫn nhỏ hơn Fe.'],['¹²C','Sai. 7,68 MeV/nucleon nhỏ hơn 8,79 MeV/nucleon của Fe.']]},
 {t:'mc',q:'Trong phản ứng hạt nhân, đại lượng nào KHÔNG được bảo toàn?',c:0,o:[['Tổng khối lượng nghỉ của các hạt','Đúng. Khối lượng nghỉ có thể giảm hoặc tăng; phần chênh lệch chuyển thành năng lượng hoặc ngược lại.'],['Tổng số nucleon','Sai. Số nucleon A được bảo toàn.'],['Tổng điện tích','Sai. Điện tích Z được bảo toàn.'],['Năng lượng toàn phần','Sai. Năng lượng toàn phần luôn được bảo toàn.']]},
 {t:'ds',q:'Hạt nhân ⁴₂He có khối lượng 4,0015 u. Cho mₚ = 1,0073 u, mₙ = 1,0087 u, 1 u = 931,5 MeV/c².',s:[['Độ hụt khối của hạt nhân là 0,0305 u.',true,'Đúng. Δm = 2·1,0073 + 2·1,0087 − 4,0015 = 4,0320 − 4,0015 = 0,0305 u.'],['Năng lượng liên kết khoảng 28,4 MeV.',true,'Đúng. W = 0,0305·931,5 ≈ 28,4 MeV.'],['Năng lượng liên kết riêng khoảng 14,2 MeV/nucleon.',false,'Sai. Phải chia cho số nucleon A = 4, không phải số proton: W/A ≈ 7,1 MeV/nucleon.'],['Khối lượng hạt nhân lớn hơn tổng khối lượng các nucleon tạo nên nó.',false,'Sai. Ngược lại: hạt nhân nhẹ hơn, đó chính là độ hụt khối.']]},
 {t:'sa',q:'Xét phản ứng ²₁H + ³₁H → ⁴₂He + ¹₀n. Biết m(²H) = 2,01355 u; m(³H) = 3,01550 u; m(⁴He) = 4,00151 u; m(n) = 1,00866 u; 1 u = 931,5 MeV/c². Năng lượng toả ra là bao nhiêu MeV? (Làm tròn đến 1 chữ số thập phân)',a:17.6,tol:.06,u:'MeV',sol:'m(trước) = 2,01355 + 3,01550 = 5,02905 u; m(sau) = 4,00151 + 1,00866 = 5,01017 u. Δm = 0,01888 u. ΔE = 0,01888·931,5 ≈ 17,6 MeV.'}]},

{id:'c4-3',ch:4,no:'4.3',title:'Hiện tượng phóng xạ',sim:'decay',
 one:'Hạt nhân không bền tự phân rã một cách ngẫu nhiên. Cứ sau mỗi chu kì bán rã T, số hạt nhân còn lại giảm một nửa.',
 essence:`<p><b>Phóng xạ</b> là quá trình một hạt nhân không bền <b>tự phát</b> phân rã, phát ra tia phóng xạ và biến đổi thành hạt nhân khác.</p>
 <ul><li>Phóng xạ là quá trình <b>tự phát</b>, <b>không điều khiển được</b>, không phụ thuộc nhiệt độ, áp suất hay trạng thái hoá học.</li>
 <li>Phóng xạ có tính <b>ngẫu nhiên</b>: không biết trước hạt nhân nào phân rã lúc nào. Nhưng với rất nhiều hạt nhân, số hạt phân rã tuân theo quy luật thống kê chặt chẽ.</li></ul>
 <p><b>Các loại phóng xạ:</b></p>
 <ul><li><b>α</b>: phát ra hạt nhân ⁴₂He. Hạt nhân con có A giảm 4, Z giảm 2.</li>
 <li><b>β⁻</b>: phát ra electron (kèm phản neutrino), do một neutron biến thành proton. A giữ nguyên, Z tăng 1.</li>
 <li><b>β⁺</b>: phát ra positron (kèm neutrino), do một proton biến thành neutron. A giữ nguyên, Z giảm 1.</li>
 <li><b>γ</b>: photon năng lượng rất cao, thường đi kèm phóng xạ α hoặc β. Không làm thay đổi A và Z.</li></ul>
 <p><b>Định luật phóng xạ:</b> N = N₀·2^(−t/T) = N₀·e^(−λt), với T là <b>chu kì bán rã</b> và λ = ln2/T là hằng số phóng xạ. <b>Độ phóng xạ</b> H = λ·N là số phân rã mỗi giây, đơn vị becơren (Bq); độ phóng xạ cũng giảm theo cùng quy luật.</p>
 <p>Ứng dụng: xác định tuổi cổ vật bằng ¹⁴C, đánh dấu đồng vị trong y học và nông nghiệp, xạ trị.</p>`,
 observe:['Mỗi chấm là một hạt nhân. Không đoán được chấm nào sẽ tắt tiếp theo: phân rã là ngẫu nhiên.','Nhưng đường thực nghiệm (liền) luôn bám sát đường lí thuyết (nét đứt): sau T còn ½, sau 2T còn ¼.','Đổi chu kì bán rã: T càng nhỏ, chất phân rã càng nhanh.','Độ phóng xạ (số phân rã mỗi giây) giảm dần theo thời gian vì số hạt nhân còn lại ít đi.'],
 formulas:[{f:'N = N₀·2^(−t/T)',parts:[['N₀','số hạt nhân ban đầu'],['N','số hạt nhân còn lại sau thời gian t'],['T','chu kì bán rã']],why:'Mỗi hạt nhân có cùng một xác suất phân rã trong mỗi giây, nên trong mỗi khoảng thời gian bằng nhau, luôn có cùng một tỉ lệ hạt nhân bị phân rã.'},
  {f:'λ = ln2/T   ·   H = λ·N',parts:[['λ','hằng số phóng xạ (s⁻¹)'],['H','độ phóng xạ (Bq = phân rã/giây)']],why:'Còn càng nhiều hạt nhân thì mỗi giây càng có nhiều hạt phân rã, nên H tỉ lệ với N.'},
  {f:'ΔN = N₀ − N = N₀·(1 − 2^(−t/T))',parts:[['ΔN','số hạt nhân đã phân rã']],why:'Số đã phân rã cộng số còn lại luôn bằng N₀.'}],
 memo:'"Mỗi T còn một nửa": 1 → ½ → ¼ → ⅛. Phóng xạ α: "A trừ 4, Z trừ 2".',
 wrong:[['Làm lạnh hoặc nung nóng mẫu sẽ làm thay đổi chu kì bán rã.','Phóng xạ không phụ thuộc điều kiện bên ngoài; chu kì bán rã là hằng số của từng đồng vị.'],['Sau 2 chu kì bán rã thì chất phóng xạ hết.','Sau 2T vẫn còn ¼; lượng chất chỉ giảm dần, không bao giờ hết hẳn trong thời gian hữu hạn.']],
 quiz:[
 {t:'mc',q:'Phát biểu nào đúng về hiện tượng phóng xạ?',c:0,o:[['Là quá trình tự phát, không chịu ảnh hưởng của nhiệt độ hay áp suất','Đúng. Phóng xạ xảy ra trong hạt nhân, các tác động bên ngoài không ảnh hưởng tới nó.'],['Có thể làm chậm lại bằng cách làm lạnh thật mạnh','Sai. Nhiệt độ không ảnh hưởng tới phóng xạ.'],['Chỉ xảy ra khi chất được chiếu sáng','Sai. Phóng xạ xảy ra tự phát, kể cả trong bóng tối.'],['Có thể biết trước hạt nhân nào sẽ phân rã tiếp theo','Sai. Phóng xạ có tính ngẫu nhiên, chỉ dự đoán được về mặt thống kê.']]},
 {t:'mc',q:'Hạt nhân ²³⁸₉₂U phóng xạ α tạo thành hạt nhân:',c:0,o:[['²³⁴₉₀Th','Đúng. Phóng xạ α: A giảm 4 (238 → 234), Z giảm 2 (92 → 90). Z = 90 là thori.'],['²³⁴₉₂U','Sai. Phải giảm cả Z đi 2, vì hạt α mang 2 proton.'],['²³⁸₉₃Np','Sai. Đây là kết quả của phóng xạ β⁻ (A giữ nguyên, Z tăng 1).'],['²³⁴₉₄Pu','Sai. Z phải giảm 2 chứ không tăng 2.']]},
 {t:'mc',q:'Một chất phóng xạ có chu kì bán rã 8 ngày. Sau 24 ngày, lượng chất phóng xạ còn lại bằng bao nhiêu phần lượng ban đầu?',c:0,o:[['1/8','Đúng. 24 ngày = 3T, nên còn lại (1/2)³ = 1/8.'],['1/3','Sai. Lượng chất giảm theo cấp số nhân, không chia đều.'],['1/24','Sai. Không phải chia cho số ngày.'],['1/6','Sai. Đây là 1/(2·3), phải là 1/2³.']]},
 {t:'ds',q:'Một mẫu chất có N₀ hạt nhân phóng xạ với chu kì bán rã T.',s:[['Sau thời gian 2T, số hạt nhân đã bị phân rã là 3N₀/4.',true,'Đúng. Sau 2T còn N₀/4, nên đã phân rã N₀ − N₀/4 = 3N₀/4.'],['Hằng số phóng xạ λ = ln2/T.',true,'Đúng. Đây là mối liên hệ giữa λ và T.'],['Độ phóng xạ của mẫu không đổi theo thời gian.',false,'Sai. H = λN giảm theo cùng quy luật với N.'],['Nếu nung mẫu lên 1000 °C thì chu kì bán rã giảm.',false,'Sai. Chu kì bán rã không phụ thuộc nhiệt độ.']]},
 {t:'sa',q:'Đồng vị ¹⁴C có chu kì bán rã 5730 năm. Một mẫu gỗ cổ chỉ còn 25% lượng ¹⁴C so với mẫu gỗ tươi cùng loại, cùng khối lượng. Tuổi của mẫu gỗ là bao nhiêu năm?',a:11460,tol:1,u:'năm',sol:'Còn 25% = 1/4 = (1/2)², tức đã trải qua 2 chu kì bán rã. t = 2·5730 = 11 460 năm.'}]},

{id:'c4-4',ch:4,no:'4.4',title:'Phản ứng phân hạch, nhiệt hạch. Công nghiệp hạt nhân',sim:'chain',
 one:'Hạt nhân nặng vỡ ra (phân hạch) hoặc hạt nhân nhẹ ghép lại (nhiệt hạch) đều toả năng lượng. Lò phản ứng giữ phản ứng dây chuyền ở mức k = 1.',
 essence:`<p><b>Phân hạch:</b> một hạt nhân nặng như ²³⁵U hấp thụ một neutron chậm, vỡ thành hai hạt nhân trung bình, đồng thời phát ra 2 hoặc 3 neutron và toả khoảng 200 MeV.</p>
 <p><b>Phản ứng dây chuyền:</b> các neutron sinh ra lại gây phân hạch cho hạt nhân khác. Gọi <b>k</b> là số neutron trung bình còn lại sau mỗi lần phân hạch để gây phân hạch tiếp:</p>
 <ul><li>k &lt; 1: phản ứng tắt dần.</li><li>k = 1: phản ứng duy trì ổn định, năng lượng toả ra đều đặn. Đây là chế độ của <b>lò phản ứng hạt nhân</b>.</li><li>k &gt; 1: phản ứng tăng vọt, không kiểm soát được, như trong bom nguyên tử.</li></ul>
 <p><b>Lò phản ứng</b> gồm: thanh nhiên liệu (urani đã làm giàu), <b>chất làm chậm</b> neutron (nước, than chì), <b>thanh điều khiển</b> chứa bo hoặc cađimi để hấp thụ bớt neutron, và chất tải nhiệt đưa nhiệt ra ngoài làm quay tuabin phát điện.</p>
 <p><b>Nhiệt hạch:</b> hai hạt nhân nhẹ (như đơteri, triti) kết hợp thành hạt nhân nặng hơn. Cần nhiệt độ cực cao, hàng chục triệu độ, để các hạt nhân thắng được lực đẩy điện và tiến sát nhau. Đây là nguồn năng lượng của Mặt Trời và các ngôi sao. Tính theo cùng khối lượng nhiên liệu, nhiệt hạch toả năng lượng nhiều hơn phân hạch, nhiên liệu dồi dào và ít chất thải phóng xạ, nhưng con người chưa kiểm soát được để phát điện thương mại.</p>`,
 observe:['Để độ cắm thanh điều khiển 30% rồi bấm "Bắn 10 neutron vào": số neutron tăng vọt, k > 1.','Cắm thanh sâu (từ 75% trở lên) rồi bắn lại: phản ứng nhanh chóng tắt, k < 1.','Thử trong khoảng 55% đến 65%: k dao động quanh 1, số neutron lúc tăng lúc giảm. Lò phản ứng thật dùng thanh điều khiển để giữ đúng trạng thái này.','Mỗi chớp cam là một lần phân hạch, sinh ra 2 hoặc 3 neutron mới.'],
 formulas:[{f:'n + ²³⁵U → X + Y + (2 hoặc 3) n + ≈ 200 MeV',parts:[['X, Y','hai hạt nhân trung bình (mảnh phân hạch)']],why:'Hạt nhân nặng có W/A khoảng 7,6 MeV, các mảnh trung bình khoảng 8,5 MeV. Mỗi nucleon "lên dốc" khoảng 0,9 MeV, nhân với 235 nucleon được khoảng 200 MeV.'},
  {f:'²H + ³H → ⁴He + n + 17,6 MeV',parts:[['²H','đơteri'],['³H','triti']],why:'Mỗi phản ứng toả ít năng lượng hơn phân hạch, nhưng tính trên mỗi nucleon thì nhiều hơn (khoảng 3,5 MeV so với 0,85 MeV).'},
