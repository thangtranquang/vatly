services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Set to "false" only if you open the site over plain http (no domain, no HTTPS).
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: "true"
    volumes:
      - app-data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Hãy đặt DOMAIN trong file .env, ví dụ DOMAIN=vatly.truongcuaban.vn}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
